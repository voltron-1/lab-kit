# Canonical event/rule id registry for the SOC Analyst Lab (Coppermine universe).
#
# Binding source: docs/plans/soc-p01-plan.md §2.2, docs/plans/soc-p2-plan.md §2.1.
# Every scenario yaml under tools/genevidence/scenarios/ MUST import an id from
# here when it touches an event or rule another lab already pinned, rather than
# minting a new CM-<MMDD>-<seq> / CM-R-<nnnn> for the same underlying event —
# that's the cross-scenario collision the p0/p1 review panel caught and this
# registry exists to prevent from regressing.
#
# id_bands records which <MMDD>-<seq> ranges a phase has already claimed, so the
# next phase picks an unused band instead of colliding.

id_bands:
  phase1: "0002-0245, 0301-0460"
  phase2: "0500-0522"

