name: CI Quality Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck-and-lint:
    name: ShellCheck & Lab Structural Lint
    # Pinned, not ubuntu-latest: the kit targets Ubuntu 24.04 (tshark 4.2), and
    # on 26.04 (tshark 4.6) verify.py's pcap/zeek check fails reading
    # L2.7's capture.pcap. Move this when the pcap is checked against 4.6.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            jq shellcheck ripgrep shfmt tshark whois dnsutils

      - name: Check the runner has the toolchains the acceptance suite needs
        # Acceptance drives the ps track with pwsh and the rust track with rustc/cargo,
        # and relies on the runner image shipping them. Fail here, naming the tool,
        # instead of 300 assertions later with a cascade of rc=2.
        run: |
          missing=0
          for tool in pwsh rustc cargo; do
            if command -v "$tool" > /dev/null 2>&1; then
              echo "ok: $tool -> $(command -v "$tool")"
            else
              echo "::error::runner image has no '$tool'; install it in this job"
              missing=1
            fi
          done
          exit "$missing"

      - name: Run ShellCheck
        run: ./tools/shellcheck-all.sh

      - name: Run Lab Structural Lint
        run: ./tools/lint-labs.sh

      - name: Run Acceptance Test Suite
        run: bash tests/acceptance.sh

      - name: Run Interactive Session Suite
        run: bash tests/session.sh

  powershell-lint:
    name: PSScriptAnalyzer (PowerShell)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser

          # These files are lesson content whose PSSA findings ARE the lesson,
          # not bugs -- do not "fix" them to silence this gate:
          #   - candidate.ps1 (ps L7.5): its PSSA output is pinned verbatim
          #     into lab.md as the expected audit result, and check.sh
          #     byte-verifies the file is unmodified. Editing it breaks the lab.
          #   - creds-sample.ps1 (L4.7), null-trap.ps1 (L1.7), shadow-iex.ps1
          #     (L3.5), ai-sample.ps1 (L7.1), ai-1/2/3.ps1 (L7.4): AUDIT-type
          #     samples the learner is graded on catching the planted flaw in.
          #   - tool.ps1 (L2.4): the unused $OnFound parameter demonstrates
          #     the lab's own point that decorator scaffolding is a
          #     "legitimacy costume", not full implementation.
          #   - AdminTools.psm1 (L2.6): a 2-line stub module for teaching
          #     manifest structure, never executed for real effect; adding
          #     ShouldProcess ceremony would be noise unrelated to the lesson.
          $excludedPaths = @(
            'tracks/ps/phases/p1/L1.7-variables-typing-and-null/files/null-trap.ps1',
            'tracks/ps/phases/p2/L2.4-functions-and-parameters/files/tool.ps1',
            'tracks/ps/phases/p2/L2.6-modules-and-manifests/files/AdminTools.psm1',
            'tracks/ps/phases/p3/L3.5-invoke-expression/files/shadow-iex.ps1',
            'tracks/ps/phases/p4/L4.7-credential-exposure/files/creds-sample.ps1',
            'tracks/ps/phases/p7/L7.1-ai-failure-patterns/files/ai-sample.ps1',
            'tracks/ps/phases/p7/L7.4-review-reps/files/ai-1.ps1',
            'tracks/ps/phases/p7/L7.4-review-reps/files/ai-2.ps1',
            'tracks/ps/phases/p7/L7.4-review-reps/files/ai-3.ps1',
            'tracks/ps/phases/p7/L7.5-ci-guardrails/files/candidate.ps1'
          )
          $files = Get-ChildItem -Path ./tracks/ps -Recurse -Include *.ps1,*.psm1 | Where-Object {
            $rel = ($_.FullName -replace '\\','/') -replace '^.*(tracks/ps/)', '$1'
            $excludedPaths -notcontains $rel
          }
          $results = $files | ForEach-Object { Invoke-ScriptAnalyzer -Path $_.FullName -Severity Error,Warning }
          if ($results.Count -gt 0) {
              $results | Format-Table -AutoSize
              throw "PSScriptAnalyzer found $($results.Count) error(s)/warning(s) in PowerShell lab scripts."
          }

  rust-clippy:
    name: Clippy & Cargo Check (Rust)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy

      - name: Cargo Check & Clippy across Rust Projects
        run: |
          # `find -execdir cargo ... \;` always exits 0 whatever cargo does, so
          # it can never fail the job. Loop explicitly and carry the status.
          #
          # Excluded because they are lesson material, not buildable crates:
          #   - rustscan-src (L6.1): a read-only exhibit of upstream RustScan;
          #     its Cargo.toml has no build target by design.
          #   - vuln-project (L4.8): pins a dependency that must not resolve,
          #     which is the supply-chain lesson itself.
          excluded=(
            tracks/rust/phases/p6/L6.1-rustscan-cli-to-loop/files/rustscan-src/Cargo.toml
            tracks/rust/phases/p4/L4.8-supply-chain/files/vuln-project/Cargo.toml
          )
          status=0
          checked=0
          while IFS= read -r manifest; do
            for skip in "${excluded[@]}"; do
              [[ "$manifest" == "$skip" ]] && continue 2
            done
            echo "::group::$manifest"
            if (cd "$(dirname "$manifest")" && cargo check && cargo clippy -- -D warnings); then
              checked=$((checked + 1))
            else
              echo "::error file=$manifest::cargo check/clippy failed"
              status=1
            fi
            echo "::endgroup::"
          done < <(find tracks/rust -name Cargo.toml | sort)
          if [[ $checked -eq 0 && $status -eq 0 ]]; then
            echo "::error::no Rust crates were checked"
            status=1
          fi
          exit $status

  # Canary: the same evidence check on whatever ubuntu-latest is now. It never
  # fails a PR (continue-on-error) but it shows the next image drift, such as
  # the 26.04 / tshark 4.6 change that made verify.py fail on soc L2.7's pcap,
  # before the 24.04 pin above has to move.
  tshark-canary:
    name: Evidence check on ubuntu-latest (canary)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark python3-yaml

      - name: Show how tshark reads the L2.7 pcap
        continue-on-error: true
        run: |
          pcap=tracks/soc/phases/p2/L2.7-gate-session-story/files/capture.pcap
          echo "--- $(lsb_release -ds); $(tshark --version | head -1)"
          id; ls -ld "$PWD" "$(dirname "$pcap")"; ls -l "$pcap"
          echo "--- direct path";   tshark -n -r "$pcap" -T fields -e dns.qry.name 2>&1 | head -3 || true
          echo "--- via stdin";     tshark -n -r - -T fields -e dns.qry.name < "$pcap" 2>&1 | head -3 || true
          cp "$pcap" /tmp/l27.pcap
          echo "--- copy in /tmp";  tshark -n -r /tmp/l27.pcap -T fields -e dns.qry.name 2>&1 | head -3 || true
          echo "--- apparmor";      (sudo aa-status 2>&1 | grep -i -E 'wireshark|tshark|dumpcap' || echo "no wireshark/tshark profile listed")

      - name: Verify SOC evidence
        run: python3 tools/genevidence/verify.py
