verdict.","gate":false,"est_minutes":15},"lab_md":"## BRIEF\nZeek splits one conversation across multiple logs — `conn`, `dns`, `http`, `ssl` — and the `uid`\nfield is the key that joins them back into a single story: the same `uid` appearing in two logs\nmeans those two rows describe the *same connection*. When a `uid` isn't shared (a DNS lookup is its\nown connection, separate from the session that uses the answer), pivot on the resolved value\ninstead. In this lab you join four logs by `uid` and by IP to reconstruct one incident.\n\n## GUIDED STEPS\n\n1. **Find the uid shared between the `/u.sh` conn row and its http row**:\n   ```bash\n   grep -h \"10.20.10.20\" conn.log http.log | awk -F'\\t' '{print $2}'\n   ```\n   ```\n   CXush1\n   CXush1\n   ```\n   Same `uid` in both logs — `conn.log` tells you *how* that connection ended (`SF`, bytes each\n   way); `http.log` tells you *what* was requested. Two logs, one conversation.\n\n2. **Find the field that carries the beacon's destination hostname**:\n   The beacon's `conn.log` row (`uid CXbeac1`) only shows an IP (`203.0.113.66`). Its `ssl.log` row,\n   same `uid`, has a `server_name` column — that's the SNI, the hostname.\n\n3. **Pivot from DNS to the beacon by resolved IP** (the DNS row has its own `uid` — it doesn't share\n   one with the beacon's conn row, because a lookup and the session that uses the answer are\n   different connections):\n   ```bash\n   awk -F'\\t' '!/^#/ && $5==\"203.0.113.66\"{print $5}' conn.log\n   awk -F'\\t' '!/^#/ && $11==\"203.0.113.66\"{print $11}' dns.log\n   ```\n   ```\n   203.0.113.66\n   203.0.113.66\n   ```\n   The beacon conn row's `id.resp_h` matches the dns row's `answers` value — that's the pivot: the\n   lookup that resolved the name the beacon then connected to.\n\n4. **Get the beacon's ssl-log event id**:\n   ```bash\n   awk -F'\\t' '!/^#/{print $NF}' ssl.log\n   ```\n   ```\n   CM-0311-0502\n   ```\n\n5. **Record your answers**:\n   Copy `answers.template.txt` to `answers.txt`:\n   ```bash\n   cp answers.template.txt answers.txt\n   ```\n   Fill in each field in `answers.txt`:\n   - `q1`: the uid shared by the `/u.sh` conn row and its http row (`cxush1`)\n   - `q2`: the ssl.log field name that carries the C2 destination hostname (`server_name`)\n   - `q3`: the dns `answers` value the beacon conn row's `id.resp_h` matches, defanged\n     (`203.0.113[.]66`)\n   - `q4`: which log tells you how a connection ended (`conn`)\n   - `q5`: event_id of the ssl row for the beacon (`cm-0311-0502`)\n\n6. **Check your work**:\n   ```bash\n   lab check soc L2.5\n   ```\n\n## SECURITY ONION (OPTIONAL)\nIn `cardinal-so`, these same zeek logs are the Hunt UI's correlation view; clicking a connection\npivots by uid automatically. The flat-file `grep`/`awk` path above is the graded one.\n","quiz":[{"id":1,"type":"choice","prompt":"What is a zeek `uid`?","options":{"a":"a user id","b":"a per-connection identifier shared across every zeek log for that connection","c":"an event severity","d":"a rule id"},"answer_b64":"Yg=="},{"id":2,"type":"choice","prompt":"You have a beacon's conn row but want the destination hostname. Which log + field?","options":{"a":"conn `service`","b":"ssl `server_name` via the shared uid","c":"dns `query` always","d":"http `host`"},"answer_b64":"Yg=="},{"id":3,"type":"choice","prompt":"conn.log gives duration and conn_state; dns.log gives query/answers; http.log gives method/uri/UA. Why keep them separate then join by uid?","options":{"a":"disk space","b":"each log carries a different slice of one conversation - uid stitches them back together","c":"they're redundant","d":"zeek requires it"},"answer_b64":"Yg=="}],"hints":["Find the same uid in two logs - that's one conversation seen twice. `grep` the uid across files.","The /u.sh conn row and its http row share a uid; the beacon conn row and its ssl row share a different uid. dns.log doesn't share those uids, but its `answers` IP matches the beacon's `id.resp_h`.","q1 cxush1; q2 server_name; q3 203.0.113[.]66; q4 conn; q5 the beacon ssl row's event_id cm-0311-0502."],"recap":["Zeek splits one conversation across logs - conn, dns, http, ssl - and the uid is the key that joins them back into a single story.","Each log carries a different verdict field: conn has conn_state and bytes, dns has query/answers, http has uri/UA, ssl has server_name.","When a uid isn't shared (dns is its own connection), pivot on the value instead - a resolved IP links the lookup to the session that used it."],"recall":null,"ungradable":false,"assertions":[{"fn":"exists","path":"conn.log","hint":""},{"fn":"exists","path":"dns.log","hint":""},{"fn":"exists","path":"http.log","hint":""},{"fn":"exists","path":"ssl.log","hint":""},{"fn":"exists","path":"answers.txt","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q1=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q2=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q3=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q4=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q5=","hint":""},{"fn":"contains","path":".answers.norm","arg":"^q1=cxush1$","hint":""},{"fn":"contains","path":".answers.norm","arg":"^q2=server_name$","hint":""},{"fn":"contains_fixed","path":".answers.norm","arg":"q3=203.0.113[.]66","hint":""},{"fn":"contains","path":".answers.norm","arg":"^q4=conn$","hint":""},{"fn":"contains","path":".answers.norm","arg":"^q5=cm-0311-0502$","hint":""}],"norms":[{"source":"answers.txt","target":".answers.norm","comment":true,"nows":false,"trim":true,"variant":"standard"}],"graded_files":[{"name":"answers.txt","prefill":"# Join zeek conn/dns/http/ssl by uid and by resolved IP, then answer.\n\n# the uid shared by the /u.sh conn row and its http row\nq1=\n\n# in ssl.log, the field name that carries the C2 destination hostname\nq2=\n\n# the dns answers value that the beacon conn row's id.resp_h matches\n# (DEFANGED)\nq3=\n\n# which log tells you HOW a connection ended (conn_ or \\x09\n#set_separator\t,\n#empty_field\t(empty)\n#unset_field\t-\n#path\thttp\n#fields\tts\tuid\tid.orig_h\tid.orig_p\tid.resp_h\tid.resp_p\tmethod\thost\turi\tuser_agent\tstatus_code\trequest_body_len\tresponse_body_len\tevent_id\n#types\ttime\tstring\taddr\tport\taddr\tport\tstring\tstring\tstring\tstring\tcount\tcount\tcount\tstring\n2026-03-12T20:16:00Z\tCXush1\t10.20.10.20\t44601\t198.51.100.23\t80\tGET\tcdn.stonewick.example\t/u.sh\tcurl/7.81.0\t200\t0\t92\tCM-0312-0520\n"},{"name":"ssl.log","size":405,"kind":"text","text":"#separator \\x09\n#set_separator\t,\n#empty_field\t(empty)\n#unset_field\t-\n#path\tssl\n#fields\tts\tuid\tid.orig_h\tid.orig_p\tid.resp_h\tid.resp_p\tversion\tcipher\tserver_name\tresumed\testablished\tevent_id\n#types\ttime\tstring\taddr\tport\taddr\tport\tstring\tstring\tstring\tbool\tbool\tstring\n2026-03-11T15:46:02Z\tCXbeac1\t10.20.30.107\t49156\t203.0.113.66\t443\tTLSv12\tECDHE-RSA-AES128-GCM-SHA256\tc2.stonewick.example\tF\tT\tCM-0311-0502\n"}]},{"id":"L2.6","dir":"L2.6-beaconing","phase":"p2","order":[2,6],"meta":{"id":"L2.6","title":"Beaconing - periodicity, jitter, and C2 shapes in connection logs","type":"HUNT","objective":"Find a jittered C2 beacon by computing inter-arrival deltas per destination and separate it from benign periodic traffic (NTP, polls).","gate":false,"est_minutes":20},"lab_md":"## BRIEF\nBeaconing is automation's fingerprint: a program calling home on a near-fixed interval, with small\njitter to avoid looking *too* perfectly regular. But periodic isn't automatically hostile — NTP,\nmail sync, and app polls are periodic too. In this lab you find the beacon by computing deltas\nyourself, then separate it from a benign periodic signal by destination, port, and byte pattern.\n\n## GUIDED STEPS\n\n1. **Count connections per destination — look for one that repeats a lot**:\n   ```bash\n   awk -F'\\t' '!/^#/{print $5}' conn.log | sort | uniq -c | sort -rn\n   ```\n   ```\n       20 192.0.2.10\n       18 203.0.113.66\n        6 192.0.2.60\n        2 192.0.2.61\n        2 10.20.10.5\n        1 10.20.10.8\n        1 10.20.10.20\n   ```\n   Two destinations dominate: `192.0.2.10` (20 hits) and `203.0.113.66` (18 hits). Both are\n   candidates — the count alone doesn't tell you which is hostile.\n\n2. **Compute the deltas for the external destination**:\n   ```bash\n   awk -F'\\t' '!/^#/ && $5==\"203.0.113.66\"{print $1}' conn.log | sort | python3 -c \"\n   import sys\n   from datetime import datetime\n   lines = [datetime.fromisoformat(l.strip().replace('Z','+00:00')) for l in sys.stdin]\n   for i in range(1, len(lines)):\n       print((lines[i]-lines[i-1]).total_seconds())\n   \"\n   ```\n   ```\n   288.0\n   318.0\n   275.0\n   309.0\n   270.0\n   ...\n   ```\n   Every delta clusters around 300 seconds, give or take about 10% — that's jitter, not noise.\n\n3. **Find the beaconing host**:\n   ```bash\n   awk -F'\\t' '!/^#/ && $5==\"203.0.113.66\"{print $3}' conn.log | sort -u\n   ```\n   ```\n   10.20.30.107\n   ```\n\n4. **Check the NTP destination's deltas the same way** — a sample:\n   ```bash\n   awk -F'\\t' '!/^#/ && $5==\"192.0.2.10\"{print $1}' conn.log | sort | head -5\n   ```\n   ```\n   2026-03-11T15:46:10Z\n   2026-03-11T15:47:14Z\n   2026-03-11T15:48:18Z\n   2026-03-11T15:49:22Z\n   2026-03-11T15:50:26Z\n   ```\n   Exactly 64 seconds apart, every time — also periodic, but `192.0.2.10:123/udp` is NTP, a known\n   background service every host talks to. See `beacon-method.md` for the full delta method and why\n   port/service and byte pattern (not periodicity alone) decide the verdict.\n\n5. **Record your answers**:\n   Copy `answers.template.txt` to `answers.txt`:\n   ```bash\n   cp answers.template.txt answers.txt\n   ```\n   Fill in each field in `answers.txt`:\n   - `q1`: the beaconing host, defanged (`10.20.30[.]107`)\n   - `q2`: the hostile beacon's destination IP, defanged (`203.0.113[.]66`)\n   - `q3`: approximate base period of the hostile beacon, seconds (`300`)\n   - `q4`: number of hostile beacon connections in the log (`18`)\n   - `q5`: the destination that's also periodic but benign, defanged (`192.0.2[.]10`)\n   - `q6`: one word for why q5 is benign despite being periodic (`ntp`)\n\n6. **Check your work**:\n   ```bash\n   lab check soc L2.6\n   ```\n","quiz":[{"id":1,"type":"choice","prompt":"What is jitter in a beacon?","options":{"a":"packet loss","b":"deliberate small random variation around a base callback interval to evade fixed-interval detection","c":"a port number","d":"a TLS version"},"answer_b64":"Yg=="},{"id":2,"type":"choice","prompt":"Traffic to `192.0.2.10:123/udp` every 64s is periodic. Why is it usually NOT C2?","options":{"a":"64s is too fast","b":"UDP can't carry C2","c":"123/udp is NTP - a known, expected periodic service","d":"it isn't encrypted"},"answer_b64":"Yw=="},{"id":3,"type":"choice","prompt":"Your platform flags a 300s +/-10% callback to an external IP. As the Tier 1 human, you confirm it by:","options":{"a":"trusting the flag and escalating blind","b":"computing the deltas yourself and checking the destination, port, and byte pattern before you write the verdict","c":"closing it as FP because it's automated","d":"ignoring jitter"},"answer_b64":"Yg=="}],"hints":["Group connections by destination IP, sort by ts, and look at the gaps between successive connections to the same dst.","One external dst repeats every ~300s with small variation and tiny transfers - that's the beacon. NTP (123/udp) also repeats but is a known service; the webmail poll is periodic but moves real, varying bytes.","q1 10.20.30[.]107; q2 203.0.113[.]66; q3 300; q4 = count the beacon rows (18); q5 192.0.2[.]10; q6 ntp."],"recap":["Beaconing is automation's fingerprint: near-fixed callback intervals with small jitter, tiny near-identical transfers every hit, to one external destination.","Compute the deltas yourself - group by destination, diff successive timestamps - because periodic is not the same as hostile.","NTP and app polls are periodic and benign; the machine surfaces the shape, but the human confirms destination, port, and byte pattern before the verdict."],"recall":null,"ungradable":false,"assertions":[{"fn":"exists","path":"conn.log","hint":""},{"fn":"exists","path":"beacon-method.md","hint":""},{"fn":"exists","path":"answers.txt","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q1=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q2=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q3=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q4=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q5=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q6=","hint":""},{"fn":"contains_fixed","path":".answers.norm","arg":"q1=10.20.30[.]107","hint":""},{"fn":"contains_fixed","path":".answers.norm","arg":"q2=203.0.113[.]66","hint":""},{"fn":"contains","path":".answers.norm","arg":"^q3=300$","hint":""},{"fn":"contains","path":".answers.norm","arg":"^q4=18$","hint":""},{"fn":"contains_fixed","path":".answers.norm","arg":"q5=192.0.2[.]10","hint":""},{"fn":"contains","path":".answers.norm","arg":"^q6=ntp$","hint":""}],"norms":[{"source":"answers.txt","target":".answers.norm","comment":true,"nows":false,"trim":true,"variant":"standard"}],"graded_files":[{"name":"answers.txt","prefill":"# Group conn.log by destination, compute deltas, and answer.\n\n# the beaconing host - DEFANGED\nq1=\n\n# the hostile beacon's destination IP - DEFANGED\nq2=\n\n# approximate base period of the hostile beacon, seconds (integer)\nq3=\n\n# number of hostile beacon connections in the log\nq4=\n\n# the destination IP that is ALSO periodic but BENIGN - DEFANGED\nq5=\n\n# one word: why q5 is benign despite being periodic (port|service)\nq6=\n","expected":"","template":"answers.template.txt","tool_output":false}],"files":[{"name":"beacon-method.md","size":1105,"kind":"text","text":"# Beacon math - the delta method\n\n1. Group connections by destination (`awk` on `id.resp_h`, or `id.resp_h:id.resp_p`).\n2. Sort each destination's rows by `ts`.\n3. Compute the delta (seconds) between each row and the one before it, per destination.\n4. A near-fixed delta with small variation (\"jitter\") — same magnitude every time, give or\n   take a small percentage — is automation's fingerprint: a program calling home on a timer.\n5. Periodic is not the same as hostile. Before calling a periodic destination malicious, check:\n   - **Port/service**: a well-known port (123/udp NTP, a mail sync port) argues for legitimate\n     background traffic, not C2.\n   - **Byte pattern**: tiny, near-identical bytes each hit reads as a heartbeat; larger,\n     *varying* byte counts read as a human or an app doing real work on each poll.\n   - **Destination**: is it a known-good service, or an external IP with no other footprint?\n\nThe platform can surface \"this destination is periodic\" automatically. Deciding whether that\nperiodicity is hostile — port, bytes, destination — is the Tier 1 analyst's job.\n"},{"name":"conn.log","size":5751,"kind":"text","text":"#separator \\x09\n#set_separator\t,\n#empty_field\t(empty)\n#unset_field\t-\n#path\tconn\n#fields\tts\tuid\tid.orig_h\tid.orig_p\tid.resp_h\tid.resp_p\tproto\tservice\tduration\torig_bytes\tresp_bytes\tconn_state\thistory\tevent_id\n#types\ttime\tstring\taddr\tport\taddr\tport\tenum\tstring\tinterval\tcount\tcount\tstring\tstring\tstring\n2026-03-11T15:46:02Z\tCXbeac1\t10.20.30.107\t49156\t203.0.113.66\t443\ttcp\tssl\t0.31\t517\t1203\tSF\tShADadFf\tCM-0311-0501\n2026-03-11T15:46:10Z\tCNTP1\t10.20.30.103\t49500\t192.0.2.10\t123\ttcp\tntp\t0.28\t76\t76\tSF\tShAdDaFf\tCM-0311-0617\n2026-03-11T15:46:30Z\tCWEB0001\t10.20.30.107\t49200\t192.0.2.60\t443\ttcp\tssl\t12.40\t4200\t8800\tSF\tShADadFf\tCM-0311-0637\n2026-03-11T15:47:14Z\tCNTP2\t10.20.30.103\t49501\t192.0.2.10\t123\ttcp\tntp\t0.29\t76\t76\tSF\tShAdDaFf\tCM-0311-0618\n2026-03-11T15:48:18Z\tCNTP3\t10.20.30.103\t49502\t192.0.2.10\t123\ttcp\tnt \nThis is the **Phase 2 Phase Gate** for the SOC Analyst Lab.\n\nIn this lab, you are provided with both a `capture.pcap` file and a set of Zeek log files (`zeek/conn.log`, `zeek/dns.log`, `zeek/http.log`, `zeek/ssl.log`). Reconstruct the full network session story across both evidence forms.\n\n## GUIDED STEPS\n\n1. Inspect `zeek/dns.log`, `zeek/conn.log`, `zeek/ssl.log`, and `zeek/http.log`.\n2. Inspect `capture.pcap` using `tshark`.\n3. Fill `answers.txt`. Every line in the template names exactly what it wants —\n   answer each one from the evidence above.\n4. Verify with `lab check soc L2.7`.\n","quiz":[{"id":1,"type":"choice","prompt":"The pcap's ClientHello SNI and ssl.log's server_name both read `c2.stonewick.example`. What has corroborating two evidence forms bought you?","options":{"a":"nothing","b":"higher confidence the destination is real and not a log artifact","c":"it decrypts the session","d":"it proves malware"},"answer_b64":"Yg=="},{"id":2,"type":"choice","prompt":"Two different hosts are involved: one beacons over TLS, one tunnels over DNS. Are they the same incident?","options":{"a":"always","b":"not necessarily - reconstruct each host's story before merging them; the gate keys them separately","c":"never","d":"can't tell"},"answer_b64":"Yg=="},{"id":3,"type":"choice","prompt":"The WEB01 `/u.sh` pull is plaintext HTTP but the C2 callback is TLS. Which URI can you read directly, and which needs SNI?","options":{"a":"both plaintext","b":"/u.sh is readable in http.log/pcap; the C2 session gives only SNI","c":"neither","d":"both need SNI"},"answer_b64":"Yg=="}],"hints":["Build a timeline per host: what did WKS-ACCT-07 do, what did WKS-ENG-12 do, what did WEB01 do? Each has one thread of the story.","Start from the C2 DNS resolve (dns.log answers), follow the uid into conn/ssl for the beacon, carve the same SNI from the pcap with tshark to confirm; the tunnel is a separate host's DNS burst; the payload pull is WEB01's plaintext http row.","q1/q3 c2.sto \":{\"ip\":\"203.0.113.66\",\"port\":443}}\n"}]},{"id":"L4.1","dir":"L4.1-triage-method","phase":"p4","order":[4,1],"meta":{"id":"L4.1","title":"The triage method — the five questions, applied to one alert slowly","objective":"Apply the five triage questions — what fired, evidence, expected, scope, verdict — to one alert","type":"DECODE","gate":false,"est_minutes":15},"lab_md":"## BRIEF\nEvery Tier 1 triage follows five questions:\n1. **What FIRED?** (The rule ID)\n2. **What is the EVIDENCE?** (The deciding event ID)\n3. **Is it EXPECTED?** (User/host role & context — y/n)\n4. **What is the SCOPE?** (Count of affected hosts)\n5. **What is the VERDICT?** (tp | fp | btp)\n\nRun these five questions in order on `files/alert.json` and `files/events.jsonl`.\n\n## GUIDED STEPS\n\n1. Inspect `files/alert.json`, `files/events.jsonl`, and `files/asset-inventory.csv`.\n2. Copy `files/answers.template.txt` to `answers.txt`:\n   ```bash\n   cp files/answers.template.txt answers.txt\n   ```\n3. Fill `answers.txt`. Every line in the template names exactly what it wants —\n   answer each one from the evidence above.\n4. Run `lab check soc L4.1`.\n","quiz":[{"id":1,"type":"choice","prompt":"The triage method is valuable because it is:","options":{"a":"intuition, honed by experience","b":"a fixed question sequence anyone can apply fast and defend","c":"a SIEM feature"},"answer_b64":"Yg=="},{"id":2,"type":"choice","prompt":"Question 3 (\"is this expected for this user/host?\") exists to catch:","options":{"a":"malware","b":"authorized/benign activity that a rule flagged — the BTP category","c":"network errors"},"answer_b64":"Yg=="},{"id":3,"type":"choice","prompt":"Why is \"verdict\" the LAST question, not the first?","options":{"a":"it isn't","b":"a verdict without evidence, expectation, and scope behind it is a guess","c":"verdicts are slow"},"answer_b64":"Yg=="}],"hints":["Answer the five questions in order; each has one source — alert (q1), events (q2), context (q3/q4), verdict (q5).","q2 is the Sysmon 1 spawn event cm-0311-0201. q4 counts distinct hosts.","q1=cm-r-0159, q2=cm-0311-0201, q3=n, q4=1, q5=tp."],"recap":["Triage is a fixed sequence, not a hunch: what fired, what's the evidence, is it expected, what's the scope, then the verdict.","The verdict is the last question because the first four are what make it defensible to Tier 2.","Run the same five questions on every alert and speed comes for free — the method is the craft."],"recall":[{"id":1,"type":"text","prompt":"Windows Security event.code for a successful logon?","answer_b64":"NDYyNA==","accept_b64":["NDYyNA=="],"source":"L3.1"},{"id":2,"type":"text","prompt":"Which Sysmon field joins a child process to its parent?","answer_b64":"cGFyZW50cHJvY2Vzc2d1aWQ=","accept_b64":["cGFyZW50cHJvY2Vzc2d1aWQ=","cHJvY2Vzc2d1aWQ="],"source":"L3.2"},{"id":3,"type":"choice","prompt":"Office spawning powershell is an example of anomalous ___.","options":{"a":"process ancestry","b":"logon type","c":"service"},"answer_b64":"YQ==","source":"L3.3"},{"id":4,"type":"text","prompt":"Many SSH Failed then one Accepted from one IP is a ___ that succeeded.","answer_b64":"YnJ1dGUtZm9yY2U=","accept_b64":["YnJ1dGUtZm9yY2U=","YnJ1dGVmb3JjZQ==","YnJ1dGUgZm9yY2U="],"source":"L3.5"},{"id":5,"type":"text","prompt":"A trusted built-in tool used to attack (certutil, powershell -enc) is a ___.","answer_b64":"bG9sYmlu","accept_b64":["bG9sYmlu","bG9sYmlucw=="],"source":"L3.6"}],"ungradable":false,"assertions":[{"fn":"exists","path":"answers.txt","hint":""},{"fn":"exists","path":"alert.json","hint":""},{"fn":"exists","path":"events.jsonl","hint":""},{"fn":"contains_fixed","path":".answers.norm","arg":"q1=cm-r-0159","hint":""},{"fn":"contains_fixed","path":".answers.norm","arg":"q2=cm-0311-0201","hint":""},{"fn":"contains_fixed","path":".answers.norm","arg":"q3=n","hint":""},{"fn":"contains_fixed","path":".answers.norm","arg":"q4=1","hint":""},{"fn":"contains_fixed","path":".answers.norm","arg":"q5=tp","hint":""}],"norms" ost\":\"WKS-ACCT-07\"}\n"}]},{"id":"L4.2","dir":"L4.2-enrichment","phase":"p4","order":[4,2],"meta":{"id":"L4.2","title":"Indicator enrichment — hash, IP, domain lookups; reading VT-style and WHOIS-style reports","objective":"Read mock VT/WHOIS/passive-DNS reports and extract detections, first-seen, registrar, and resolutions","type":"GUIDED","gate":false,"est_minutes":15},"lab_md":"## BRIEF\nEnrichment adds context to an indicator (IP, domain, hash) by reading mock VirusTotal, WHOIS, and Passive DNS reports.\n`lab check` always grades against these staged reports, never a live lookup — the graded path is offline and deterministic by design, so no lab ever depends on a real WHOIS/dig/VT service being reachable.\n\n## GUIDED STEPS\n\n1. Inspect files in `files/enrichment/`.\n2. Run the following extraction commands:\n   ```bash\n   jq '.last_analysis_stats.malicious' files/enrichment/vt-ip-203.0.113.66.json > vt_mal.txt\n   jq -r '.resolutions[].domain' files/enrichment/pdns-203.0.113.66.json > pdns_domains.txt\n   ```\n3. Copy `files/answers.template.txt` to `answers.txt`:\n   ```bash\n   cp files/answers.template.txt answers.txt\n   ```\n4. Fill `answers.txt`. Every line in the template names exactly what it wants —\n   answer each one from the evidence above.\n5. Verify with `lab check soc L4.2`.\n","quiz":[{"id":1,"type":"choice","prompt":"A VT malicious: 31/94 means:","options":{"a":"the file is 31% malware","b":"31 of 94 engines flagged it — a signal, not a verdict","c":"it was seen 31 times"},"answer_b64":"Yg=="},{"id":2,"type":"choice","prompt":"Passive DNS showing an IP resolves ONE domain suggests:","options":{"a":"shared hosting","b":"dedicated infrastructure — the IP and domain move together","c":"a CDN"},"answer_b64":"Yg=="},{"id":3,"type":"choice","prompt":"Why does this lab grade against staged reports, not live VT?","options":{"a":"VT is down","b":"the graded path is offline and deterministic","c":"live lookups are illegal"},"answer_b64":"Yg=="}],"hin "options":{"a":"style","b":"so a reader or tool cannot accidentally click or resolve a live-malicious indicator","c":"encryption"},"answer_b64":"Yg=="}],"hints":["Count hops in the redirect chain (lnk.example -> copperm1ne-billing.example -> cdn.stonewick.example).","q1=cdn.stonewick[.]example, q2=copperm1ne-billing[.]example, q3=coppermïne[.]example, q4=coppermine[.]example, q5=3.","Defang all domains in answers.txt."],"recap":["The link you see is not the link you get — follow redirect chains to the final destination before judging.","Lookalikes swap letters for digits or homoglyphs, and punycode (xn--) hides Unicode domains that read like the real one.","Defang every IOC you write — hxxp://, [.] — so no one clicks or resolves it by accident."],"recall":null,"ungradable":false,"assertions":[{"fn":"exists","path":"answers.txt","hint":""},{"fn":"contains_fixed","path":".answers.norm","arg":"q1=cdn.stonewick[.]example","hint":""},{"fn":"contains_fixed","path":".answers.norm","arg":"q2=copperm1ne-billing[.]example","hint":""},{"fn":"contains","path":".answers.norm","arg":"^q3=(coppermïne\\[\\.\\]example|coppermine\\[\\.\\]example)$","hint":""},{"fn":"contains_fixed","path":".answers.norm","arg":"q4=coppermine[.]example","hint":""},{"fn":"contains_fixed","path":".answers.norm","arg":"q5=3","hint":""}],"norms":[{"source":"answers.txt","target":".answers.norm","comment":true,"nows":false,"trim":true,"variant":"standard"}],"graded_files":[{"name":"answers.txt","prefill":"q1=   # final landing domain of the redirect chain — DEFANGED\nq2=   # the digit-homoglyph lookalike of coppermine.example — DEFANGED\nq3=   # decode the punycode xn--coppermne-9zb.example (the real unicode label,\nq4=   # which link is the REAL Coppermine domain (benign)? — DEFANGED\nq5=   # number of hops in the redirect chain\n","expected":"","template":"answers.template.txt","tool_output":false}],"files":[{"name":"url-legend.md","size":260,"kind":"text","text":"# URL Analysis Legend\n- Redirect chains must be followed to the final landing domain.\n- Homoglyph/digit lookalikes swap letters (e.g. `i` -> `1`).\n- Punycode (`xn--`) encodes internationalized Unicode domains in ASCII.\n- Always defang URLs (`hxxp://`, `[.]`).\n"},{"name":"urls.txt","size":228,"kind":"text","text":"Redirect Chain: http://lnk.example/x9f2 -> http://copperm1ne-billing.example/invoice -> http://cdn.stonewick.example/pay\nPunycode Link: http://xn--coppermne-9zb.example/verify\nBenign Real Link: https://coppermine.example/portal\n"}]},{"id":"L5.3","dir":"L5.3-attachment-triage","phase":"p5","order":[5,3],"meta":{"id":"L5.3","title":"Attachment triage — true file types vs extensions, hashes, macro risk, safe-handling rules","objective":"Determine an attachment's true type by magic bytes, hash it, judge macro risk, and apply safe-handling — never open the sample","type":"DECODE","gate":false,"est_minutes":15},"lab_md":"## BRIEF\nFile extensions can be deceptive. Inspect true container types with magic bytes and compute sha256 hashes safely.\n\n## GUIDED STEPS\n\n1. Inspect files in `files/`.\n2. Compute the sha256 hash of `files/invoice_2026-03.docm`:\n   ```bash\n   sha256sum files/invoice_2026-03.docm > hash.txt\n   ```\n3. Copy `files/answers.template.txt` to `answers.txt`.\n4. Fill `answers.txt`. Every line in the template names exactly what it wants —\n   answer each one from the evidence above.\n5. Run `lab check soc L5.3`.\n","quiz":[{"id":1,"type":"choice","prompt":"A file named receipt.pdf.exe is:","options":{"a":"a PDF","b":"an executable using a double extension to look like a PDF","c":"safe"},"answer_b64":"Yg=="},{"id":2,"type":"choice","prompt":"file reports an OOXML/ZIP for a .docm. The macro risk lives in:","options":{"a":"the extension","b":"the embedded vbaProject (VBA macros) inside the container","c":"the filename"},"answer_b64":"Yg=="},{"id":3,"type":"choice","prompt":"Your first move on a suspicious attachment is to:","options":{"a":"open it to see","b":"hash it and enrich/sandbox — never execute it","c":"forward it"},"answer_b64":"Yg=="}],"hints":["Run sha256sum files/invoice_2026-03.docm > hash.txt to generate hash.txt.","q1=zip, q2=y, q3=receipt.pdf.exe, q4=55e9d81f361e, q5=hash.","Fill q4 with the first 12 characters of the sha256 hash."],"recap":["Extensions lie — magic bytes (PK, MZ, ffd8) give the true type, and a double extension like .pdf.exe is a classic disguise.","Office files ending .docm/.xlsm carry macros inside a ZIP container; that vbaProject is the risk, not the icon.","The hash is the sample's identity and the safe first step — inspect and enrich, never open or detonate."],"recall":null,"ungradable":false,"assertions":[{"fn":"exists","path":"answers.txt","hint":""},{"fn":"exists","path":"hash.txt","hint":""},{"fn":"contains_fixed","path":"hash.txt","arg":"55e9d81f361e14ec8998781f8ccdc3a0b160affa974681f31dd4a6d7537fc0f4","hint":""},{"fn":"contains_fixed","path":".answers.norm","arg":"q1=zip","hint":""},{"fn":"contains_fixed","path":".answers.norm","arg":"q2=y","hint":""},{"fn":"contains_fixed","path":".answers.norm","arg":"q3=receipt.pdf.exe","hint":""},{"fn":"contains_fixed","path":".answers.norm","arg":"q4=55e9d81f361e","hint":""},{"fn":"contains_fixed","path":".answers.norm","arg":"q5=hash","hint":""}],"norms":[{"source":"answers.txt","target":".answers.norm","comment":true,"nows":false,"trim":true,"variant":"standard"}],"graded_files":[{"name":"answers.txt","prefill":"q1=   # true container type of invoice_2026-03.docm (by magic): zip|ole|pe|jpeg\nq2=   # does the .docm carry a macro project (vbaProject present)? y|n\nq3=   # the file whose REAL type is an executable despite its name\nq4=   # sha256 of invoice_2026-03.docm (first 12 hex chars)\nq5=   # safe first step with a suspicious attachment: open|hash|reply\n","expected":"","template":"answers.template.txt","tool_output":false},{"name":"hash.txt","prefill":"","expected":"55e9d81f361e14ec8998781f8ccdc3a0b160affa974681f31dd4a6d7537fc0f4","template":"","tool_output":true}],"files":[{"name":"invoice_2026-03.docm","size":56,"kind":"binary","b64":"UEsDBBQAAAAIAER1bW15IE9PWE1MIGNvbnRhaW5lciB3aXRoIHZiYVByb2plY3QuYmluIHN0dWI=","sha256":"55e9d81f361e14ec8998781f8ccdc3a0b160affa974681f31dd4a6d7537fc0f4","magic":"zip (PK)"},{"name":"photo.jpg","size":20,"kind":"binary","b64":"/9j/4AAQSkZJRgABAQEAYABgAAA=","sha256":"04d4e9744a0c1fd428d9819468cdf5ee1fa24c99a8643b025ba07f6c03c9c2f3","magic":"jpeg (FFD8)"},{"name":"receipt.pdf.exe","size":40,"kind":"binary","b64":"TVqQAAMAAAAEAAAA//8AAEluZXJ0IFBFIEV4ZWN1dGFibGUgQm9keQ==","sha256":"2102c5d0b4ed7636614444cabad8ed5c536cd05296d3167236459b533fcfe3e5","magic":"pe (MZ)"},{"name":"safe-handling.md","size":229,"kind":"text","text":"# Safe Handling of Attachments\n- Never open or execute suspicious attachments.\n- Inspect magic bytes using `file` or `xxd | head`.\n- Compute file identity using `sha256sum`.\n- .docm and .xlsm files carry macro risk (vbaProject).\n"}]},{"id":"L5.4","dir":"L5.4-sandbox-report","phase":"p5","order":[5,4],"meta":{"id":"L5.4","title":"Reading a sandbox report — verdicting from a detonation summary without touching the sample","objective":"Verdict a sample from a mock sandbox detonation report — process tree, network IOCs, MITRE, score — without executing it","type":"DECODE","gate":false,"est_minutes":15},"lab_md":"## BRIEF\nVerdict a sample safely by reading its sandbox detonation report (`files/sandbox-report.json` / `files/sandbox-report.md`).\n\n## GUIDED STEPS\n\n1. Inspect `files/sandbox-report.md`.\n2. Copy `files/answers.template.txt` to `answers.txt`.\n3. Fill `answers.txt`. Every line in the template names exactly what it wants —\n   answer each one from the evidence above.\n4. Run `lab check soc L5.4`.\n","quiz":[{"id":1,"type":"choice","prompt":"A sandbox report is useful because:","options":{"a":"it's faster than reading","b":"it detonated the sample in isolation so you get behavior without risking your host","c":"it's always right"},"answer_b64":"Yg=="},{"id":2,"type":"choice","prompt":"The report shows WINWORD.EXE -> powershell.exe -enc -> C2 beacon. Verdict:","options":{"a":"clean","b":"malicious — document-spawned encoded shell beaconing out is textbook malware","c":"suspicious only"},"answer_b64":"Yg=="},{"id":3,"type":"choice","prompt":"You should still ground each claim in the report because:","options":{"a":"reports are decoration","b":"an ungrounded verdict with no cited behavior is a guess","c":"it's faster"},"answer_b64":"Yg=="}],"hints":["Read sandbox-report.md for verdict, beacon C2, MITRE ID, and registry leaf.","q1=malicious, q2=c2.stonewick[.]example, q3=t1566.001, q4=onedriveupd, q5=y.","Defang the C2 domain in q2."],"recap":["A sandbox report hands you behavior — process tree, network beacons, dropped persistence, MITRE tags — from a safe detonation you didn't have to run.","Verdict from the report: a document spawning encoded PowerShell that beacons out and sets a Run key is malicious, full stop.","Ground every claim in a report field; an ungrounded verdict is a guess, and the IOCs go into your ticket defanged."],"recall":null,"ungradable":false,"assertions":[{"fn":"exists","path":"answers.txt","hint":""},{"fn":"contains_fixed","path":".answers.norm","arg":"q1=malicious","hint":""},{"fn":"contains_fixed","path":".answers.norm","arg":"q2=c2.stonewick[.]example","hint":""},{"fn":"contains_fixed","path":".answers.norm","arg":"q3=t1566.001","hint":""},{"fn":"contains_fixed","path":".answers.norm","arg":"q4=onedriveupd","hint":""},{"fn":"contains_fixed","path":".answers.norm","arg":"q5=y","hint":""}],"norms":[{"source":"answers.txt","target":".answers.norm","comment":true,"nows":false,"trim":true,"variant":"standard"}],"graded_files":[{"name":"answers.txt","prefill":"q1=   # the report's verdict (malicious|suspicious|clean)\nq2=   # the C2 destination host the sample beaconed to — DEFANGED\nq3=   # the ATT&CK technique id for the initial delivery (spearphishing attach)\nq4=   # the persistence artifact the sample dropped (registry key leaf)\nq5=   # can you verdict this WITHOUT running the sample yourself? y|n\n","expected":"","template":"answers.template.txt","tool_output":false}],"files":[{"name":"sandbox-report.json","size":652,"kind":"text","text":"{\n  \"sample\": \"invoice_2026-03.docm\",\n  \"sha256\": \"55e9d81f361e14ec8998781f8ccdc3a0b160affa974681f31dd4a6d7537fc0f4\",\n  \"verdict\": \"malicious\",\n  \"score\": 88,\n  \"process_tree\": [\n    \"WINWORD.EXE\",\n    \"powershell.exe -enc\",\n    \"cmd.exe\"\n  ],\n  \"network\": [\n    {\n      \"dst\": \"c2.stonewick.example:443\",\n      \"proto\": \"tls\",\n      \"beacon_s\": 300\n    }\n  ],\n  \"dropped\": [\n    {\n      \"registry\": \"HKCU\\\\Software\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Run\\\\OneDriveUpd\"\n    }\n  ],\n  \"mitre\": [\n    \"T1566.001\",\n    \"T1059.001\",\n    \"T1547.001\"\n  ],\n  \"signatures\": [\n    \"office_spawns_shell\",\n    \"encoded_powershell\",\n    \"autorun_persistence\"\n  ]\n}"},{"name":"sandbox-report.md","size":406,"kind":"text","text":"# Sandbox Detonation Report\n- **Sample**: invoice_2026-03.docm\n- **Verdict**: malicious (Score 88/100)\n- **Process Tree**: WINWORD.EXE -> powershell.exe -enc -> cmd.exe\n- **Network**: Beacon to c2.stonewick.example:443 (TLS, interval 300s)\n- **Dropped Persistence**: Run key leaf `OneDriveUpd`\n- **MITRE ATT&CK**: T1566.001 (Spearphishing Attachment), T1059.001 (PowerShell), T1547.001 (Registry Run Keys)\n"}]},{"id":"L5.5","dir":"L5.5-phish-queue","phase":"p5","order":[5,5],"meta":{"id":"L5.5","title":"The phish queue — six reported emails, verdict each (including the legitimate one)","objective":"Verdict six reported emails as phish, legit, or spam — including recognizing the legitimate one","type":"TRIAGE","gate":false,"est_minutes":20},"lab_md":"## BRIEF\nVerdict six reported emails in `files/mail/p1.eml`..`p6.eml` as `phish | legit | spam`.\n\n## GUIDED STEPS\n\n1. Inspect emails in `files/mail/` and `files/triage-checklist.md`.\n2. Copy `files/answers.template.txt` to `answers.txt`.\n3. Fill `answers.txt`. Every line in the template names exactly what it wants —\n   answer each one from the evidence above.\n4. Run `lab check soc L5.5`.\n","quiz":[{"id":1,"type":"choice","prompt":"Calling a legitimate vendor invoice a phish is:","options":{"a":"safe","b":"a false positive that erodes helpdesk/user trust and buries real reports","c":"impossible"},"answer_b64":"Yg=="},{"id":2,"type":"choice","prompt":"Marketing spam that passes auth and has an unsubscribe link is:","options":{"a":"phish","b":"spam — annoying, not malicious; not an incident","c":"legit business mail"},"answer_b64":"Yg=="},{"id":3,"type":"choice","prompt":"A CFO \"wire request\" from an external reply-to with a spoofed display name is:","options":{"a":"legit","b":"BEC phishing — no malware needed, the ask is the attack","c":"spam"},"answer_b64":"Yg=="}],"hints":["Check auth results, sender reputation, and intent for each email.","p1=phish, p2=phish, p3=legit, p4=spam, p5=legit, p6=phish.","Ensure answers.txt has q1..q6 filled."],"recap":["A phish queue has three answers, not one: malicious phish, legitimate mail, and spam that's merely annoying.","Check auth, sender reputation, and intent — an unexpected invoice from an allowlisted vendor with passing auth is legit, not a phish.","Over-calling phish burns user trust and buries the real reports; the legitimate email is a graded answer for a reason."],"recall":null,"ungradable":false,"assertions":[{"fn":"exists","path":"answers.txt","hint":""},{"fn":"contains_fixed","path":".answers.norm","arg":"q1=phish","hint":""},{"fn":"contains_fixed","path":".answers.norm","arg":"q2=phish","hint":""},{"fn":"contains_fixed","path":".answers.norm","arg":"q3=legit","hint":""},{"fn":"contains_fixed","path":".answers.norm","arg":"q4=spam","hint":""},{"fn":"contains_fixed","path":".answers.norm","arg":"q5=legit","hint":""},{"fn":"contains_fixed","path":".answers.norm","arg":"q6=phish","hint":""}],"norms":[{"source":"answers.txt","target":".answers.norm","comment":true,"nows":false,"trim":true,"variant":"standard"}],"graded_files":[{"name":"answers.txt","prefill":"q1=   # files/mail/p1.eml verdict (phish|legit|spam) — work it with files/triage-checklist.md\nq2=   # files/mail/p2.eml verdict (phish|legit|spam)\nq3=   # files/mail/p3.eml verdict (phish|legit|spam)\nq4=   # files/mail/p4.eml verdict (phish|legit|spam)\nq5=   # files/mail/p5.eml verdict (phish|legit|spam)\nq6=   # files/mail/p6.eml verdict (phish|legit|spam)\n","expected":"","template":"answers.template.txt","tool_output":false}],"files":[{"name":"mail/p1.eml","size":128,"kind":"text","text":"From: billing@copperm1ne-billing.example\nAuthentication-Results: spf=fail dkim=fail dmarc=fail\nSubject: Invoice 2026-03 Overdue\n"},{"name":"mail/p2.eml","size":172,"kind":"text","text":"From: security@coppermine-portal.example\nAuthentication-Results: spf=fail dkim=fail dmarc=fail\nSubject: Password Reset Required\nLink: http://login-coppermine.example/reset\n"},{"name":"mail/p3.eml","size":126,"kind":"text","text":"From: ar@northshore-freight.com\nAuthentication-Results: spf=pass dkim=pass dmarc=pass\nSubject: Freight Delivery Receipt #8820\n"},{"name":"mail/p4.eml","size":159,"kind":"text","text":"From: deals@shopnwin.example\nAuthentication-Results: spf=pass dkim=pass dmarc=pass\nSubject: 50% Off Office Supplies\nUnsubscribe: http://shopnwin.example/unsub\n"},{"name":"mail/p5.eml","size":127,"kind":"text","text":"From: helpdesk@coppermine.example\nAuthentication-Results: spf=pass dkim=pass dmarc=pass\nSubject: Scheduled Maintenance Tonight\n"},{"name":"mail/p6.eml","size":140,"kind":"text","text":"From: \"Chief Executive Officer\" <ceo-private@external-mail.example>\nAuthentication-Results: spf=none\nSubject: Urgent Wire Transfer Required\n"},{"name":"triage-checklist.md","size":281,"kind":"text","text":"# Phish Queue Checklist\n- **phish**: malicious attachment/payload, crede ort grades on structure and defang, and ships a model report because:","options":{"a":"format and safety can be verified automatically while writing quality calibrates against a worked example","b":"grading is impossible","c":"reports don't matter"},"answer_b64":"YQ=="}],"hints":["Copy files/report-template.md to report.md.","Ensure report.md includes ## Timeline, ## ATT&CK (T1566.001), ## Verdict (malicious), ## Recommendation, and defanged IOCs ([.]).","Verify no raw http://, IP, or domain appears in report.md."],"recap":["A phish investigation runs a pipeline: email → indicators → enrichment → sandbox verdict → a written escalation.","The report is the deliverable Tier 2 acts on — timeline, defanged IOCs, ATT&CK, verdict, recommendation — and every IOC is defanged, always.","Phase 5 complete: you read headers, URLs, attachments, and sandbox reports, worked a mixed phish queue, and wrote the escalation — Phase 6 is investigation and the ticket Tier 2 respects."],"recall":null,"ungradable":false,"assertions":[{"fn":"exists","path":"report.md","hint":""},{"fn":"contains","path":".report.norm","arg":"^## *timeline","hint":""},{"fn":"contains","path":".report.norm","arg":"t1566\\.001","hint":""},{"fn":"contains","path":".report.norm","arg":"^## *verdict","hint":""},{"fn":"contains","path":".report.norm","arg":"(phish|malicious|true positive)","hint":""},{"fn":"contains","path":".report.norm","arg":"^## *recommendation","hint":""},{"fn":"contains","path":".report.norm","arg":"\\[\\.\\]","hint":""},{"fn":"not_contains","path":"report.md","arg":"http://","hint":""},{"fn":"not_contains","path":"report.md","arg":"cdn.stonewick.example","hint":""},{"fn":"not_contains","path":"report.md","arg":"203.0.113.66","hint":""},{"fn":"not_contains","path":"report.md","arg":"198.51.100.71","hint":""}],"norms":[{"source":"report.md","target":".report.norm","comment":false,"nows":false,"trim":true,"variant":"report"}],"graded_files":[{"name":"report.md","prefill":"# Phishing Escalation ed WINWORD.EXE spawning powershell.exe\n\n## Indicators\n- C2 Domain: c2.stonewick[.]example\n- C2 IP: 203.0.113[.]66\n\n## ATT&CK\n- T1059.001 PowerShell\n\n## Verdict\n- True Positive / Malicious\n\n## Recommendation\n- Isolate wks-acct-07 and fs01\n- Block c2.stonewick[.]example at perimeter\n","expected":"","template":"ticket-template.md","tool_output":false}],"files":[{"name":"findings.md","size":323,"kind":"text","text":"# Pre-investigated Findings (M2 Incident)\n- **Scope**: 2 hosts (wks-acct-07, fs01)\n- **Timeline**: 15:41Z macro exec -> 15:46Z beacon & runkey -> 16:12Z rogue admin created\n- **Indicators**: c2.stonewick.example (203.0.113.66), invoice_2026-03.docm, OneDriveUpd\n- **Techniques**: T1566.001, T1059.001, T1547.001, T1136.001\n"},{"name":"model-ticket.md","size":945,"kind":"text","text":"# Escalation Ticket (Worked Example — a DIFFERENT case than the one you are graded on)\nThis example works the 2026-03-12 DNS-tunnel case. Your ticket covers the case in\n`files/`. Copy the SHAPE, not the content.\n\n## Scope\n- 1 host affected: wks-acct-07\n\n## Timeline\n- 2026-03-12 03:10:44Z: Event cm-0312-0310 — 2217 TXT queries to `tun.stonewick[.]example` in 40 minutes, mean label length 48.\n- 2026-03-12 03:51:10Z: query volume stops; no other host shows the pattern.\n\n## Indicators\n- Tunnel zone: `tun.stonewick[.]example`\n- Query type: TXT, 2217 queries / 40 minutes\n\n## ATT&CK\n- T1071.004: Application Layer Protocol — DNS\n- T1048.003: Exfiltration Over Unencrypted Non-C2 Protocol\n\n## Verdict\n- Malicious. The volume, record type and label length are consistent with tunnelled data, not resolution.\n\n## Recommendation\n- Sinkhole the tunnel zone and isolate wks-acct-07 pending review.\n- Pull the 40-minute query capture for Tier 2.\n"}]},{"id":"L6.5","dir":"L6.5-incident-comms","phase":"p6","order":[6,5],"meta":{"id":"L6.5","title":"Incident communication — what you say, to whom, when; the shift handoff","objective":"Match incident communicatio s the pattern.\n\n## Indicators\n- Tunnel zone: `tun.stonewick[.]example`\n- Pattern: TXT record type, 2217 queries in 40 minutes\n\n## ATT&CK\n- T1071.004: Application Layer Protocol — DNS\n- T1048.003: Exfiltration Over Unencrypted Non-C2 Protocol\n\n## Verdict\n- True Positive / Malicious — tunnelled data, not name resolution.\n\n## Recommendation\n- Sinkhole `tun.stonewick[.]example` and isolate wks-acct-07.\n- Hunt the same query shape across the workstation subnets for scope.\n"}]},{"id":"L7.1","dir":"L7.1-automation-bias","phase":"p7","order":[7,1],"meta":{"id":"L7.1","title":"Automation bias — the documented failure modes of analysts supervising machines","objective":"Name the documented failure modes of humans supervising automation — commission, omission, complacency, de-skilling, anchoring","type":"DECODE","gate":false,"est_minutes":15},"lab_md":"## BRIEF\nMatch analyst vignettes (`files/mini-cases.md`) to documented human-automation failure modes (`files/failure-modes.md`).\n\n## GUIDED STEPS\n\n1. Inspect `files/failure-modes.md` and `files/mini-cases.md`.\n2. Copy `files/answers.template.txt` to `answers.txt`.\n3. Fill `answers.txt`. Every line in the template names exactly what it wants —\n   answer each one from the evidence above.\n4. Run `lab check soc L7.1`.\n","quiz":[{"id":1,"type":"choice","prompt":"Automation bias is:","options":{"a":"a software bug","b":"the human tendency to over-trust automated output and under-verify it","c":"a SIEM setting"},"answer_b64":"Yg=="},{"id":2,"type":"choice","prompt":"\"The AI said benign, so I closed it\" is:","options":{"a":"efficient","b":"commission bias — acting on a wrong automated verdict without checking evidence","c":"fine"},"answer_b64":"Yg=="},{"id":3,"type":"choice","prompt":"Why does this course end on verifying AI instead of using it?","options":{"a":"AI is bad","b":"you can only supervise AI triage if you can do triage without it — automation bias is the Tier-1 failure mode","c":"tradition"},"ans ":""}],"norms":[{"source":"answers.txt","target":".answers.norm","comment":true,"nows":false,"trim":true,"variant":"standard"}],"graded_files":[{"name":"answers.txt","prefill":"q1=   # analyst closes an alert because the AI said benign, without reading evidence\nq2=   # analyst misses a real event the AI summary never mentioned\nq3=   # analyst stops spot-checking a tool that's \"always right\"\nq4=   # analyst can no longer triage when the AI assistant is down\nq5=   # analyst's verdict matches the AI's first guess before opening the logs\n","expected":"","template":"answers.template.txt","tool_output":false}],"files":[{"name":"failure-modes.md","size":442,"kind":"text","text":"# Human-Automation Failure Modes\n- **commission**: Acting on a wrong automated action/verdict without verifying.\n- **omission**: Missing an incident because the automation did not flag it.\n- **complacency**: Stopping spot-checks on a system assumed to be \"always right\".\n- **deskilling**: Losing the ability to triage manually when automation is unavailable.\n- **anchoring**: Accepting the AI's initial guess before reading the raw evidence.\n"},{"name":"mini-cases.md","size":404,"kind":"text","text":"# Analyst Vignettes\n1. Analyst closes an alert because AI marked it benign, without reading logs.\n2. Analyst misses an intrusion phase because AI summary omitted network logs.\n3. Analyst stops auditing AI outputs after a month of high agreement.\n4. Analyst is unable to investigate when the AI assistant service goes down.\n5. Analyst forms a verdict matching the AI suggestion before opening raw events.\n"}]},{"id":"L7.2","dir":"L7.2-verify-reps-1","phase":"p7","order":[7,2],"meta":{"id":"L7.2","title":"VERIFY reps I — three AI triage summaries vs raw evidence; one is subtly wrong","objective":"Verify three AI triage summaries against raw evidence and identify the one that is subtly wrong and why","type":"VERIFY","gate":false,"est_minutes":20},"lab_md":"## BRIEF\nVerify three AI triage summaries against raw evidence in `files/`. Identify the flawed summary and its contradicting event ID.\n\n## GUIDED STEPS\n\n1. Inspect `files/summary1`, `files/summary2`, and `files/summary3`.\n2. Copy `files/answers.template.txt` to `answers.txt`.\n3. Fill `answers.txt`. Every line in the template names exactly what it wants —\n   answer each one from the evidence above.\n4. Run `lab check soc L7.2`.\n","quiz":[{"id":1,"type":"choice","prompt":"A confident, well-written AI summary is:","options":{"a":"correct by definition","b":"a claim to verify against evidence — fluency is not accuracy","c":"always wrong"},"answer_b64":"Yg=="},{"id":2,"type":"choice","prompt":"summary2 says \"no persistence\" but Run key CM-0311-0181 is in evidence. This is:","options":{"a":"fine","b":"a contradicted claim — evidence opposes summary","c":"grounded"},"answer_b64":"Yg=="},{"id":3,"type":"choice","prompt":"The hardest AI error to catch is the one that:","options":{"a":"is obviously wrong","b":"is mostly right with one subtle, confident error","c":"has no citations"},"answer_b64":"Yg=="}],"hints":["Summary 2 claims no persistence, but cm-0311-0181 is a Run key event.","q1=grounded, q2=flawed, q2f=contradicted, q2e=cm-0311-0181, q3=grounded.","Ensure answers.txt contains q1..q3."],"recap":["Verify every AI summary against the evidence — two of three here are right, and the wrong one is confident and subtle.","The dangerous error contradicts the evidence quietly: 'no persistence' while the Run key sits in the logs.","Read what the summary omits as carefully as what it asserts; confidence is not correctness."],"recall":null,"ungradable":false,"assertions":[{"fn":"exists","path":"answers.txt","hint":""},{"fn":"contains_fixed","path":".answers.norm","arg":"q1=grounded","hint":""},{"fn":"contains_fixed","path":".answers.norm","arg":"q2=flawed","hint":""},{"fn":"contains_fixed","path":".answers.norm","arg":"q2f=contradicted","hint":""},{"fn":"contains_fixed","path":".answers.norm","arg":"q2 es into detection-improving feedback","type":"DECODE","gate":false,"est_minutes":15},"lab_md":"## BRIEF\nDetermine whether to accept or override AI verdicts in `files/override-cases.md` and name the feedback output.\n\n## GUIDED STEPS\n\n1. Inspect `files/override-cases.md`.\n2. Copy `files/answers.template.txt` to `answers.txt`.\n3. Fill `answers.txt`. Every line in the template names exactly what it wants —\n   answer each one from the evidence above.\n4. Run `lab check soc L7.5`.\n","quiz":[{"id":1,"type":"choice","prompt":"You override an AI verdict when:","options":{"a":"never","b":"the evidence does not support it — missing citation, contradiction, or hallucinated ID","c":"always"},"answer_b64":"Yg=="},{"id":2,"type":"choice","prompt":"\"The AI said benign\" is:","options":{"a":"a verdict","b":"not a verdict — you own the call, backed by evidence","c":"sufficient"},"answer_b64":"Yg=="},{"id":3,"type":"choice","prompt":"A good override does more than fix one alert; it:","options":{"a":"closes faster","b":"feeds tuning/labels back so detection or model improves — closing the loop","c":"escalates"},"answer_b64":"Yg=="}],"hints":["q1=accept, q2=override, q3=override, q4=accept, q5=override, q6=tuning.","Accept supported verdicts; override unsupported ones.","Overrides feed tuning back to detection engineering."],"recap":["Accept the AI when the evidence supports it; override when it doesn't — a missing citation, a contradiction, or a hallucinated id.","'The AI said benign' is never a verdict; you own the call, and the evidence backs it.","Every override is feedback — tuning a brittle rule or labeling a model error closes the loop and makes the next shift's automation better."],"recall":null,"ungradable":false,"assertions":[{"fn":"exists","path":"answers.txt","hint":""},{"fn":"contains_fixed","path":".answers.norm","arg":"q1=accept","hint":""},{"fn":"contains_fixed","path":".answers.norm","arg":"q2=override","hint":""},{"fn":"contains_fixed","path":".answers.norm",       viewer.textContent = '';
      if (st.table) {
        var rows = parseCsv(text);
        var head = rows.shift() || [];
        var tbl = h('table', null, h('thead', null, h('tr', null, head.map(function (c) { return h('th', null, c); }))));
        var tbody = h('tbody');
        var shownRows = 0;
        rows.forEach(function (r) {
          if (st.q && r.join(' ').toLowerCase().indexOf(st.q) === -1) { return; }
          shownRows++;
          tbody.appendChild(h('tr', null, r.map(function (c) { return h('td', null, c); })));
        });
        tbl.appendChild(tbody);
        viewer.appendChild(tbl);
        count.textContent = shownRows + ' / ' + rows.length + ' rows';
        return;
      }
      var lines = shown().split('\n');
      var frag = document.createDocumentFragment();
      var shownN = 0;
      var CAP = 3000;
      lines.forEach(function (l, i) {
        if (st.q && l.toLowerCase().indexOf(st.q) === -1) { return; }
        shownN++;
        if (shownN > CAP) { return; }
        frag.appendChild(h('div', { class: 'ln' }, h('span', { class: 'n' }, String(i + 1)), h('span', { class: 't' }, l)));
      });
      var pre = h('pre', null);
      pre.appendChild(frag);
      viewer.appendChild(pre);
      count.textContent = shownN + ' / ' + lines.length + ' lines' + (shownN > CAP ? ' (first ' + CAP + ' shown)' : '');
    }
    draw();
    return h('div', null, toolbar, viewer);
  }

  /* ---------- recall (non-gating warm-up) ---------- */
  function recallPanel(lab) {
    var qs = lab.recall;
    var det = h('details', { class: 'panel', id: 'recall' },
      h('summary', null, 'Warm-up recall (' + qs.length + ' questions, never gates the lab)'));
    var form = h('form', { 'aria-label': 'Recall warm-up' });
    var inputs = qs.map(function (q, i) { return questionField(q, i, 'R'); });
    inputs.forEach(function (x) { form.appendChild(x.el); });
    var out = h('div', null);
    form.appendChild(h('div', { class: 'actions' }, h('button', { type: 'submit' }, 'Submit warm-up')));
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var res = Quiz.grade(qs, inputs.map(function (x) { return x.value(); }));
      var need = Math.floor((qs.length * 4 + 4) / 5);
      out.textContent = '';
      var pass = qs.length > 0 && res.correct >= need;
      out.appendChild(h('p', { class: 'verdict ' + (pass ? 'ok' : 'bad') },
        'recall: ' + res.correct + '/' + res.total + (pass ? ' — pass' : ' (missed ' + res.missed.map(function (n) { return 'R' + n; }).join(',') + ')')));
      res.missed.forEach(function (n) {
        var src = qs[n - 1].source;
        if (!src) { return; }
        var idx = BY_ID[src];
        var link = idx !== undefined && accessible(LABS, State, idx)
          ? h('a', { href: '#/lab/' + src }, src) : h('span', null, src);
        out.appendChild(h('p', null, 'review: ', link));
      });
    });
    det.appendChild(form);
    det.appendChild(out);
    return det;
  }

  var uid = 0;
  function questionField(q, i, prefix) {
    var label = prefix + (i + 1);
    var fs = h('fieldset', { class: 'q' }, h('legend', null, label + '. ' + q.prompt));
    var getter;
    if (q.type === 'choice') {
      var group = prefix + i + '_' + (uid++);
      Object.keys(q.options).sort().forEach(function (k) {
        fs.appendChild(h('label', null,
          h('input', { type: 'radio', name: group, value: k }),
          ' ' + k + ') ' + q.options[k]));
      });
      getter = function () {
        var c = fs.querySelector('input[type=radio]:checked');
        return c ? c.value : '';
      };
    } else {
      var inp = h('input', { type: 'text', autocomplete: 'off', 'aria-label': label + ' answer' });
      fs.appendChild(inp);
      getter = function () { return inp.value; };
    }
    return { el: fs, value: getter };
  }

  /* ---------- lab view ---------- */
  function readDrafts() {
    try { return JSON.parse(lsGet(DRAFT_KEY) || '{}') || {}; } catch (e) { return {}; }
  }
  function writeDraft(id, name, text) {
    var d = readDrafts();
    d[id] = d[id] || {};
    d[id][name] = text;
    lsSet(DRAFT_KEY, JSON.stringify(d));
  }

  function labView(id) {
    var idx = BY_ID[id];
    if (idx === undefined) {
      view.appendChild(h('p', null, 'No such lab: ' + id + '. ', h('a', { href: '#/' }, 'Back to the track')));
      current = null;
      return;
    }
    var lab = LABS[idx];
    if (!accessible(LABS, State, idx)) {
      var fi = frontierIndex(LABS, State);
      view.appendChild(h('div', { class: 'banner' },
        h('p', null, '○ ' + lab.id + ' is locked. Labs unlock in order: pass or skip the lab before it first.'),
        fi === -1 ? null : h('a', { class: 'btn primary', href: '#/lab/' + LABS[fi].id }, 'Go to ' + LABS[fi].id)));
      current = null;
      return;
    }
    State.start(lab.id);

    var ui = { filter: null };
    var drafts = readDrafts()[lab.id] || {};
    var texts = {};
    lab.graded_files.forEach(function (g) { texts[g.name] = typeof drafts[g.name] === 'string' ? drafts[g.name] : g.prefill; });

    var root = h('div', null);
    root.appendChild(h('p', { class: 'crumbs' }, h('a', { href: '#/' }, '← Track'), ' · ',
      DATA.track.phases[lab.phase] || lab.phase));
    root.appendChild(h('header', { class: 'lab-head' },
      h('h1', null, lab.id + ' — ' + lab.meta.title),
      h('p', { class: 'objective' }, lab.meta.objective),
      h('div', { class: 'badges' }, badges(lab))));
    root.appendChild(h('p', { class: 'cli-note' },
      'The steps below come from the terminal kit. Here, skip the shell commands: read the evidence, write your answers in the Workspace boxes, then press Check.'));

    if (lab.recall) { root.appendChild(recallPanel(lab)); }

    var secs = Md.sections(lab.lab_md);
    secs.forEach(function (s) {
      var isOnion = /security onion/i.test(s.title);
      var inner = '<h2>' + Md.esc(s.title) + '</h2>' + Md.render(s.body);
      if (isOnion) {
        root.appendChild(h('details', { class: 'panel md', html: '<summary>' + Md.esc(s.title) + '</summary>' + Md.render(s.body) }));
      } else {
        root.appendChild(h('section', { class: 'panel md', html: inner }));
      }
    });

    root.appendChild(evidencePanel(lab, ui));

    // workspace
    var ws = h('section', { class: 'panel', id: 'workspace' }, h('h2', null, 'Workspace'));
    var areas = {};
    lab.graded_files.forEach(function (g) {
      var ta = h('textarea', { id: 'ws-' + g.name.replace(/[^\w]/g, '_'), 'data-name': g.name, spellcheck: 'false', autocomplete: 'off', autocapitalize: 'off' });
      ta.value = texts[g.name];
      ta.rows = Math.max(4, Math.min(18, ta.value.split('\n').length + 1));
      ta.addEventListener('input', function () { texts[g.name] = ta.value; writeDraft(lab.id, g.name, ta.value); });
      areas[g.name] = ta;
      var box = h('div', { class: 'ws-file' }, h('label', { for: ta.id }, g.name), ta);
      if (g.tool_output) {
        box.appendChild(h('p', { class: 'ws-note' },
          'In the terminal kit this file holds a tool’s output. Paste the output here, or fill it from the expected output.'));
        box.appendChild(h('button', { type: 'button', class: 'fill', onclick: function () {
          ta.value = g.expected; texts[g.name] = g.expected; writeDraft(lab.id, g.name, g.expected);
        } }, 'Fill from expected output'));
      }
      ws.appendChild(box);
    });
    if (!lab.graded_files.length) { ws.appendChild(h('p', { class: 'muted' }, 'This lab has no files to write.')); }
    root.appendChild(ws);

    // hints
    var hintBox = h('div', { id: 'hints' });
    var hintBtn = h('button', { type: 'button', id: 'btn-hint' }, 'Hint');
    function drawHints(announce) {
      var used = State.rec(lab.id).hints_used;
      var total = lab.hints.length;
      hintBox.textContent = '';
      for (var i = 0; i < used && i < total; i++) {
        hintBox.appendChild(h('div', { class: 'hint' },
          h('div', { class: 'hh' }, '[hint ' + (i + 1) + '/' + total + '] ' + TRACK_ID + ' ' + lab.id),
          h('p', null, lab.hints[i])));
      }
      if (used > 0) {
        var rem = total - used;
        hintBox.appendChild(h('p', { class: 'muted' }, rem > 0
          ? '(' + rem + ' hint' + (rem === 1 ? '' : 's') + ' remaining)'
          : '(that was the last hint)'));
      }
      hintBtn.disabled = used >= total;
      hintBtn.textContent = used >= total ? 'No more hints' : (used === 0 ? 'Hint' : 'Next hint');
      if (announce && used >= total) { /* last hint already announced inline */ }
    }
    hintBtn.addEventListener('click', function () {
      var used = State.rec(lab.id).hints_used;
      if (used >= lab.hints.length) { return; }
      State.hint(lab.id, lab.hints.length);
      drawHints(true);
    });

    // check + quiz
    var resultsBox = h('div', { id: 'results' });
    var quizBox = h('div', { id: 'quiz' });
    var doneBox = h('div', { id: 'done' });
    var meta = h('p', { class: 'muted', id: 'attempts' });
    function drawMeta() {
      var r = State.rec(lab.id);
      meta.textContent = 'attempts: ' + r.attempts + ' · hints used: ' + r.hints_used + '/' + lab.hints.length;
    }
    function drawDone() {
      doneBox.textContent = '';
      var r = State.rec(lab.id);
      if (r.status === 'passed') {
        doneBox.appendChild(h('div', { class: 'banner passed' }, h('strong', null, '✓ passed ' + lab.id),
          h('div', { class: 'recap' }, h('p', { class: 'muted' }, 'recap'), h('ul', null, lab.recap.map(function (l) { return h('li', null, l); })))));
        var ni = idx + 1;
        if (ni < LABS.length) {
          doneBox.appendChild(h('a', { class: 'btn primary', id: 'btn-next', href: '#/lab/' + LABS[ni].id }, 'Next lab: ' + LABS[ni].id));
        } else {
          doneBox.appendChild(h('p', null, 'That was the last lab in the track.'));
        }
      }
    }

    function showQuiz() {
      quizBox.textContent = '';
      var form = h('form', { id: 'quiz-form', 'aria-label': 'Quiz' }, h('h3', null, 'Quiz — ' + lab.quiz.length + ' questions'));
      var fields = lab.quiz.map(function (q, i) { return questionField(q, i, 'Q'); });
      fields.forEach(function (f) { form.appendChild(f.el); });
      var verdict = h('div', null);
      form.appendChild(h('div', { class: 'actions' }, h('button', { type: 'submit', class: 'primary', id: 'btn-quiz' }, 'Submit quiz')));
      form.appendChild(verdict);
      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        var res = Quiz.grade(lab.quiz, fields.map(function (f) { return f.value(); }));
        verdict.textContent = '';
        var all = res.correct === res.total;
        verdict.appendChild(h('p', { class: 'verdict ' + (all ? 'ok' : 'bad'), id: 'quiz-verdict' },
          'quiz: ' + res.correct + '/' + res.total + (all ? '' : ' (missed ' + res.missed.map(function (n) { return 'Q' + n; }).join(',') + ')')));
        if (all) {
          if (State.rec(lab.id).status !== 'passed') { State.pass(lab.id, lab.recap); }
          drawDone();
          drawMeta();
        } else {
          verdict.appendChild(h('p', { class: 'muted' }, 'quiz not passed — re-run check.'));
        }
      });
      quizBox.appendChild(form);
    }

    function doCheck() {
      State.attempt(lab.id);
      drawMeta();
      resultsBox.textContent = '';
      quizBox.textContent = '';
      var res = Grader.run(lab, texts);
      var list = h('ul', { class: 'results' });
      res.results.forEach(function (r, i) {
        list.appendChild(h('li', { class: 'res ' + (r.ok ? 'ok' : 'bad') },
          h('span', { class: 'mk' }, r.ok ? '✓' : '✗'), '[' + (i + 1) + '] ' + r.msg,
          r.terminal ? h('span', { class: 'term' }, 'terminal-only, counted satisfied here' + (r.hint ? ' — ' + r.hint : '')) : null,
          !r.ok && r.hint ? h('span', { class: 'look' }, 'look at: ' + r.hint) : null));
      });
      resultsBox.appendChild(list);
      resultsBox.appendChild(h('p', { class: 'tally', id: 'tally' }, 'checks ' + res.passed + '/' + res.total));
      if (res.pass) { showQuiz(); }
      else { resultsBox.appendChild(h('p', { class: 'muted' }, 'Fix the failing checks, then press Check again.')); }
    }

    var checkBtn = h('button', { type: 'button', class: 'primary', id: 'btn-check', onclick: doCheck }, 'Check');
    var skipBtn = h('button', { type: 'button', id: 'btn-skip', onclick: function () {
      if (!window.confirm('Skip ' + lab.id + '? It is marked ⏭ and the next lab unlocks. You can still open it later.')) { return; }
      State.skip(lab.id);
      var n = idx + 1 < LABS.length ? LABS[idx + 1].id : null;
      window.location.hash = n ? '#/lab/' + n : '#/';
    } }, 'Skip lab');

    var actions = h('div', { class: 'actions' }, checkBtn, hintBtn);
    if (lab.ungradable) {
      actions.appendChild(h('button', { type: 'button', id: 'btn-complete', onclick: function () {
        State.attempt(lab.id);
        State.pass(lab.id, lab.recap);
        drawDone(); drawMeta();
      } }, 'Mark complete'));
    }
    actions.appendChild(skipBtn);
    root.appendChild(h('section', { class: 'panel', id: 'grader' }, h('h2', null, 'Check'), actions, meta, hintBox, resultsBox, quizBox, doneBox));
    drawHints(false);
    drawMeta();
    drawDone();

    var nav = h('div', { class: 'nav-row' },
      idx > 0 ? h('a', { class: 'btn', href: '#/lab/' + LABS[idx - 1].id }, '← ' + LABS[idx - 1].id) : h('span'),
      idx + 1 < LABS.length && accessible(LABS, State, idx + 1) ? h('a', { class: 'btn', href: '#/lab/' + LABS[idx + 1].id }, LABS[idx + 1].id + ' →') : h('span'));
    root.appendChild(nav);
    view.appendChild(root);

    current = {
      check: doCheck,
      hint: function () { hintBtn.click(); },
      next: function () {
        var st = State.rec(lab.id);
        if ((st.status === 'passed' || st.skipped) && idx + 1 < LABS.length) { window.location.hash = '#/lab/' + LABS[idx + 1].id; }
        else { toast('Pass or skip ' + lab.id + ' before moving on.'); }
      },
      filter: function () { if (ui.filter) { ui.filter(); } }
    };
  }

  /* ---------- router / chrome ---------- */
  function route() {
    view.textContent = '';
    var m = /^#\/lab\/([\w.-]+)$/.exec(window.location.hash);
    if (m) { labView(m[1]); } else { homeView(); }
    window.scrollTo(0, 0);
  }

  function setTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
  }

  function download(name, text) {
    var blob = new Blob([text], { type: 'application/json' });
    var a = h('a', { href: URL.createObjectURL(blob), download: name });
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  function boot() {
    view = document.getElementById('view');
    document.getElementById('brand-title').textContent = DATA.track.title;
    document.getElementById('brand-tag').textContent = DATA.track.tagline;
    document.title = DATA.track.title;

    var saved = lsGet(THEME_KEY);
    if (saved === 'light' || saved === 'dark') { setTheme(saved); }
    document.getElementById('btn-theme').addEventListener('click', function () {
      var eff = document.documentElement.getAttribute('data-theme') ||
        (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      var next = eff === 'dark' ? 'light' : 'dark';
      lsSet(THEME_KEY, next);
      setTheme(next);
    });

    document.getElementById('btn-export').addEventListener('click', function () {
      download('progress.json', JSON.stringify(State.doc(), null, 2) + '\n');
    });
    var fileIn = document.getElementById('file-import');
    document.getElementById('btn-import').addEventListener('click', function () { fileIn.click(); });
    fileIn.addEventListener('change', function () {
      var f = fileIn.files && fileIn.files[0];
      if (!f) { return; }
      var rd = new FileReader();
      rd.onload = function () {
        try {
          var d = JSON.parse(String(rd.result));
          if (!stateValid(d)) { throw new Error('not a LAB-KIT progress.json (version 1)'); }
          State.replace(d);
          toast('Progress imported.');
          route();
        } catch (e) { toast('Import failed: ' + e.message); }
        fileIn.value = '';
      };
      rd.readAsText(f);
    });
    document.getElementById('btn-reset').addEventListener('click', function () {
      if (!window.confirm('Erase all SOC progress stored in this browser?')) { return; }
      State.reset();
      lsSet(DRAFT_KEY, '{}');
      toast('Progress reset.');
      if (window.location.hash && window.location.hash !== '#/') { window.location.hash = '#/'; } else { route(); }
    });

    view.addEventListener('click', function (ev) {
      var b = ev.target.closest ? ev.target.closest('[data-copy]') : null;
      if (!b) { return; }
      var pre = b.parentNode.querySelector('pre');
      copyText(pre ? pre.textContent : '').then(function () {
        b.textContent = 'copied';
        setTimeout(function () { b.textContent = 'copy'; }, 1200);
      });
    });

    document.addEventListener('keydown', function (ev) {
      if (ev.ctrlKey || ev.metaKey || ev.altKey) { return; }
      var t = ev.target;
      var typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
      if (ev.key === 'Escape' && typing) { t.blur(); return; }
      if (typing || !current) { return; }
      if (ev.key === 'c' && current.check) { ev.preventDefault(); current.check(); }
      else if (ev.key === 'h' && current.hint) { ev.preventDefault(); current.hint(); }
      else if (ev.key === 'n' && current.next) { ev.preventDefault(); current.next(); }
      else if (ev.key === '/' && current.filter) { ev.preventDefault(); current.filter(); }
    });

    window.addEventListener('hashchange', route);
    route();
  }

  boot();
})();
</script>
</body>
</html>
