<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOC Analyst Lab</title>
<style>
:root {
  --bg: #f7f7f4;
  --fg: #1d2127;
  --muted: #5d6673;
  --card: #ffffff;
  --border: #d9dbd4;
  --accent: #0b5cad;
  --accent-fg: #ffffff;
  --ok: #17703a;
  --ok-bg: #e4f4ea;
  --bad: #b3261e;
  --bad-bg: #fbe9e7;
  --warn: #8a5a00;
  --warn-bg: #fff4d6;
  --code-bg: #eef0ec;
  --focus: #0b5cad;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171b;
    --fg: #e4e7ea;
    --muted: #9aa4b0;
    --card: #1c2025;
    --border: #353b43;
    --accent: #6cb0f5;
    --accent-fg: #0c1218;
    --ok: #6fd392;
    --ok-bg: #16301f;
    --bad: #ff8a80;
    --bad-bg: #3a1c1a;
    --warn: #f0c36a;
    --warn-bg: #352a10;
    --code-bg: #262b31;
    --focus: #6cb0f5;
  }
}
:root[data-theme="dark"] {
  --bg: #14171b;
  --fg: #e4e7ea;
  --muted: #9aa4b0;
  --card: #1c2025;
  --border: #353b43;
  --accent: #6cb0f5;
  --accent-fg: #0c1218;
  --ok: #6fd392;
  --ok-bg: #16301f;
  --bad: #ff8a80;
  --bad-bg: #3a1c1a;
  --warn: #f0c36a;
  --warn-bg: #352a10;
  --code-bg: #262b31;
  --focus: #6cb0f5;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.5 var(--sans);
}
a { color: var(--accent); }
code, kbd, pre { font-family: var(--mono); font-size: 0.9em; }
code { background: var(--code-bg); padding: 0.1em 0.35em; border-radius: 4px; overflow-wrap: anywhere; }
kbd { background: var(--code-bg); border: 1px solid var(--border); border-radius: 4px; padding: 0 0.3em; }
h1, h2, h3, h4 { line-height: 1.25; margin: 1.2em 0 0.5em; }
h1 { font-size: 1.5rem; }
h2 { font-size: 1.2rem; }
h3 { font-size: 1.05rem; }
p { margin: 0.6em 0; }
ul, ol { padding-left: 1.4em; margin: 0.5em 0; }
li { margin: 0.25em 0; }
.muted { color: var(--muted); }

button, .btn {
  font: inherit;
  font-size: 0.9rem;
  background: var(--card);
  color: var(--fg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 0.4em 0.8em;
  cursor: pointer;
  text-decoration: none;
  display: inline-block;
}
button:hover, .btn:hover { border-color: var(--accent); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
button.primary, .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button.danger { color: var(--bad); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.top { border-bottom: 1px solid var(--border); background: var(--card); }
.top-inner {
  max-width: 1000px; margin: 0 auto; padding: 10px 16px;
  display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between;
}
.brand { text-decoration: none; color: var(--fg); display: block; min-width: 0; }
.brand-title { font-weight: 700; font-size: 1.1rem; display: block; }
.brand-tag { color: var(--muted); font-size: 0.85rem; display: block; }
.tools { display: flex; flex-wrap: wrap; gap: 6px; }

main { max-width: 1000px; margin: 0 auto; padding: 8px 16px 32px; outline: none; }
.foot { max-width: 1000px; margin: 0 auto; padding: 0 16px 32px; color: var(--muted); font-size: 0.85rem; }

.toast {
  position: fixed; left: 16px; right: 16px; bottom: 16px; max-width: 480px; margin: 0 auto;
  background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 8px; z-index: 10;
  text-align: center;
}

/* home */
.summary { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin: 12px 0; }
.summary .totals { color: var(--muted); }
.bar { height: 8px; background: var(--code-bg); border-radius: 4px; overflow: hidden; flex: 1 1 160px; min-width: 120px; }
.bar > span { display: block; height: 100%; background: var(--ok); }
.filter-row { margin: 8px 0 16px; }
input[type="text"], input[type="search"] {
  font: inherit; background: var(--card); color: var(--fg);
  border: 1px solid var(--border); border-radius: 6px; padding: 0.4em 0.6em; width: 100%; max-width: 100%;
}
.phase { margin: 20px 0; }
.phase-head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; justify-content: space-between; }
.phase-head h2 { margin: 0; }
.rows { margin-top: 8px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--card); }
.lab-row {
  display: grid; grid-template-columns: 1.6em 3.2em minmax(0, 1fr); gap: 2px 8px; align-items: baseline;
  padding: 8px 10px; border-top: 1px solid var(--border); color: var(--fg); text-decoration: none;
}
.lab-row:first-child { border-top: 0; }
a.lab-row:hover { background: var(--code-bg); }
.lab-row.locked { color: var(--muted); }
.lab-row .mark { text-align: center; font-weight: 700; }
.mark-passed { color: var(--ok); }
.mark-frontier { color: var(--accent); }
.mark-skipped { color: var(--warn); }
.lab-row .id { font-family: var(--mono); font-size: 0.9rem; }
.lab-row .title { min-width: 0; overflow-wrap: anywhere; }
.lab-row .badges { grid-column: 3; display: flex; flex-wrap: wrap; gap: 4px 6px; }
.badge {
  font-size: 0.72rem; border: 1px solid var(--border); border-radius: 999px; padding: 0 0.55em;
  color: var(--muted); white-space: nowrap;
}
.badge.gate { color: var(--warn); border-color: var(--warn); }
.badge.type { text-transform: uppercase; letter-spacing: 0.03em; }

/* lab view */
.crumbs { margin: 10px 0 0; font-size: 0.9rem; }
.lab-head h1 { margin: 6px 0 4px; overflow-wrap: anywhere; }
.lab-head .objective { margin: 4px 0 8px; color: var(--muted); }
.lab-head .badges { display: flex; flex-wrap: wrap; gap: 6px; }
.cli-note {
  background: var(--warn-bg); color: var(--fg); border: 1px solid var(--warn);
  border-radius: 8px; padding: 8px 12px; margin: 12px 0; font-size: 0.9rem;
}
.panel {
  background: var(--card); border: 1px solid var(--border); border-radius: 8px;
  padding: 4px 14px 14px; margin: 16px 0; min-width: 0;
}
.panel > h2:first-child { margin-top: 10px; }
details.panel > summary { cursor: pointer; font-weight: 600; padding: 10px 0 6px; }
.md h2 { margin-top: 0.4em; }
.code { position: relative; margin: 0.6em 0; }
.code pre {
  margin: 0; padding: 10px 12px; background: var(--code-bg); border-radius: 6px;
  overflow-x: auto; max-width: 100%;
}
.code .copy { position: absolute; top: 4px; right: 4px; font-size: 0.75rem; padding: 0.1em 0.5em; opacity: 0.85; }

.tabs { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 6px; max-width: 100%; }
.tab { white-space: nowrap; flex: 0 0 auto; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0; }
.toolbar input[type="text"] { flex: 1 1 160px; width: auto; }
.toolbar label { font-size: 0.85rem; color: var(--muted); white-space: nowrap; }
.viewer { max-height: 420px; overflow: auto; border: 1px solid var(--border); border-radius: 6px; background: var(--code-bg); }
.viewer pre { margin: 0; padding: 8px 0; min-width: min-content; }
.ln { display: flex; gap: 10px; padding: 0 10px; white-space: pre; }
.ln .n { color: var(--muted); text-align: right; min-width: 3em; user-select: none; flex: 0 0 auto; }
.viewer table { border-collapse: collapse; font-size: 0.85rem; }
.viewer th, .viewer td { border: 1px solid var(--border); padding: 3px 8px; text-align: left; white-space: nowrap; }
.viewer th { position: sticky; top: 0; background: var(--card); }
dl.meta { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px 12px; margin: 6px 0; }
dl.meta dt { color: var(--muted); }
dl.meta dd { margin: 0; overflow-wrap: anywhere; font-family: var(--mono); font-size: 0.85rem; }

.ws-file { margin: 12px 0; }
.ws-file label { font-family: var(--mono); font-size: 0.9rem; display: block; margin-bottom: 4px; }
textarea {
  display: block; width: 100%; max-width: 100%; font: 0.9rem/1.45 var(--mono);
  background: var(--card); color: var(--fg); border: 1px solid var(--border);
  border-radius: 6px; padding: 8px; resize: vertical; tab-size: 4;
}
.ws-note { font-size: 0.85rem; color: var(--muted); margin: 4px 0; }

.actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 6px; }
.hint { background: var(--warn-bg); border: 1px solid var(--warn); border-radius: 8px; padding: 8px 12px; margin: 8px 0; }
.hint .hh { font-family: var(--mono); font-size: 0.85rem; color: var(--warn); }
.hint p { margin: 4px 0 0; }
.results { list-style: none; padding: 0; margin: 8px 0; }
.res { padding: 4px 8px; border-radius: 6px; margin: 3px 0; overflow-wrap: anywhere; font-family: var(--mono); font-size: 0.85rem; }
.res.ok { background: var(--ok-bg); }
.res.bad { background: var(--bad-bg); }
.res .mk { font-weight: 700; margin-right: 6px; }
.res.ok .mk { color: var(--ok); }
.res.bad .mk { color: var(--bad); }
.res .look { display: block; margin-left: 2.2em; color: var(--muted); }
.res .term { display: block; margin-left: 2.2em; color: var(--warn); }
.tally { font-family: var(--mono); font-weight: 700; margin: 6px 0; }
fieldset.q { border: 1px solid var(--border); border-radius: 8px; margin: 10px 0; padding: 8px 12px; min-width: 0; }
fieldset.q legend { font-weight: 600; padding: 0 6px; }
fieldset.q label { display: block; margin: 4px 0; }
.verdict { font-family: var(--mono); font-weight: 700; margin: 8px 0; }
.verdict.ok { color: var(--ok); }
.verdict.bad { color: var(--bad); }
.banner { border-radius: 8px; padding: 8px 12px; margin: 12px 0; }
.banner.passed { background: var(--ok-bg); border: 1px solid var(--ok); }
.recap ul { margin: 4px 0; }
.nav-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; margin: 20px 0; }

@media (max-width: 520px) {
  .top-inner { padding: 8px 16px; }
  .lab-row { grid-template-columns: 1.4em minmax(0, 1fr); }
  .lab-row .id { grid-column: 2; }
  .lab-row .title, .lab-row .badges { grid-column: 2; }
  .panel { padding: 2px 10px 12px; }
}
</style>
</head>

{"build":{"tshark":"TShark (Wireshark) 4.2.2 (Git v4.2.2 packaged as 4.2.2-1.1build3).","labs":52},"track":{"title":"SOC Analyst Lab","tagline":"Triage. Investigate. Escalate. Verify.","order":30,"phases":{"p0":"Toolbelt & Kit","p1":"How Attacks Become Alerts","p2":"Network Triage Fundamentals","p3":"Endpoint Triage Fundamentals","p4":"Triage Craft & the Queue","p5":"Phishing & Malware Triage","p6":"Investigation & Escalation","p7":"The AI-Assisted Analyst"},"requires":[{"cmd":"tshark","hint":"sudo apt-get install -y tshark"},{"cmd":"dig","hint":"sudo apt-get install -y dnsutils"},{"cmd":"whois","hint":"sudo apt-get install -y whois"},{"cmd":"rg","hint":"sudo apt-get install -y ripgrep"}]},"labs":[{"id":"L0.1","dir":"L0.1-analyst-toolbelt-install-verify-jq-tshark-dig-whois-ripgrep","phase":"p0","order":[0,1],"meta":{"id":"L0.1","title":"Analyst toolbelt - install/verify jq, tshark, dig, whois, ripgrep","type":"GUIDED","objective":"Install the five analyst tools, then prove each works by extracting one fact from staged Coppermine evidence.","gate":false,"est_minutes":15},"lab_md":"## BRIEF\nEvery SOC analyst needs a core command-line toolbelt for inspecting log data, packet captures, DNS records, and domain WHOIS reports.\nYour toolbelt consists of five core utilities: `jq` (JSON parsing), `tshark` (packet analysis), `dig` (DNS lookups), `whois` (domain registration data), and `ripgrep` (`rg`, fast text searching).\nIn this lab, you install or verify these five utilities in your environment and run each tool against staged Coppermine Logistics evidence.\n`lab check` runs with no network connection, so `dig` and `whois` — the two tools whose real job is a live network lookup — are graded on version output plus the staged mock WHOIS report only, not a real query; `jq`, `tshark`, and `rg` work entirely against local files, so they're graded on their actual extracted output.\n\n## GUIDED STEPS\n\n1. **Install/verify the analyst toolbelt**:\n   Run the package manager installation:\n   ```bash\n   sudo apt-get update && sudo apt-get install -y jq tshark dnsutils whois ripgrep\n   ```\n   *(Note: If prompted whether non-root users should be allowed to capture packets, select either option — reading PCAP files requires no special privileges).*\n\n2. **Move into your workspace**:\n   Every graded file in the steps below is read from and written to your\n   fenced workspace, not wherever your shell happens to be — `lab check`\n   always grades from here regardless of your current directory:\n   ```bash\n   cd workspace/soc/L0.1\n   ```\n\n3. **Generate tool version proof (`toolcheck.txt`)**:\n   Execute the version check commands into `toolcheck.txt`:\n   ```bash\n   { jq --version; tshark --version | head -1; dig -v 2>&1; whois --version; rg --version | head -1; } > toolcheck.txt\n   ```\n\n4. **Extract username using `jq`**:\n   Parse `.user.name` from `sample-event.json` into `jq_out.txt`:\n   ```bash\n   jq -r '.user.name' sample-event.json > jq_out.txt\n   ```\n\n5. **Extract unique DNS query names using `tshark`**:\n   Parse DNS queries from `fixtures.pcap` into `tshark_out.txt`:\n   ```bash\n   tshark -n -r fixtures.pcap -T fields -e dns.qry.name | sort -u > tshark_out.txt\n   ```\n\n6. **Search escalation marker using `ripgrep`**:\n   Search for the escalation marker in `notes/triage-notes.txt` into `rg_out.txt`:\n   ```bash\n   rg --no-ignore 'escalation-marker' notes/ > rg_out.txt\n   ```\n\n7. **Inspect mock WHOIS report**:\n   View the registration details for `stonewick.example`:\n   ```bash\n   grep 'Creation Date' whois-stonewick.txt\n   ```\n\n8. **Check your work**:\n   ```bash\n   lab check soc L0.1\n   ```\n","quiz":[{"id":1,"type":"text","prompt":"Per whois-stonewick.txt, on what date was stonewick.example registered? (YYYY-MM-DD)","answer_b64":"MjAyNi0wMi0yNw==","accept_b64":["MjAyNi0wMi0yNw==","MjAyNi0wMi0yN3QxODo0NDowOXo="]},{"id":2,"type":"choice","prompt":"check.sh runs with no network connection. Which two tool swers template:\n   ```bash\n   cp answers.template.txt answers.txt\n   ```\n   Fill in each field in `answers.txt`:\n   - `q1`: rule id of the staged alert\n   - `q2`: event id of the FIRST cited evidence event\n   - `q3`: the defanged form of the C2 domain the alert names\n   - `q4`: the workspace path this lab staged into\n\n5. **Check your work**:\n   ```bash\n   lab check soc L0.2\n   ```\n","quiz":[{"id":1,"type":"choice","prompt":"A raw evidence file in your workspace contains 203.0.113.66. Per the pack contract, you should:","options":{"a":"Defang it in the raw evidence file","b":"Leave the file raw; defang only in your own prose, notes, and answers.txt","c":"Delete the IP from the evidence file","d":"Re-generate the evidence package"},"answer_b64":"Yg=="},{"id":2,"type":"choice","prompt":"Which SIEM alert field lists the raw log event IDs that caused the rule to fire?","options":{"a":"entities","b":"rule.threat.technique","c":"evidence.event_ids","d":"status"},"answer_b64":"Yw=="},{"id":3,"type":"choice","prompt":"In event ID CM-0311-0142, what does the `0311` component encode?","options":{"a":"Sequence number","b":"Month and day (March 11)","c":"Rule identification number","d":"Host subnet octet"},"answer_b64":"Yg=="}],"hints":["Two files hold everything: alert-sample.json (try jq '.rule' and jq '.evidence') and README-evidence.md (defang rule + the sentence about where files/ get copied). q2 wants the FIRST ID in a list.","q1: jq -r '.rule.id'. q2: jq -r '.evidence.event_ids[0]'. q3: the README defang rule brackets the final dot only. q4: the README names the path pattern workspace/soc/<lab-id> — substitute this lab's id, lowercased.","q1: cm-r-0112. q2: cm-0311-0107. q3: c2.stonewick[.]example. q4: workspace/soc/l0.2."],"recap":["Raw evidence is never defanged; everything you write about it always is (hxxp://, evil[.]example).","Alerts cite raw events by CM-<MMDD>-<seq> id in evidence.event_ids — that list is your pivot into the logs.","lab start copies files/ into workspace/soc/<lab-id>; answers.txt in that copy is what check.sh grades."],"recall":null,"ungradable":false,"assertions":[{"fn":"exists","path":"answers.txt","hint":""},{"fn":"exists","path":"events.jsonl","hint":""},{"fn":"exists","path":"alert-sample.json","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q1=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q2=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q3=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q4=","hint":""},{"fn":"contains","path":".answers.norm","arg":"^q1=cm-r-0112$","hint":""},{"fn":"contains","path":".answers.norm","arg":"^q2=cm-0311-0107$","hint":""},{"fn":"contains_fixed","path":".answers.norm","arg":"q3=c2.stonewick[.]example","hint":""},{"fn":"contains","path":".answers.norm","arg":"^q4=workspace/soc/l0.2$","hint":""}],"norms":[{"source":"answers.txt","target":".answers.norm","comment":true,"nows":false,"trim":false,"variant":"standard"}],"graded_files":[{"name":"answers.txt","prefill":"q1=\nq2=\nq3=\nq4=\n","expected":"","template":"answers.template.txt","tool_output":false}],"files":[{"name":"README-evidence.md","size":1803,"kind":"text","text":"# Evidence Pack Documentation\n\n## Pack Layout\nEvery SOC lab stages evidence files and an `answers.template.txt` template under `files/`.\nWhen you run `lab start`, the CLI copies `files/` into `workspace/soc/<lab-id>` — for this lab, the destination directory is `workspace/soc/l0.2`.\n\n## ECS Naming & Schema\nAll JSON log telemetry follows Elastic Common Schema (ECS) field names:\n- `@timestamp`: ISO-8601 UTC timestamp (`2026-03-11T14:07:12Z`)\n- `host.name`: Hostname (`DC01`, `WKS-ACCT-07`)\n- `source.ip`: Originating IP address (`203.0.113.66`)\n- `user.name`: Account username (`m.reyes`, `svc_backup`)\n- `event.code`: Windows Event ID (`4624`, `4625`, `4688`)\n- `event.id`: Unique event identifier (`CM-0311-0107`)\n\n## Event & Alert Naming Conventions\n- Events use format `CM-<MMDD>-<seq>` (e.g. `CM-0311-0107`)\n- SIEM Alerts use format `CM-A-<n>` (e.g. `CM-A-0001`)\n- Detection Rules use format `CM-R-<n>` (e.g. `CM-R-0112`)\n\n## Alert JSON Structure\nSIEM alerts contain rule metadata, entities, and evidence citations:\n```json\n{\n  \"alert\": { \"id\": \"CM-A-0001\" },\n  \"@timestamp\": \"2026-03-11T14:07:55Z\",\n  \"rule\": { \"id\": \"CM-R-0112\", \"name\": \"Multiple failed logons - single source\" },\n  \"entities\": { \"source.ip\": \"203.0.113.66\" },\n  \"evidence\": { \"event_ids\": [\"CM-0311-0107\", \"CM-0311-0111\"] }\n}\n```\nThe `evidence.event_ids` array bridges the high-level alert to the raw events in `events.jsonl`.\n\n## Defang Discipline\n- **Raw evidence files**: NEVER defanged. They reflect realistic network and host telemetry (e.g., `c2.stonewick.example`).\n- **Your prose/notes/answers**: ALWAYS defanged. Bracket the final dot (`evil[.]example`) and prepend `hxxp://` to URLs.\n\n## Answers Convention\nCopy `answers.template.txt` to `answers.txt`.\nWrite one `qN=value` per line using single lowercase tokens.\n"},{"name":"alert-sample.json","size":605,"kind":"text","text":"{\n  \"alert\": {\n    \"id\": \"CM-A-0001\"\n  },\n  \"@timestamp\": \"2026-03-11T14:07:55Z\",\n  \"rule\": {\n    \"id\": \"CM-R-0112\",\n    \"name\": \"Multiple failed logons - single source\",\n    \"version\": 3,\n    \"severity\": \"low\",\n    \"risk_score\": 21,\n    \"threat\": {\n      \"tactic\": \"credential-access\",\n      \"technique\": \"T1110\"\n    }\n  },\n  \"entities\": {\n    \"source\": {\n      \"ip\": \"203.0.113.66\"\n    },\n    \"host\": {\n      \"name\": \"DC01\"\n    }\n  },\n  \"evidence\": {\n    \"event_ids\": [\n      \"CM-0311-0107\",\n      \"CM-0311-0111\"\n    ],\n    \"query\": \"event.code:4625 AND source.ip:203.0.113.66\"\n  },\n  \"status\": \"new\"\n}\n"},{"name":"events.jsonl","size":1184,"kind":"text","text":"{\"@timestamp\": \"2026-03-11T02:00:04Z\", \"event\": {\"code\": \"4624\", \"id\": \"CM-0311-0002\"}, \"host\": {\"name\": \"FS01\"}, \"user\": {\"name\": \"svc_backup\"}, \"source\": {\"ip\": \"10.20.10.9\"}, \"winlog\": {\"channel\": \"Security\", \"logon\": {\"type\": 3}}}\n{\"@timestamp\": \"2026-03-11T12:58:07Z\", \"event\": {\"code\": \"4624\", \"id\": \"CM-0311-0056\"}, \"host\": {\"name\": \"WKS-ACCT-07\"}, \"user\": {\"name\": \"m.reyes\"}, \"source\": {\"ip\": \"10.20.30.107\"}, \"winlog\": {\"channel\": \"Security\", \"logon\": {\"type\": 2}}}\n{\"@timestamp\": \"2026-03-11T13:15:44Z\", \"event\": {\"code\": \"4624\", \"id\": \"CM-0311-0061\"}, \"host\": {\"name\": \"WKS-HD-03\"}, \"user\": {\"name\": \"j.walsh\"}, \"source\": {\"ip\": \"10.20.30.103\"}, \"winlog\": {\"channel\": \"Security\", \"logon\": {\"type\": 2}}}\n{\"@timestamp\": \"2026-03-11T14:07:12Z\", \"event\": {\"code\": \"4625\", \"id\": \"CM-0311-0107\"}, \"host\": {\"name\": \"DC01\"}, \"user\": {\"name\": \"m.reyes\"}, \"source\": {\"ip\": \"203.0.113.66\"}, \"winlog\": {\"channel\": \"Security\", \"logon\": {\"type\": 3}}}\n{\"@timestamp\": \"2026-03-11T14:07:41Z\", \"event\": {\"code\": \"4625\", \"id\": \"CM-0311-0111\"}, \"host\": {\"name\": \"DC01\"}, \"user\": {\"name\": \"d.okafor\"}, \"source\": {\"ip\": \"203.0.113.66\"}, \"winlog\": {\"channel\": \"Security\", \"logon\": {\"type\": 3}}}\n"}]},{"id":"L0.3","dir":"L0.3-phase-gate-verify-the-analyst-toolbelt","phase":"p0","order":[0,3],"meta":{"id":"L0.3","title":"The SOC in one lab - tiers, the alert lifecycle, what Tier 1 owns vs escalates","type":"DECODE","objective":"Split five Coppermine alerts into Tier 1 handles vs Tier 1 escalates using the charter's lifecycle and four escalation triggers","gate":true,"est_minutes":20},"lab_md":"## BRIEF\nThis is the Phase 0 Exit Gate (`gate: true`).\nIn this lab, you apply the Coppermine SOC Standard Operating Procedures (`sop-excerpt.md`) to evaluate five alert cases (`cases.md`) and verify that all five analyst toolbelt utilities respond correctly.\nYou determine whether Tier 1 handles (`h`) or escalates (`e`) each alert case based on the charter's four escalation triggers.\n\n## GUIDED STEPS\n\n1. **Verify analyst toolbelt utilities**:\n   Confirm that all five core analyst tools are installed and operational:\n   ```bash\n   jq --version\n   tshark --version | head -1\n   dig -v 2>&1\n   whois --version\n   rg --version | head -1\n   ```\n\n2. **Review SOP charter & escalation triggers**:\n   Read `sop-excerpt.md` to understand Tier 1 duties, disposition codes (FP, BTP, TP), the four escalation triggers (a-d), and authorized background activity:\n   ```bash\n   cat sop-excerpt.md\n   ```\n\n3. **Evaluate alert cases (`cases.md`)**:\n   Inspect the five alert cases in `cases.md`:\n   ```bash\n   cat cases.md\n   ```\n\n4. **Record disposition decisions**:\n   Copy `answers.template.txt` to `answers.txt`:\n   ```bash\n   cp answers.template.txt answers.txt\n   ```\n   Set each field to `h` (Tier 1 handles) or `e` (Tier 1 escalates):\n   - `q1`: Password spray success + no-MFA sign-in (`e` — confirmed credential compromise)\n   - `q2`: AV quarantined adware download, no execution (`h` — contained, Tier 1 close + education)\n   - `q3`: Reported phish email with no click evidence (`h` — Tier 1 block ticket + IOC note)\n   - `q4`: Unauthorized PsExec + new admin on DC01 (`e` — DC compromise, containment needed)\n   - `q5`: Documented nightly 02:00Z `svc_backup` robocopy job (`h` — BTP, close with tuning note)\n\n5. **Check your work**:\n   ```bash\n   lab check soc L0.3\n   ```\n","quiz":[{"id":1,"type":"choice","prompt":"An alert is closed as Benign True Positive (BTP). What occurred?","options":{"a":"Rule logic misfired on benign background noise","b":"The rule fired accurately on real behavior, but the activity was legitimate and authorized","c":"It was a true positive escalated directly to Tier 2","d":"Required telemetry was missing from the SIEM index"},"answer_b64":"Yg=="},{"id":2,"type":"text","prompt":"In the alert lifecycle (New -> Triage -> Disposition -> Containment), which verdict is the only one that moves an alert forward toward containment? Answer with the 2-letter verdict code.","answer_b64":"dHA=","accept_b64":["dHA=","dHJ1ZSBwb3NpdGl2ZQ=="]},{"id":3,"type":"choice","prompt":"Per sop-excerpt.md, which action is outside Tier 1 authority?","options":{"a":"Closing an alert as False Positive (FP)","b":"Filing a detection tuning request ticket","c":"Attaching evidence event IDs to a ticket","d":"Isolating a compromised workstation host from the network"},"answer_b64":"ZA=="}],"hints":["Score each card against the four 'Escalate when' triggers in sop-excerpt.md; a card that touches zero triggers stays with Tier 1 no matter how scary the rule name sounds.","Exactly two cards escalate: one involves a credential that now works for someone who is not the user, the other needs an action Tier 1 has no authority to take on a domain controller.","q1: e (credential compromise). q2: h (AV contained). q3: h (no click). q4: e (unauthorized PsExec on DC). q5: h (documented backup job)."],"recap":["Tier 1 triages, dispositions, scopes first, and feeds tickets and tuning notes; Tier 2 investigates and responds; Tier 3 hunts and builds detections.","An alert moves new to triage to disposition: close it as FP or BTP, escalate only a TP toward containment.","Escalate on confirmed compromise, more than one host, credential compromise, or any response needing containment authority; everything else Tier 1 handles and documents."],"recall":null,"ungradable":false,"assertions":[{"fn":"cmd_ok","desc":"jq responds","hint":"install jq — see L0.1","cmd":"jq --version"},{"fn":"cmd_ok","desc":"tshark responds","hint":"install tshark — see L0.1","cmd":"tshark --version"},{"fn":"cmd_ok","desc":"dig responds","hint":"install dnsutils — see L0.1","cmd":"dig -v"},{"fn":"cmd_ok","desc":"whois responds","hint":"install whois — see L0.1","cmd":"whois --version"},{"fn":"cmd_ok","desc":"rg responds","hint":"install ripgrep — see L0.1","cmd":"rg --version"},{"fn":"exists","path":"answers.txt","hint":""},{"fn":"exists","path":"cases.md","hint":""},{"fn":"exists","path":"sop-excerpt.md","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q1=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q2=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q3=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q4=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q5=","hint":""},{"fn":"contains","path":".answers.norm","arg":"^q1=e$","hint":""},{"fn":"contains","path":".answers.norm","arg":"^q2=h$","hint":""},{"fn":"contains","path":".answers.norm","arg":"^q3=h$","hint":""},{"fn":"contains","path":".answers.norm","arg":"^q4=e$","hint":""},{"fn":"contains","path":".answers.norm","arg":"^q5=h$","hint":""}],"norms":[{"source":"answers.txt","target":".answers.norm","comment":true,"nows":false,"trim":false,"variant":"standard"}],"graded_files":[{"name":"answers.txt","prefill":"# h = Tier 1 handles, e = Tier 1 escalates\nq1=\nq2=\nq3=\nq4=\nq5=\n","expected":"","template":"answers.template.txt","tool_output":false}],"files":[{"name":"cases.md","size":1845,"kind":"text","text":"# Coppermine SOC Alert Cases\n\n## CASE 1 — alert CM-A-1 — Password spray — OWA/VPN auth failures\nBetween 2026-03-11 14:05Z and 14:25Z, source IP 203.0.113.66 initiated 4625 login failure bursts across 40+ COPPERMINE accounts.\nAt 14:22:31Z, ONE successful 4624 type 3 logon was recorded for account m.reyes on DC01.\nAn accompanying Entra ID sign-in succeeded from the same external IP with no MFA claim present, originating from a geolocation inconsistent with her 13:58Z Duluth VPN session.\n\n## CASE 2 — alert CM-A-2 — AV quarantine — adware\nAt 2026-03-10T16:12Z, Defender on WKS-HD-03 (j.walsh) quarantined commodity adware bundler 'PDFTurbo Setup' immediately upon download.\nEndpoint telemetry shows no process creation (4688), no network connections (Sysmon 3), and no secondary host activity.\n\n## CASE 3 — alert CM-A-3 — User-reported phish\nAt 2026-03-09T13:30Z, d.okafor forwarded a suspicious email from billing@copperm1ne-billing.example (sender IP 198.51.100.71) linking to http://copperm1ne-billing.example/invoice.\nZeek HTTP and DNS logs confirm zero requests originated from 10.20.31.112 (WKS-ENG-12), and no unusual process execution occurred.\n\n## CASE 4 — alert CM-A-4 — Remote admin tool on DC\nAt 2026-03-12T19:41Z, PSEXESVC service was installed on DC01 authenticated as t.aoki.\nNo change control ticket covers this time window (charter lists only CHG-2143 on 2026-03-10 10:00Z).\nAt 19:44Z, Event 4720 recorded new account creation for 'it_svc_tmp', immediately followed by Event 4732 adding it to Domain Administrators.\n\n## CASE 5 — alert CM-A-5 — Mass file copy\nAt 2026-03-12T02:00:14Z, a large SMB file transfer was detected from SRV-BACKUP to FS01.\nProcess telemetry identifies robocopy.exe running under service account svc_backup, exactly matching the charter's documented nightly 02:00Z backup job.\n\n"},{"name":"sop-excerpt.md","size":2319,"kind":"text","text":"# Coppermine Logistics SOC Standard Operating Procedures (SOP Excerpt)\n\n## 1. SOC Tier Responsibilities\n- **Tier 1 (Triage & Incident Intake)**: Responsible for initial alert intake, triage, disposition (FP/BTP vs TP), initial scoping, ticketing, and submitting detection tuning requests.\n- **Tier 2 (Incident Response & Investigation)**: Responsible for deep host/network investigation, threat containment, host isolation, remediation, and active threat eradication.\n- **Tier 3 (Threat Hunting & Detection Engineering)**: Responsible for proactive threat hunting, developing custom detection rules, and analyzing advanced adversary TTPs.\n\n## 2. Alert Triage Lifecycle\nAlerts progress strictly through the following lifecycle stages:\n`New` → `Triage` → `Disposition` → `Containment / Remediation`\n\nPossible Dispositions:\n- **False Positive (FP)**: Rule misfired on benign or unexpected activity.\n- **Benign True Positive (BTP)**: Rule fired accurately on real behavior, but the activity is legitimate and authorized.\n- **True Positive (TP)**: Confirmed security incident requiring escalation or containment.\n\n## 3. Escalation Triggers (Tier 1 → Tier 2)\nTier 1 analysts MUST escalate an alert to Tier 2 if ANY of the following triggers are met:\na. **Confirmed Host or Service Compromise**: Unapproved code execution, backdoor installation, or active C2 beaconing.\nb. **Multi-Host Scope**: Security activity impacting or spreading across more than one endpoint or server.\nc. **Confirmed Credential Compromise**: Successful authentication using compromised or stolen user credentials.\nd. **Containment Authority Needed**: Incident response requires actions outside Tier 1 authority (e.g. host isolation, revoking admin privileges, blocking domain controllers).\n\n## 4. Documented Authorized Activity\nThe following recurring activities are authorized and pre-approved:\n- **Nightly Backup Job**: `SRV-BACKUP` (10.20.10.9) executes a `robocopy.exe` SMB backup to `FS01` (10.20.10.8) daily at 02:00Z under account `svc_backup`.\n- **Scheduled Administrative Maintenance**: Account `t.aoki` is authorized to use administrative tools (e.g. PsExec, RDP) ONLY during approved Change Control windows (e.g., `CHG-2143` on Tuesday 2026-03-10 10:00Z). Any administrative tool usage outside approved CHG tickets is unauthorized.\n"}]},{"id":"L1.1","dir":"L1.1-telemetry-sources-what-gets-logged-where","phase":"p1","order":[1,1],"meta":{"id":"L1.1","title":"Telemetry sources - what gets logged where (network, endpoint, identity)","type":"DECODE","objective":"Match eight observable statements to the one telemetry source (a-f) that records them; internalize network=conversations, endpoint=commands, identity=MFA/app.","gate":false,"est_minutes":15},"lab_md":"## BRIEF\nSOC analysts triage telemetry across three core observability planes: **network** (conversations, DNS queries, packet statistics), **endpoint** (processes, command lines, local/domain logins), and **identity** (cloud app sign-ins, MFA status, SSO).\nIn this lab, you inspect six staged Coppermine telemetry files (`telemetry/a` through `f`) and map eight security observation statements to the exact telemetry source that recorded them.\n\n## GUIDED STEPS\n\n1. **Examine the six telemetry sources in `telemetry/`**:\n   Inspect the headers and fields of each telemetry source:\n   - `telemetry/a-zeek-conn.log` (Network: Zeek TCP/UDP connection summaries, duration, byte counts)\n   - `telemetry/b-zeek-dns.log` (Network: Zeek DNS queries, record types, response IPs)\n   - `telemetry/c-windows-security.json` (Endpoint: Windows Security events 4624/4625 logons on DC01)\n   - `telemetry/d-sysmon.json` (Endpoint: Sysmon Event ID 1 process creation and command lines)\n   - `telemetry/e-auth.log` (Endpoint/Server: Linux SSH authentication log on WEB01)\n   - `telemetry/f-entra-signin.json` (Identity: Entra ID cloud sign-ins, OWA app, MFA results)\n\n2. **Map the eight observation statements**:\n   Match each statement to its single source letter (`a` through `f`):\n   1. The exact command line `whoami /all` was typed on an Accounts Payable workstation.\n   2. A workstation asked DNS for `c2.stonewick[.]example` and got an answer.\n   3. An SSH login to WEB01 failed for an invalid username.\n   4. `m.reyes` signed in to OWA and satisfied an MFA prompt.\n   5. A domain logon to DC01 failed with a bad password.\n   6. A workstation held a ~40-minute encrypted TLS session; only bytes and duration are visible.\n   7. `t.aoki` authenticated to DC01 over the network (logon type 3).\n   8. A user logged in to WEB01 via SSH publickey.\n\n3. **Record your answers**:\n   Copy `answers.template.txt` to `answers.txt`:\n   ```bash\n   cp answers.template.txt answers.txt\n   ```\n   Set each `q1`..`q8` field to its corresponding lowercase source letter (`a`-`f`).\n\n4. **Check your work**:\n   ```bash\n   lab check soc L1.1\n   ```\n","quiz":[{"id":1,"type":"choice","prompt":"A beacon communicates with its C2 server over TLS port 443. Which telemetry source proves the connection occurred but can NEVER display the payload content?","options":{"a":"telemetry/a-zeek-conn.log","b":"telemetry/d-sysmon.json","c":"telemetry/f-entra-signin.json","d":"telemetry/e-auth.log"},"answer_b64":"YQ=="},{"id":2,"type":"choice","prompt":"An attacker executes `powershell.exe -enc ...`. Which telemetry source records the full process command line?","options":{"a":"telemetry/a-zeek-conn.log","b":"telemetry/b-zeek-dns.log","c":"telemetry/c-windows-security.json","d":"telemetry/d-sysmon.json"},"answer_b64":"ZA=="},{"id":3,"type":"choice","prompt":"A password spray targets OWA and one login succeeds. Which telemetry plane confirms whether Multi-Factor Authentication (MFA) was satisfied?","options":{"a":"Network telemetry","b":"Endpoint telemetry","c":"Identity telemetry"},"answer_b64":"Yw=="}],"hints":["Read each file's header first: zeek TSVs name their columns on the #fields line; the JSON sources carry event.code. List what each file CANNOT see before matching anything.","Sort each statement into a plane: mentions a process or command line -> endpoint; a connection, DNS name, or byte count -> network; an app, MFA, or sign-in -> identity. Then pick the letter inside that plane.","Command lines live only in d (sysmon event.code 1); DNS names only in b; MFA/app only in f; Windows 4624/4625 only in c; sshd lines only in e; durations/bytes only in a."],"recap":["Network telemetry (zeek conn/dns) proves a conversation happened — hosts, ports, bytes, names asked — but TLS hides content and it never sees command lines.","Endpoint telemetry (Sysmon, Windows Security) sees inside the host: processes, full command lines, and local or domain logons.","Identity telemetry (Entra sign-ins) is the only plane that records app, MFA result, and source IP for cloud and VPN access."],"recall":[{"id":"R1","prompt":"Ticket: 'mouse movin 10.20.10.5\t53\tudp\tcoppermine.example\tSOA\tNOERROR\tns1.coppermine.example\tCM-0310-0052\n1773133200.333333\tD10003\t10.20.30.107\t53102\t10.20.10.5\t53\tudp\twpad.coppermine.example\tA\tNXDOMAIN\t-\tCM-0310-0053\n1773134500.444444\tD10004\t10.20.31.112\t53103\t10.20.10.5\t53\tudp\tsaas.mail.example\tA\tNOERROR\t192.0.2.60\tCM-0310-0054\n1773148367.555555\tD10005\t10.20.31.112\t53104\t10.20.10.5\t53\tudp\tc2.stonewick.example\tA\tNOERROR\t203.0.113.66\tCM-0310-0057\n1773152000.666666\tD10006\t10.20.30.103\t53105\t10.20.10.5\t53\tudp\tsaas.mail.example\tA\tNOERROR\t192.0.2.60\tCM-0310-0058\n"},{"name":"telemetry/c-windows-security.json","size":644,"kind":"text","text":"{\"event.id\": \"CM-0310-0007\", \"@timestamp\": \"2026-03-10T09:14:11Z\", \"event.code\": \"4625\", \"host.name\": \"DC01\", \"user.name\": \"j.walsh\", \"winlog.logon.type\": 3, \"source.ip\": \"10.20.30.103\", \"event.outcome\": \"failure\"}\n{\"event.id\": \"CM-0310-0008\", \"@timestamp\": \"2026-03-10T09:14:29Z\", \"event.code\": \"4624\", \"host.name\": \"DC01\", \"user.name\": \"j.walsh\", \"winlog.logon.type\": 2, \"source.ip\": \"10.20.30.103\", \"event.outcome\": \"success\"}\n{\"event.id\": \"CM-0310-0019\", \"@timestamp\": \"2026-03-10T10:00:12Z\", \"event.code\": \"4624\", \"host.name\": \"DC01\", \"user.name\": \"t.aoki\", \"winlog.logon.type\": 3, \"source.ip\": \"10.20.30.103\", \"event.outcome\": \"success\"}\n"},{"name":"telemetry/d-sysmon.json","size":807,"kind":"text","text":"{\"event.id\": \"CM-0310-0061\", \"@timestamp\": \"2026-03-10T14:02:55Z\", \"event.code\": \"1\", \"host.name\": \"WKS-ACCT-07\", \"user.name\": \"m.reyes\", \"process.name\": \"cmd.exe\", \"process.command_line\": \"C:\\\\Windows\\\\System32\\\\cmd.exe\", \"process.parent.name\": \"explorer.exe\"}\n{\"event.id\": \"CM-0310-0062\", \"@timestamp\": \"2026-03-10T14:03:08Z\", \"event.code\": \"1\", \"host.name\": \"WKS-ACCT-07\", \"user.name\": \"m.reyes\", \"process.name\": \"whoami.exe\", \"process.command_line\": \"whoami /all\", \"process.parent.name\": \"cmd.exe\"}\n{\"event.id\": \"CM-0310-0063\", \"@timestamp\": \"2026-03-10T14:15:00Z\", \"event.code\": \"1\", \"host.name\": \"WKS-ACCT-07\", \"user.name\": \"m.reyes\", \"process.name\": \"OUTLOOK.EXE\", \"process.command_line\": \"\\\"C:\\\\Program Files\\\\Microsoft Office\\\\root\\\\Office16\\\\OUTLOOK.EXE\\\"\", \"process.parent.name\": \"explorer.exe\"}\n"},{"name":"telemetry/e-auth.log","size":417,"kind":"text","text":"2026-03-10T11:37:02.123456Z WEB01 sshd[12345]: Failed password for invalid user dokafor from 10.20.31.112 port 49822 ssh2 [CM-0310-0022]\n2026-03-10T11:37:41.654321Z WEB01 sshd[12346]: Accepted publickey for d.okafor from 10.20.31.112 port 49824 ssh2: RSA SHA256:abc123xyz [CM-0310-0023]\n2026-03-10T11:37:41.700000Z WEB01 sshd[12346]: pam_unix(sshd:session): session opened for user d.okafor by (uid=0) [CM-0310-0024]\n"},{"name":"telemetry/f-entra-signin.json","size":504,"kind":"text","text":"{\"event.id\": \"CM-0310-0045\", \"@timestamp\": \"2026-03-10T13:05:00Z\", \"user\": \"m.reyes\", \"app\": \"OWA\", \"source_ip\": \"192.0.2.44\", \"result\": \"success\", \"mfa\": \"satisfied\"}\n{\"event.id\": \"CM-0310-0046\", \"@timestamp\": \"2026-03-10T14:10:00Z\", \"user\": \"m.reyes\", \"app\": \"OWA\", \"source_ip\": \"192.0.2.44\", \"result\": \"success\", \"mfa\": \"satisfied\"}\n{\"event.id\": \"CM-0310-0047\", \"@timestamp\": \"2026-03-10T15:07:00Z\", \"user\": \"m.reyes\", \"app\": \"OWA\", \"source_ip\": \"192.0.2.44\", \"result\": \"success\", \"mfa\": \"satisfied\"}\n"}]},{"id":"L1.2","dir":"L1.2-anatomy-of-a-log-timestamps-utc-ecs","phase":"p1","order":[1,2],"meta":{"id":"L1.2","title":"Anatomy of a log - timestamps, UTC discipline, ECS field names","type":"DECODE","objective":"Read one event in three log dialects, convert local syslog time to UTC, and order events by @timestamp using ECS field names.","gate":false,"est_minutes":15},"lab_md":"## BRIEF\nSecurity logs describe the same moment in multiple formats: local wall-clock syslog text, Windows EVTX XML/JSON SystemTime, and normalized Elastic Common Schema (ECS).\nNaively sorting logs by raw text lines or file ingest order causes critical errors. In this lab, you compare five events (`e1` through `e5`) across three formats (`raw-syslog.txt`, `windows-raw.json`, and `ecs.jsonl`), convert Chicago local time (CDT, UTC-05:00) to UTC, and reconstruct the true chronological order.\n\n## GUIDED STEPS\n\n1. **Compare a single event across all three formats**:\n   Search for user `j.walsh` in `raw-syslog.txt`, `windows-raw.json`, and `ecs.jsonl`:\n   ```bash\n   grep j.walsh raw-syslog.txt\n   jq '.[] | select(.Event.EventData.TargetUserName==\"j.walsh\")' windows-raw.json\n   grep j.walsh ecs.jsonl | jq .\n   ```\n   Notice how `raw-syslog.txt` records `09:00:33` (CDT local time with no year or timezone offset), `windows-raw.json` records `2026-03-10T14:00:33.412Z` (true UTC), and `ecs.jsonl` normalizes `@timestamp` to `2026-03-10T14:00:33Z`.\n\n2. **Convert local syslog time to UTC**:\n   The Duluth log collector recorded syslog lines in America/Chicago local time (CDT, UTC offset `-05:00`). To convert local time to UTC, add 5 hours (`+05:00`).\n   For example, line 1 (`Mar 10 08:59:57`) corresponds to `2026-03-10T13:59:57Z`.\n\n3. **Reconstruct true chronological order**:\n   `ecs.jsonl` stores records in file ingest order (`e1`, `e2`, `e3`, `e4`, `e5`).\n   Extract `@timestamp` and `labels.exercise_id` using `jq` and sort by true timestamp:\n   ```bash\n   jq -r '[.labels.exercise_id, .\"@timestamp\"] | @tsv' ecs.jsonl | sort -k2\n   ```\n   Observe how `e2` (`13:59:57Z`) occurred before `e1` (`14:00:33Z`), and `e4` (`14:01:05Z`) occurred before `e3` (`14:01:48Z`).\n\n4. **Record your answers**:\n   Copy `answers.template.txt` to `answers.txt`:\n   ```bash\n   cp answers.template.txt answers.txt\n   ```\n   Fill in each field in `answers.txt`:\n   - `q1`: UTC ISO-8601 timestamp of the `sshd` \"Accepted publickey\" line (`2026-03-10t13:59:57z`)\n   - `q2`: True chronological sequence of exercise labels (`e2,e1,e4,e3,e5`)\n   - `q3`: ECS field name for client/source IP (`source.ip`)\n   - `q4`: ECS field name for Windows event code (`event.code`)\n   - `q5`: UTC offset of the syslog collector (`-05:00`)\n\n5. **Check your work**:\n   ```bash\n   lab check soc L1.2\n   ```\n","quiz":[{"id":1,"type":"choice","prompt":"An ECS log record displays `event.ingested=14:04:00Z` and `@timestamp=14:00:33Z`. When did the authentication attempt actually occur on the host?","options":{"a":"@timestamp (14:00:33Z)","b":"event.ingested (14:04:00Z)","c":"Whichever timestamp is later","d":"The syslog collector local header time"},"answer_b64":"YQ=="},{"id":2,"type":"choice","prompt":"Why are SOC tickets, SIEM indexes, and timeline analysis standardized strictly on UTC?","options":{"a":"A single shared clock orders events from hosts across any timezone without conversion errors","b":"UTC timestamps provide higher sub-millisecond precision","c":"Commercial SIEM license agreements mandate UTC storage","d":"Local wall-clock timestamps are illegal in enterprise environments"},"answer_b64":"YQ=="},{"id":3,"type":"choice","prompt":"Classic syslog text headers (e.g. `Mar 10 08:59:57`) omit which two critical elements required for precise timeline reconstruction?","options":{"a":"Year and timezone offset","b":"Hostname and Process ID","c":"Seconds and milliseconds","d":"Username and source IP"},"answer_b64":"YQ=="}],"hints":["Pick the j.walsh 4625 and find it in all three files (grep j.walsh). Compare its three time strings before ordering anything.","raw-syslog.txt is Duluth local time (CDT, UTC-05:00) with no marker and no year; SystemTime and @timestamp are already UTC. Add 5 hours to every syslog time first.","Only @timestamp orders events: `jq -r '[.labels.exercise_id,.\"@timestamp\"]|@tsv' ecs.jsonl | sort -k2`. File order is ingest order and is wrong for two adjacent pairs."],"recap":["One instant has many spellings: local syslog text, Windows SystemTime, and ECS @timestamp can all describe the same moment.","Convert everything to UTC before comparing; classic syslog has no year and no timezone, and file order only shows arrival, never occurrence.","Core ECS names: @timestamp for when it happened, source.ip for the client, user.name for the account, event.code for the Windows event number."],"recall":null,"ungradable":false,"assertions":[{"fn":"exists","path":"answers.txt","hint":""},{"fn":"exists","path":"ecs.jsonl","hint":""},{"fn":"exists","path":"raw-syslog.txt","hint":""},{"fn":"exists","path":"windows-raw.json","hint":""},{"fn":"exists","path":"events-map.csv","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q1=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q2=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q3=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q4=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q5=","hint":""},{"fn":"contains","path":".answers.norm","arg":"^q1=2026-03-10t13:59:57z$","hint":""},{"fn":"contains","path":".answers.norm","arg":"^q2=e2,e1,e4,e3,e5$","hint":""},{"fn":"contains_fixed","path":".answers.norm","arg":"q3=source.ip","hint":""},{"fn":"contains_fixed","path":".answers.norm","arg":"q4=event.code","hint":""},{"fn":"contains","path":".answers.norm","arg":"^q5=-05:00$","hint":""}],"norms":[{"source":"answers.txt","target":".answers.norm","comment":true,"nows":false,"trim":false,"variant":"standard"}],"graded_files":[{"name":"answers.txt","prefill":"# UTC instant of the sshd \"Accepted publickey\" line, ISO-8601 lowercase, e.g. 2026-03-09t00:00:00z\nq1=\n\n# true chronological order of e1..e5, comma-joined, no spaces (e.g. e1,e2,e3,e4,e5)\nq2=\n\n# ECS field name carrying the client/source IP\nq3=\n\n# ECS field name carrying the Windows event number\nq4=\n\n# UTC offset of the syslog collector during the scenario week, +/-HH:MM (e.g. -05:00)\nq5=\n","expected":"","template":"answers.template.txt","tool_output":false}],"files":[{"name":"ecs.jsonl","size":1896,"kind":"text","text":"{\"labels\": {\"exercise_id\": \"e1\"}, \"@timestamp\": \"2026-03-10T14:00:33Z\", \"event.ingested\": \"2026-03-10T14:00:34Z\", \"event.id\": \"CM-0310-0211\", \"event.code\": \"4625\", \"event.category\": [\"authentication\"], \"event.outcome\": \"failure\", \"source.ip\": \"203.0.113.66\", \"user.name\": \"j.walsh\", \"host.name\": \"dc01\", \"message\": \"An account failed to log on. Account Name: j.walsh Source Network Address: 203.0.113.66\"}\n{\"labels\": {\"exercise_id\": \"e2\"}, \"@timestamp\": \"2026-03-10T13:59:57Z\", \"event.ingested\": \"2026-03-10T14:01:30Z\", \"event.id\": \"CM-0310-0210\", \"event.category\": [\"authentication\"], \"event.outcome\": \"success\", \"source.ip\": \"192.0.2.45\", \"user.name\": \"t.aoki\", \"host.name\": \"web01\", \"message\": \"Accepted publickey for t.aoki from 192.0.2.45 port 60312 ssh2\"}\n{\"labels\": {\"exercise_id\": \"e3\"}, \"@timestamp\": \"2026-03-10T14:01:48Z\", \"event.ingested\": \"2026-03-10T14:01:49Z\", \"event.id\": \"CM-0310-0213\", \"event.code\": \"4625\", \"event.category\": [\"authentication\"], \"event.outcome\": \"failure\", \"source.ip\": \"203.0.113.66\", \"user.name\": \"m.reyes\", \"host.name\": \"dc01\", \"message\": \"An account failed to log on. Account Name: m.reyes Source Network Address: 203.0.113.66\"}\n{\"labels\": {\"exercise_id\": \"e4\"}, \"@timestamp\": \"2026-03-10T14:01:05Z\", \"event.ingested\": \"2026-03-10T14:03:05Z\", \"event.id\": \"CM-0310-0212\", \"event.code\": \"256\", \"event.category\": [\"network\"], \"event.outcome\": \"success\", \"source.ip\": \"10.20.31.112\", \"user.name\": \"svc-none\", \"host.name\": \"dc01\", \"message\": \"DNS Server query fs01.coppermine.example type A from 10.20.31.112\"}\n{\"labels\": {\"exercise_id\": \"e5\"}, \"@timestamp\": \"2026-03-10T14:03:10Z\", \"event.ingested\": \"2026-03-10T14:04:40Z\", \"event.id\": \"CM-0310-0214\", \"event.category\": [\"authentication\"], \"event.outcome\": \"failure\", \"source.ip\": \"192.0.2.150\", \"user.name\": \"root\", \"host.name\": \"web01\", \"message\": \"Failed password for root from 192.0.2.150 port 44872 ssh2\"}\n"},{"name":"events-map.csv","size":465,"kind":"text","text":"label,event_id,summary\ne1,CM-0310-0211,An account failed to log on. Account Name: j.walsh Source Network Address: 203.0.113.66\ne2,CM-0310-0210,Accepted publickey for t.aoki from 192.0.2.45 port 60312 ssh2\ne3,CM-0310-0213,An account failed to log on. Account Name: m.reyes Source Network Address: 203.0.113.66\ne4,CM-0310-0212,DNS Server query fs01.coppermine.example type A from 10.20.31.112\ne5,CM-0310-0214,Failed password for root from 192.0.2.150 port 44872 ssh2\n"},{"name":"raw-syslog.txt","size":921,"kind":"text","text":"Mar 10 08:59:57 web01 sshd[2214]: Accepted publickey for t.aoki from 192.0.2.45 port 60312 ssh2\nMar 10 09:00:33 dc01 MSWinEventLog 4625 Security 1001 Tue Mar 10 09:00:33 2026 4625 Microsoft-Windows-Security-Auditing N/A N/A Success Audit DC01.coppermine.example An account failed to log on. Account Name: j.walsh Source Network Address: 203.0.113.66\nMar 10 09:01:05 dc01 MSWinEventLog 256 DNS Server 2002 Tue Mar 10 09:01:05 2026 256 Microsoft-Windows-DNS-Server N/A N/A Success Audit DC01.coppermine.example DNS Server query fs01.coppermine.example type A from 10.20.31.112\nMar 10 09:01:48 dc01 MSWinEventLog 4625 Security 1003 Tue Mar 10 09:01:48 2026 4625 Microsoft-Windows-Security-Auditing N/A N/A Success Audit DC01.coppermine.example An account failed to log on. Account Name: m.reyes Source Network Address: 203.0.113.66\nMar 10 09:03:10 web01 sshd[2231]: Failed password for root from 192.0.2.150 port 44872 ssh2\n"},{"name":"windows-raw.json","size":1390,"kind":"text","text":"[\n  {\n    \"Event\": {\n      \"System\": {\n        \"Provider\": {\n          \"Name\": \"Microsoft-Windows-Security-Auditing\"\n        },\n        \"EventID\": 4625,\n        \"EventRecordID\": 1001,\n        \"Computer\": \"DC01.coppermine.example\",\n        \"TimeCreated\": {\n          \"SystemTime\": \"2026-03-10T14:00:33.412Z\"\n        }\n      },\n      \"EventData\": {\n        \"TargetUserName\": \"j.walsh\",\n        \"IpAddress\": \"203.0.113.66\",\n        \"LogonType\": 3\n      }\n    }\n  },\n  {\n    \"Event\": {\n      \"System\": {\n        \"Provider\": {\n          \"Name\": \"Microsoft-Windows-DNS-Server\"\n        },\n        \"EventID\": 256,\n        \"EventRecordID\": 2002,\n        \"Computer\": \"DC01.coppermine.example\",\n        \"TimeCreated\": {\n          \"SystemTime\": \"2026-03-10T14:01:05.118Z\"\n        }\n      },\n      \"EventData\": {\n        \"QueryName\": \"fs01.coppermine.example\",\n        \"ClientIP\": \"10.20.31.112\",\n        \"QueryType\": \"A\"\n      }\n    }\n  },\n  {\n    \"Event\": {\n      \"System\": {\n        \"Provider\": {\n          \"Name\": \"Microsoft-Windows-Security-Auditing\"\n        },\n        \"EventID\": 4625,\n        \"EventRecordID\": 1003,\n        \"Computer\": \"DC01.coppermine.example\",\n        \"TimeCreated\": {\n          \"SystemTime\": \"2026-03-10T14:01:48.892Z\"\n        }\n      },\n      \"EventData\": {\n        \"TargetUserName\": \"m.reyes\",\n        \"IpAddress\": \"203.0.113.66\",\n        \"LogonType\": 3\n      }\n    }\n  }\n]\n"}]},{"id":"L1.3","dir":"L1.3-anatomy-of-an-alert-rule-metadata-severity","phase":"p1","order":[1,3],"meta":{"id":"L1.3","title":"Anatomy of an alert - rule metadata, severity, and the evidence behind it","type":"DECODE","objective":"Read a SIEM alert as a structured claim: rule metadata, static severity vs dynamic risk_score, and the exact events cited as evidence.","gate":false,"est_minutes":15},"lab_md":"## BRIEF\nA SIEM alert is a structured claim about underlying evidence.\nRule metadata (`rule.id`, `rule.severity`) specifies the detection logic pattern, while `evidence.event_ids` cites the specific raw log events that triggered the rule.\n`rule.severity` and `rule.risk_score` live next to each other but aren't the same kind of field: `severity` is fixed by whoever authored the rule and only changes if the rule definition is edited, while `risk_score` is computed per-alert from that instance's own signal (here, how many accounts `user.names_total` the spray touched) — so it moves alert-to-alert even when the rule and its severity never change.\nHowever, detection rules are narrow: an alert cites only the events that matched its trigger condition, not the complete incident. In this lab, you inspect SIEM alert `alert-CM-A-1024.json`, examine its cited evidence events, and pivot into `events/raw.jsonl` to discover critical uncited context.\n\n## GUIDED STEPS\n\n1. **Inspect the SIEM alert (`alert-CM-A-1024.json`)**:\n   Examine the alert's rule metadata, severity, risk score, and evidence citations using `jq`:\n   ```bash\n   jq . alert-CM-A-1024.json\n   jq -r '.rule.id' alert-CM-A-1024.json\n   jq -r '.evidence.event_ids[]' alert-CM-A-1024.json\n   ```\n\n2. **Examine the cited evidence events in `events/raw.jsonl`**:\n   Filter `events/raw.jsonl` for the three event IDs cited in `evidence.event_ids`:\n   ```bash\n   grep -E 'CM-0311-0107|CM-0311-0121|CM-0311-0135' events/raw.jsonl | jq -c '{id: .[\"event.id\"], code: .[\"event.code\"], user: .[\"user.name\"], ip: .[\"source.ip\"]}'\n   ```\n   Notice that while the username (`user.name`) varies across each cited failed logon event, the originating IP address (`source.ip`) remains constant (`203.0.113.66`, DEFANGED: `203.0.113[.]66`).\n\n3. **Pivot into `events/raw.jsonl` to find uncited activity**:\n   Search `events/raw.jsonl` for any successful logon events (Event ID `4624`):\n   ```bash\n   grep '\"event.code\": \"4624\"' events/raw.jsonl | jq .\n   ```\n   Notice event `CM-0311-0142`: a successful network logon (`4624` type 3) for `m.reyes` from `203.0.113.66` at 14:22:31Z.\n   The password spray detection rule only monitored `4625` failures, leaving this successful authentication uncited — transforming the triage story from \"attempted spray\" to \"compromised credential\"!\n\n4. **Record your answers**:\n   Copy `answers.template.txt` to `answers.txt`:\n   ```bash\n   cp answers.template.txt answers.txt\n   ```\n   Fill in each field in `answers.txt`:\n   - `q1`: Rule ID of the alert (`cm-r-0117`)\n   - `q2`: Dotted JSON path of the static rule severity field (`rule.severity`)\n   - `q3`: The 3 cited event IDs in array order (`cm-0311-0107,cm-0311-0121,cm-0311-0135`)\n   - `q4`: Originating IP entity value unchanged across cited events, DEFANGED (`203.0.113[.]66`)\n   - `q5`: Event ID of the uncited logon success (`cm-0311-0142`)\n\n5. **Check your work**:\n   ```bash\n   lab check soc L1.3\n   ```\n","quiz":[{"id":1,"type":"choice","prompt":"CM-A-1024 displays `rule.severity` 'high' and `risk_score` 73. If the same rule fires tomorrow on 6 accounts instead of 42, which metric changes?","options":{"a":"rule.severity","b":"risk_score","c":"Both rule.severity and risk_score","d":"Neither metric changes"},"answer_b64":"Yg=="},{"id":2,"type":"choice","prompt":"What does the `evidence.event_ids` array in a SIEM alert guarantee?","options":{"a":"Every log event associated with the entire security incident","b":"Exactly the raw log events that satisfied the detection rule trigger logic","c":"All log events emitted from the source IP during that calendar day","d":"Events that have already been reviewed by a Tier 2 analyst"},"answer_b64":"Yg=="},{"id":3,"type":"choice","prompt":"`events/raw.jsonl` contains a 4624 logon success (`CM-0311-0142`) that `alert-CM-A-1024.json` never cited. Why is this critical for triage?","options":{"a":"It is not critical because the detection rule only queries 4625 failures","b":"It proves the password spray alert was a false positive","c":"The cited evidence was incomplete — the uncited success escalates the incident from an attempted spray to a confirmed credential compromise","d":"It indicates the SIEM agent dropped event records"},"answer_b64":"Yw=="}],"hints":["Start with `jq . alert-CM-A-1024.json`. q1-q4 are answered entirely inside the alert; only q5 needs events/raw.jsonl.","q3: `jq -r '.evidence.event_ids[]' alert-CM-A-1024.json`. q4: grep each cited id in events/raw.jsonl and compare fields — user.name changes every time, one value never does. q5: which event.code means a logon SUCCEEDED?","q5: `grep '4624' events/raw.jsonl` returns exactly one line; its event.id, lowercased, is the answer. Confirm it is NOT in evidence.event_ids — the rule only matched 4625 failures."],"recap":["An alert is a claim: rule metadata says what pattern fired, and evidence.event_ids says exactly which events made it fire.","rule.severity is static and set by the rule author; risk_score is computed per alert — never confuse the two when working a queue.","Cited evidence can be incomplete — CM-A-1024 cites three failures but not the one success, and the success is what makes it urgent."],"recall":null,"ungradable":false,"assertions":[{"fn":"exists","path":"answers.txt","hint":""},{"fn":"exists","path":"alert-CM-A-1024.json","hint":""},{"fn":"exists","path":"events/raw.jsonl","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q1=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q2=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q3=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q4=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q5=","hint":""},{"fn":"contains","path":".answers.norm","arg":"^q1=cm-r-0117$","hint":""},{"fn":"contains_fixed","path":".answers.norm","arg":"q2=rule.severity","hint":""},{"fn":"contains","path":".answers.norm","arg":"^q3=cm-0311-0107,cm-0311-0121,cm-0311-0135$","hint":""},{"fn":"contains_fixed","path":".answers.norm","arg":"q4=203.0.113[.]66","hint":""},{"fn":"contains","path":".answers.norm","arg":"^q5=cm-0311-0142$","hint":""}],"norms":[{"source":"answers.txt","target":".answers.norm","comment":true,"nows":false,"trim":false,"variant":"standard"}],"graded_files":[{"name":"answers.txt","prefill":"# rule id, lowercase (e.g. cm-r-0100)\nq1=\n\n# dotted JSON path of the STATIC rule-assigned severity field (e.g. rule.severity)\nq2=\n\n# 3 cited event ids, lowercase, comma-joined, no spaces, in evidence.event_ids array order\nq3=\n\n# the one entity value unchanged across all 3 cited events (an IPv4 address)\n# - DEFANGED (e.g. 198.51.100[.]23)\nq4=\n\n# event.id of the auth SUCCESS the alert did NOT cite (e.g. cm-0311-0000)\nq5=\n","expected":"","template":"answers.template.txt","tool_output":false}],"files":[{"name":"alert-CM-A-1024.json","size":890,"kind":"text","text":"{\n  \"alert\": {\n    \"id\": \"CM-A-1024\"\n  },\n  \"@timestamp\": \"2026-03-11T14:26:04Z\",\n  \"status\": \"new\",\n  \"rule\": {\n    \"id\": \"CM-R-0117\",\n    \"name\": \"Password Spray - Many Accounts, One Source\",\n    \"version\": 3,\n    \"severity\": \"high\",\n    \"risk_score\": 73,\n    \"threat\": {\n      \"tactic\": {\n        \"id\": \"TA0006\",\n        \"name\": \"credential-access\"\n      },\n      \"technique\": {\n        \"id\": \"T1110.003\",\n        \"name\": \"Password Spraying\"\n      }\n    }\n  },\n  \"entities\": {\n    \"source.ip\": \"203.0.113.66\",\n    \"user.names_sampled\": [\n      \"a.brandt\",\n      \"d.okafor\",\n      \"p.silva\"\n    ],\n    \"user.names_total\": 42,\n    \"host.name\": \"DC01\"\n  },\n  \"evidence\": {\n    \"event_ids\": [\n      \"CM-0311-0107\",\n      \"CM-0311-0121\",\n      \"CM-0311-0135\"\n    ],\n    \"query\": \"event.code:4625 AND source.ip:203.0.113.66 AND @timestamp:[2026-03-11T14:05:00Z TO 2026-03-11T14:25:00Z]\"\n  }\n}\n"},{"name":"events/raw.jsonl","size":3227,"kind":"text","text":"{\"event.id\": \"CM-0311-0101\", \"@timestamp\": \"2026-03-11T14:05:12Z\", \"event.code\": \"4625\", \"event.outcome\": \"failure\", \"host.name\": \"DC01\", \"user.name\": \"a.
