0.113.66\", \"winlog.logon.type\": 3}\n{\"event.id\": \"CM-0311-0132\", \"@timestamp\": \"2026-03-11T14:17:45Z\", \"event.code\": \"4625\", \"event.outcome\": \"failure\", \"host.name\": \"DC01\", \"user.name\": \"i.novak\", \"source.ip\": \"203.0.113.66\", \"winlog.logon.type\": 3}\n{\"event.id\": \"CM-0311-0135\", \"@timestamp\": \"2026-03-11T14:19:10Z\", \"event.code\": \"4625\", \"event.outcome\": \"failure\", \"host.name\": \"DC01\", \"user.name\": \"p.silva\", \"source.ip\": \"203.0.113.66\", \"winlog.logon.type\": 3}\n{\"event.id\": \"CM-0311-0138\", \"@timestamp\": \"2026-03-11T14:20:30Z\", \"event.code\": \"4625\", \"event.outcome\": \"failure\", \"host.name\": \"DC01\", \"user.name\": \"k.kim\", \"source.ip\": \"203.0.113.66\", \"winlog.logon.type\": 3}\n{\"event.id\": \"CM-0311-0139\", \"@timestamp\": \"2026-03-11T14:21:58Z\", \"event.code\": \"4625\", \"event.outcome\": \"failure\", \"host.name\": \"DC01\", \"user.name\": \"l.wright\", \"source.ip\": \"203.0.113.66\", \"winlog.logon.type\": 3}\n{\"event.id\": \"CM-0311-0142\", \"@timestamp\": \"2026-03-11T14:22:31Z\", \"event.code\": \"4624\", \"event.outcome\": \"success\", \"host.name\": \"DC01\", \"user.name\": \"m.reyes\", \"source.ip\": \"203.0.113.66\", \"winlog.logon.type\": 3}\n{\"event.id\": \"CM-0311-0145\", \"@timestamp\": \"2026-03-11T14:24:00Z\", \"event.code\": \"4625\", \"event.outcome\": \"failure\", \"host.name\": \"DC01\", \"user.name\": \"n.foster\", \"source.ip\": \"203.0.113.66\", \"winlog.logon.type\": 3}\n"}]},{"id":"L1.4","dir":"L1.4-reading-a-sigma-rule-logsource-detection-condition","phase":"p1","order":[1,4],"meta":{"id":"L1.4","title":"Reading a Sigma rule - logsource, detection block, condition","type":"DECODE","objective":"Read a Sigma rule as its consumer: logsource scoping, named detection blocks, and the condition line — and predict exactly which events it fires on.","gate":false,"est_minutes":15},"lab_md":"## BRIEF\nSigma rules define vendor-neutral detection logic using three core sections:\n1. `logsource`: Scopes which telemetry category and product the rule evaluates against.\n2. `detection`: Defines named pattern blocks testing specific field values.\n3. `condition`: Boolean logic combining the named pattern blocks to trigger an alert.\n\nIn this lab, you read `rule-encoded-powershell.yml` and evaluate it against four candidate events in `candidates.jsonl` to predict which events fire and why filters suppress benign matches.\n\n## GUIDED STEPS\n\n1. **Read `rule-encoded-powershell.yml`**:\n   Examine the rule's `logsource`, `detection` blocks, and `condition` line:\n   ```bash\n   cat rule-encoded-powershell.yml\n   ```\n   Notice:\n   - `logsource`: `product: windows`, `category: process_creation` (Sysmon Event ID 1 / Windows Security 4688).\n   - `selection_img`: `Image|endswith: '\\powershell.exe'` (ECS field: `process.executable`).\n   - `selection_cli`: `CommandLine|contains: '-enc'` (ECS field: `process.command_line`).\n   - `filter_backup`: `ParentImage|endswith: '\\veeam.backup.svc.exe'` (ECS field: `process.parent.executable`).\n   - `condition`: `selection_img and selection_cli and not filter_backup`.\n\n2. **Evaluate `candidates.jsonl` events**:\n   Inspect the candidate events:\n   ```bash\n   jq -c '{id: .[\"event.id\"], dataset: .[\"event.dataset\"], parent: .[\"process.parent.executable\"], exe: .[\"process.executable\"], cli: .[\"process.command_line\"]}' candidates.jsonl\n   ```\n   - Event `CM-0311-0201` (`q1`): `powershell.exe` spawned from `WINWORD.EXE` with `-enc` → `y` (matches `selection_img` and `selection_cli`, not suppressed by `filter_backup`).\n   - Event `CM-0311-0021` (`q2`): `powershell.exe` spawned from `veeam.backup.svc.exe` with `-enc` → `n` (suppressed by `filter_backup`).\n   - Event `CM-0312-0233` (`q3`): Zeek DNS query (`event.dataset: \"zeek.dns\"`) → `n` (`logsource` mismatch: not process creation).\n   - Event `CM-0312-0301` (`q4`): `pwsh.exe` (PowerShell 7) spawned from `explorer.exe` with `-enc` → `n` (`Image|endswith` specifies `\\powershell.exe`, missing `pwsh.exe`).\n\n3. **Record your answers**:\n   Copy `answers.template.txt` to `answers.txt`:\n   ```bash\n   cp answers.template.txt answers.txt\n   ```\n   Fill in each field in `answers.txt`:\n   - `q1`: Does `CM-0311-0201` fire? (`y`)\n   - `q2`: Does `CM-0311-0021` fire? (`n`)\n   - `q3`: Does `CM-0312-0233` fire? (`n`)\n   - `q4`: Does `CM-0312-0301` fire? (`n`)\n   - `q5`: Filter key name excluding `CM-0311-0021` (`filter_backup`)\n   - `q6`: Executable basename needed for `CM-0312-0301` to match (`pwsh.exe`)\n\n4. **Check your work**:\n   ```bash\n   lab check soc L1.4\n   ```\n","quiz":[{"id":1,"type":"choice","prompt":"In `condition: selection_img and selection_cli and not filter_backup`, if an event matches ALL THREE named blocks, what occurs?","options":{"a":"The rule fires an alert","b":"The rule does NOT fire because `not filter_backup` evaluates to false","c":"The rule fires at a reduced severity level","d":"The rule fires only if status is stable"},"answer_b64":"Yg=="},{"id":2,"type":"choice","prompt":"What is the primary function of the `logsource` block in a Sigma rule?","options":{"a":"It is documentation only","b":"It scopes which telemetry event stream the field logic is evaluated against — events from unmatched streams are never tested","c":"It sets the alert severity level","d":"It declares the MITRE ATT&CK technique"},"answer_b64":"Yg=="},{"id":3,"type":"choice","prompt":"An alert generated by this rule arrives with `level: high`. What does this indicate?","options":{"a":"The alert is a confirmed true positive incident","b":"It is the rule author's severity estimate for the behavior — triage verdict is still required","c":"The SIEM automatically escalates the alert to Tier 2","d":"The telemetry source has 100% fidelity"},"answer_b64":"Yg=="}],"hints":["Read the rule top-down: logsource first (which stream is this rule even allowed to see?), then each named detection block, then the one condition line that combines them. One candidate event is not even from the right stream.","Map fields before matching: Image=process.executable, CommandLine=process.command_line, ParentImage=process.parent.executable. The condition needs BOTH selections true AND the filter false — check q2's parent path and q4's executable basename character by character.","Only the WINWORD->powershell event fires (q1=y, rest n). q2's event matches both selections but its parent ends in \\veeam.backup.svc.exe, so the named key filter_backup suppresses it (q5). q4's binary ends in pwsh.exe, which '\\powershell.exe' can never match — that basename is q6."],"recap":["A Sigma rule reads top-down: logsource scopes the stream, named detection blocks test fields, and one condition line combines them — an event from the wrong stream never reaches the field tests.","`and not <filter>` is how detection engineers carve out known-good; an event a filter suppresses was seen and excused, which is the seed of the BTP verdict.","`level:` is the author's severity estimate, never a verdict, and brittle selectors (powershell.exe but not pwsh.exe) are exactly why rules get tuned."],"recall":null,"ungradable":false,"assertions":[{"fn":"exists","path":"answers.txt","hint":""},{"fn":"exists","path":"rule-encoded-powershell.yml","hint":""},{"fn":"exists","path":"candidates.jsonl","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q1=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q2=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q3=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q4=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q5=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q6=","hint":""},{"fn":"contains","path":".answers.norm","arg":"^q1=y$","hint":""},{"fn":"contains","path":".answers.norm","arg":"^q2=n$","hint":""},{"fn":"contains","path":".answers.norm","arg":"^q3=n$","hint":""},{"fn":"contains","path":".answers.norm","arg":"^q4=n$","hint":""},{"fn":"contains","path":".answers.norm","arg":"^q5=filter_backup$","hint":""},{"fn":"contains_fixed","path":".answers.norm","arg":"q6=pwsh.exe","hint":""}],"norms":[{"source":"answers.txt","target":".answers.norm","comment":true,"nows":false,"trim":false,"variant":"standard"}],"graded_files":[{"name":"answers.txt","prefill":"# Evaluate the rule against candidate events in candidates.jsonl\n# q1-q4: does the rule fire on this event? y or n\n# q1=CM-0311-0201\nq1=\n\n# q2=CM-0311-0021\nq2=\n\n# q3=CM-0312-0233\nq3=\n\n# q4=CM-0312-0301\nq4=\n\n# exact detection-map key name that excluded q2's event\nq5=\n\n# executable basename selection_img would need added for q4's event to match (e.g. cmd.exe)\nq6=\n","expected":"","template":"answers.template.txt","tool_output":false}],"files":[{"name":"candidates.jsonl","size":1506,"kind":"text","text":"{\"event.id\": \"CM-0311-0021\", \"@timestamp\": \"2026-03-11T02:00:41Z\", \"event.dataset\": \"sysmon\", \"event.code\": \"1\", \"host.name\": \"SRV-BACKUP\", \"user.name\": \"svc_backup\", \"process.parent.executable\": \"C:\\\\Program Files\\\\Veeam\\\\Backup\\\\veeam.backup.svc.exe\", \"process.executable\": \"C:\\\\Windows\\\\System32\\\\WindowsPowerShell\\\\v1.0\\\\powershell.exe\", \"process.command_line\": \"powershell.exe -enc JgBDADoAXABTY3JpcHRzAFwAYmFja3VwLXZlcmlmeS4AcHMx\"}\n{\"event.id\": \"CM-0311-0201\", \"@timestamp\": \"2026-03-11T15:41:07Z\", \"event.dataset\": \"sysmon\", \"event.code\": \"1\", \"host.name\": \"WKS-ACCT-07\", \"user.name\": \"m.reyes\", \"process.parent.executable\": \"C:\\\\Program Files\\\\Microsoft Office\\\\root\\\\Office16\\\\WINWORD.EXE\", \"process.executable\": \"C:\\\\Windows\\\\System32\\\\WindowsPowerShell\\\\v1.0\\\\powershell.exe\", \"process.command_line\": \"powershell.exe -nop -w hidden -enc IABFAHgAcABvAHIAdAAtAEkAdABlAG0A\"}\n{\"event.id\": \"CM-0312-0233\", \"@timestamp\": \"2026-03-12T09:03:12Z\", \"event.dataset\": \"zeek.dns\", \"source.ip\": \"10.20.31.112\", \"dns.question.name\": \"a1b2c3d4e5f6.tun.stonewick.example\", \"dns.question.type\": \"TXT\", \"dns.rcode\": \"NXDOMAIN\"}\n{\"event.id\": \"CM-0312-0301\", \"@timestamp\": \"2026-03-12T13:15:02Z\", \"event.dataset\": \"sysmon\", \"event.code\": \"1\", \"host.name\": \"WKS-ENG-12\", \"user.name\": \"d.okafor\", \"process.parent.executable\": \"C:\\\\Windows\\\\explorer.exe\", \"process.executable\": \"C:\\\\Program Files\\\\PowerShell\\\\7\\\\pwsh.exe\", \"process.command_line\": \"pwsh.exe -nop -enc RwBlAHQALQBDAGgAaQBsAGQASQB0AGUAbQAgAGUAbgB2ADoA\"}\n"},{"name":"rule-encoded-powershell.yml","size":734,"kind":"text","text":"title: Suspicious Encoded PowerShell Command Line\nid: 6f9d3a2e-4b1c-4c8e-9a7d-2f0e5b8c1d43\nstatus: test\ndescription: Detects powershell.exe launched with an encoded command, excluding the Veeam backup service parent.\nauthor: Coppermine Detection Engineering\ndate: '2026-02-20'\nlogsource:\n  product: windows\n  category: process_creation\ndetection:\n  selection_img:\n    Image|endswith: '\\powershell.exe'\n  selection_cli:\n    CommandLine|contains: '-enc'\n  filter_backup:\n    ParentImage|endswith: '\\veeam.backup.svc.exe'\n  condition: selection_img and selection_cli and not filter_backup\nfalsepositives:\n  - Admin scripts passing encoded commands\n  - Backup software wrappers\nlevel: high\ntags:\n  - attack.execution\n  - attack.t1059.001\n"}]},{"id":"L1.5","dir":"L1.5-mitre-att-ck-tactics-vs-techniques","phase":"p1","order":[1,5],"meta":{"id":"L1.5","title":"MITRE ATT&CK - tactics vs techniques; mapping an alert to a technique ID","type":"TOUR","objective":"Tell tactics from techniques from sub-techniques and map three Coppermine alerts to ATT&CK technique ids","gate":false,"est_minutes":15},"lab_md":"## BRIEF\nThe MITRE ATT&CK framework provides a standardized language for describing adversary behavior.\n- **Tactics** (the adversary's *why*): High-level goals represented by matrix columns (e.g. Credential Access `TA0006`, Execution `TA0002`).\n- **Techniques** (the *how*): Specific methods used to achieve a tactic goal (e.g. Brute Force `T1110`).\n- **Sub-techniques** (the *specific how*): Precise implementations of a technique (e.g. Password Spraying `T1110.003`).\n\nMapping security alerts to specific ATT&CK technique IDs allows SOC teams to categorize threats based on behavior rather than perishable tool names. In this lab, you explore the ATT&CK Matrix and map three Coppermine SIEM alerts (`CM-A-31`, `CM-A-32`, `CM-A-33`) to their exact ATT&CK technique IDs using `attack-excerpt.json`.\n\n## GUIDED STEPS\n\n1. **Explore the MITRE ATT&CK Framework**:\n   - Open [MITRE ATT&CK Enterprise Matrix](https://attack.mitre.org).\n   - Observe the column headers representing **Tactics** (e.g., Credential Access, Execution, Command and Control).\n   - Locate the **Credential Access** column and click **Brute Force (T1110)** to view its four sub-techniques (T1110.001 - T1110.004).\n   - Open **Password Spraying (T1110.003)** and review the analyst-focused sections: *Procedure Examples*, *Data Sources*, and *Detection*.\n\n2. **Explore ATT&CK Navigator & Layers**:\n   - Open [ATT&CK Navigator](https://mitre-attack.github.io/attack-navigator/).\n   - Click **Create New Layer** → **Enterprise ATT&CK**.\n   - Use the search magnifier tool to search for \"password spraying\", select the technique, and assign a score of `1`.\n   - Observe how the technique cell is highlighted under Credential Access.\n   - Staged file `layer-sample.json` provides an example of an exported ATT&CK Navigator JSON layer.\n\n3. **Inspect staged alerts and ATT&CK reference**:\n   View the 3 staged alerts in `alerts.jsonl` and the mini ATT&CK reference table in `attack-excerpt.json`:\n   ```bash\n   jq . alerts.jsonl\n   jq . attack-excerpt.json\n   ```\n\n4. **Map alerts to ATT&CK Technique IDs**:\n   Match each alert to its most specific ATT&CK technique ID:\n   - `CM-A-31` (`q1`): Password failures across 40+ accounts from a single source → `t1110.003` (Password Spraying)\n   - `CM-A-32` (`q2`): Office app (WINWORD) spawned hidden encoded interpreter (`powershell.exe`) → `t1059.001` (PowerShell)\n   - `CM-A-33` (`q3`): Periodic high-entropy TXT queries to a single DNS zone (command channel) → `t1071.004` (DNS)\n\n5. **Identify tactic and parent technique for `q1`**:\n   Using `attack-excerpt.json`:\n   - `q4`: Tactic slug of `t1110.003` → `credential-access`\n   - `q5`: Parent technique ID of `t1110.003` → `t1110`\n\n6. **Record your answers**:\n   Copy `answers.template.txt` to `answers.txt`:\n   ```bash\n   cp answers.template.txt answers.txt\n   ```\n   Fill in each field (`q1` through `q5`) in lowercase.\n\n7. **Check your work**:\n   ```bash\n   lab check soc L1.5\n   ```\n","quiz":[{"id":1,"type":"choice","prompt":"In the ATT&CK Enterprise Matrix, a top-level column such as Credential Access (TA0006) represents a:","options":{"a":"Technique","b":"Tactic — the adversary's goal","c":"Sub-technique","d":"Data Source"},"answer_b64":"Yg=="},{"id":2,"type":"choice","prompt":"Why do detection rules and SIEM alerts map behavior to ATT&CK Technique IDs rather than specific tool names (e.g., `powershell.exe`)?","options":{"a":"Technique IDs are shorter to store in database indexes","b":"Tools are cheap for adversaries to swap, but underlying behavior remains constant — technique IDs survive tool changes","c":"MITRE compliance requires technique ID mapping for licensing","d":"Tool names are case-sensitive across operating systems"},"answer_b64":"Yg=="},{"id":3,"type":"text","prompt":"Which named section on an ATT&CK technique page tells a defender what telemetry can reveal the technique?","answer_b64":"ZGV0ZWN0aW9u","accept_b64":["ZGV0ZWN0aW9u","ZGV0ZWN0aW9ucw==","ZGV0ZWN0aW9uIHN0cmF0ZWdpZXM="]}],"hints":["Tactic = why, technique = how. In attack-excerpt.json a sub-technique has a non-null parent field. Match each alert to the behavior it describes, not to the tool named in it.","CM-A-31 = one source, many accounts, few passwords — look under Brute Force and pick the right sub-technique. CM-A-32: the interpreter is the technique. CM-A-33 says 'periodic command channel' — that is C2 over a protocol, not exfiltration. q4/q5 come straight from the tactic and parent fields of your q1 row.","q1=t1110.003 (spraying, not .001 guessing), q2=t1059.001, q3=t1071.004 (not t1048.003 — the stub describes a command channel), q4=credential-access, q5=t1110."],"recap":["Tactics are the adversary's why (TA-ids, matrix columns); techniques and sub-techniques are the how (T-ids, cells).","Map alerts to the most specific technique the evidence supports: password spraying is t1110.003, not just t1110.","Map behavior, not tools — powershell.exe in an alert means t1059.001 because behavior is expensive for attackers to change."],"recall":null,"ungradable":false,"assertions":[{"fn":"exists","path":"answers.txt","hint":""},{"fn":"exists","path":"attack-excerpt.json","hint":""},{"fn":"exists","path":"alerts.jsonl","hint":""},{"fn":"exists","path":"layer-sample.json","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q1=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q2=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q3=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q4=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q5=","hint":""},{"fn":"contains_fixed","path":".answers.norm","arg":"q1=t1110.003","hint":""},{"fn":"contains_fixed","path":".answers.norm","arg":"q2=t1059.001","hint":""},{"fn":"contains_fixed","path":".answers.norm","arg":"q3=t1071.004","hint":""},{"fn":"contains","path":".answers.norm","arg":"^q4=credential-access$","hint":""},{"fn":"contains","path":".answers.norm","arg":"^q5=t1110$","hint":""}],"norms":[{"source":"answers.txt","target":".answers.norm","comment":true,"nows":false,"trim":false,"variant":"standard"}],"graded_files":[{"name":"answers.txt","prefill":"# single lowercase tokens; technique ids like t1110.003; tactic slugs exactly as in attack-excerpt.json\n# CM-A-31: most specific technique id\nq1=\n\n# CM-A-32: most specific technique id\nq2=\n\n# CM-A-33: most specific technique id\nq3=\n\n# tactic slug of your q1 technique\nq4=\n\n# parent technique id of your q1 technique\nq5=\n","expected":"","template":"answers.template.txt","tool_output":false}],"files":[{"name":"alerts.jsonl","size":1589,"kind":"text","text":"{\"alert\": {\"id\": \"CM-A-31\"}, \"@timestamp\": \"2026-03-11T14:25:00Z\", \"status\": \"new\", \"rule\": {\"id\": \"CM-R-0117\", \"name\": \"Auth: password failures across 40+ accounts from single source\", \"version\": 3, \"severity\": \"high\", \"risk_score\": 73, \"threat\": {\"tactic\": \"UNMAPPED\", \"technique\": \"UNMAPPED\"}}, \"entities\": {\"src_ip\": \"203.0.113.66\", \"success_user\": \"m.reyes\"}, \"evidence\": {\"event_ids\": [\"CM-0311-0140\", \"CM-0311-0142\"], \"query\": \"event.code:4625 AND source.ip:203.0.113.66\"}}\n{\"alert\": {\"id\": \"CM-A-32\"}, \"@timestamp\": \"2026-03-11T15:41:22Z\", \"status\": \"new\", \"rule\": {\"id\": \"CM-R-0201\", \"name\": \"Endpoint: office app spawned hidden encoded interpreter\", \"version\": 2, \"severity\": \"high\", \"risk_score\": 80, \"threat\": {\"tactic\": \"UNMAPPED\", \"technique\": \"UNMAPPED\"}}, \"entities\": {\"host\": \"WKS-ACCT-07\", \"user\": \"m.reyes\", \"parent_image\": \"WINWORD.EXE\", \"cmdline\": \"powershell.exe -nop -w hidden -enc JAB...\"}, \"evidence\": {\"event_ids\": [\"CM-0311-0201\"], \"query\": \"process.parent.executable:*WINWORD.EXE AND process.executable:*powershell.exe\"}}\n{\"alert\": {\"id\": \"CM-A-33\"}, \"@timestamp\": \"2026-03-12T09:06:00Z\", \"status\": \"new\", \"rule\": {\"id\": \"CM-R-0304\", \"name\": \"Network: periodic high-entropy TXT queries to single zone (command channel)\", \"version\": 1, \"severity\": \"medium\", \"risk_score\": 60, \"threat\": {\"tactic\": \"UNMAPPED\", \"technique\": \"UNMAPPED\"}}, \"entities\": {\"host\": \"WKS-ENG-12\", \"zone\": \"tun.stonewick.example\", \"qtype\": \"TXT\", \"period_s\": 300}, \"evidence\": {\"event_ids\": [\"CM-0312-0033\"], \"query\": \"dns.question.type:TXT AND dns.question.name:*tun.stonewick.example\"}}\n"},{"name":"attack-excerpt.json","size":1236,"kind":"text","text":"[\n  {\n    \"tid\": \"t1110\",\n    \"name\": \"brute force\",\n    \"tactic\": \"credential-access\",\n    \"parent\": null\n  },\n  {\n    \"tid\": \"t1110.001\",\n    \"name\": \"password guessing\",\n    \"tactic\": \"credential-access\",\n    \"parent\": \"t1110\"\n  },\n  {\n    \"tid\": \"t1110.003\",\n    \"name\": \"password spraying\",\n    \"tactic\": \"credential-access\",\n    \"parent\": \"t1110\"\n  },\n  {\n    \"tid\": \"t1059\",\n    \"name\": \"command and scripting interpreter\",\n    \"tactic\": \"execution\",\n    \"parent\": null\n  },\n  {\n    \"tid\": \"t1059.001\",\n    \"name\": \"powershell\",\n    \"tactic\": \"execution\",\n    \"parent\": \"t1059\"\n  },\n  {\n    \"tid\": \"t1071\",\n    \"name\": \"application layer protocol\",\n    \"tactic\": \"command-and-control\",\n    \"parent\": null\n  },\n  {\n    \"tid\": \"t1071.004\",\n    \"name\": \"dns\",\n    \"tactic\": \"command-and-control\",\n    \"parent\": \"t1071\"\n  },\n  {\n    \"tid\": \"t1048.003\",\n    \"name\": \"exfiltration over unencrypted non-c2 protocol\",\n    \"tactic\": \"exfiltration\",\n    \"parent\": \"t1048\"\n  },\n  {\n    \"tid\": \"t1566.001\",\n    \"name\": \"spearphishing attachment\",\n    \"tactic\": \"initial-access\",\n    \"parent\": \"t1566\"\n  },\n  {\n    \"tid\": \"t1547.001\",\n    \"name\": \"registry run keys - startup folder\",\n    \"tactic\": \"persistence\",\n    \"parent\": \"t1547\"\n  }\n]\n"},{"name":"layer-sample.json","size":237,"kind":"text","text":"{\n  \"name\": \"coppermine demo\",\n  \"domain\": \"enterprise-attack\",\n  \"versions\": {\n    \"attack\": \"16\",\n    \"navigator\": \"5.1.0\",\n    \"layer\": \"4.5\"\n  },\n  \"techniques\": [\n    {\n      \"techniqueID\": \"T1110.003\",\n      \"score\": 1\n    }\n  ]\n}\n"}]},{"id":"L1.6","dir":"L1.6-killchain-and-pyramid-of-pain","phase":"p1","order":[1,6],"meta":{"id":"L1.6","title":"Kill chain & Pyramid of Pain - where an alert sits, what an indicator costs the attacker","type":"DECODE","objective":"Place incident beats on the kill chain and rate indicators by attacker replacement cost","gate":false,"est_minutes":15},"lab_md":"## BRIEF\nSecurity analysts rely on two core conceptual models during investigation and response:\n1. **Cyber Kill Chain**: Sequences adversary progression across seven stages: `recon`, `weaponization`, `delivery`, `exploitation`, `installation`, `c2`, and `actions` (on objectives).\n2. **Pyramid of Pain**: Ranks indicator types by the cost incurred by the adversary to modify them when defenders block them: `trivial` (hashes), `easy` (IPs), `simple` (domains), `annoying` (host/network artifacts), `challenging` (tools), and `tough` (TTPs / behavior).\n\nIn this lab, you map incident beats from `incident-brief.md` to the Cyber Kill Chain and rate indicators in `indicators.csv` on the Pyramid of Pain.\n\n## GUIDED STEPS\n\n1. **Review the Cyber Kill Chain Stages**:\n   - `recon`: Information gathering off-network (e.g. WHOIS lookup, typosquat domain registration).\n   - `weaponization`: Building weaponized payloads off-network (e.g. embedding malicious macros in Office documents).\n   - `delivery`: Transmission of payload into target environment (e.g. email attachment landing in inbox).\n   - `exploitation`: Execution of malicious code on target host (e.g. macros running, WINWORD spawning PowerShell).\n   - `installation`: Establishing persistence to survive host reboot (e.g. registry Run key creation).\n   - `c2`: Command and Control beaconing channel established to external attacker infrastructure.\n   - `actions`: Executing adversary objectives (e.g. staging data, exfiltration).\n\n2. **Review the Pyramid of Pain Levels**:\n   - `trivial`: File hashes (SHA256, MD5) — trivial for attacker to change by altering 1 byte.\n   - `easy`: IP addresses — easy to change using proxies or cloud infrastructure.\n   - `simple`: Domain names — simple to re-register or rotate.\n   - `annoying`: Network/Host Artifacts (User-Agents, file paths) — annoying to reconfigure.\n   - `challenging`: Tools — challenging to rewrite custom malware binaries or frameworks.\n   - `tough`: TTPs / Behaviors — tough to alter core operational habits and techniques.\n\n3. **Inspect the incident brief and indicators**:\n   ```bash\n   cat incident-brief.md\n   cat indicators.csv\n   ```\n\n4. **Record your answers**:\n   Copy `answers.template.txt` to `answers.txt`:\n   ```bash\n   cp answers.template.txt answers.txt\n   ```\n   Fill in each field in `answers.txt`:\n   - `q1`: Kill-chain stage for beat B (weaponization of `.docm`) → `weaponization`\n   - `q2`: Kill-chain stage for beat D (macro execution / `WINWORD` spawning `powershell`) → `exploitation`\n   - `q3`: Kill-chain stage for beat E (registry Run key persistence) → `installation`\n   - `q4`: Pyramid level for indicator `i1` (SHA256 hash) → `trivial`\n   - `q5`: Pyramid level for indicator `i3` (domain `c2.stonewick.example`) → `simple`\n   - `q6`: Pyramid level for indicator `i5` (User-Agent string) → `annoying`\n   - `q7`: Indicator row ID (`i1`..`i6`) that costs the attacker MOST to replace → `i6`\n\n5. **Check your work**:\n   ```bash\n   lab check soc L1.6\n   ```\n","quiz":[{"id":1,"type":"choice","prompt":"Your SOC blocks the SHA256 hash of `invoice_2026-03.docm`. Why is this rated as trivial pain for the attacker on the Pyramid of Pain?","options":{"a":"SHA256 blocklists only function on Windows platforms","b":"Altering a single byte of the file generates a completely new SHA256 hash, bypassing blocklists","c":"SHA256 hashes can be easily reversed to reconstruct original code","d":"File hash blocklists automatically expire after 30 days"},"answer_b64":"Yg=="},{"id":2,"type":"text","prompt":"Beats A and B occurred on attacker infrastructure. What is the EARLIEST Cyber Kill Chain stage Coppermine's own telemetry can observe in this incident? (Answer with one word)","answer_b64":"ZGVsaXZlcnk=","accept_b64":["ZGVsaXZlcnk="]},{"id":3,"type":"choice","prompt":"Detection engineering has one hour of development time. Per the Pyramid of Pain, which defensive enhancement inflicts the highest pain on this adversary?","options":{"a":"Add the file SHA256 hash to the endpoint blocklist","b":"Block IP address 203.0.113.66 at the perimeter firewall","c":"Build and tune a behavioral detection rule for Office processes spawning PowerShell with encoded commands","d":"Add filename `invoice_2026-03.docm` to the email gateway filter"},"answer_b64":"Yw=="}],"hints":["For each beat ask 'what is the attacker DOING at this instant', not 'what tool shows up'. For each indicator ask what it would cost the ATTACKER to swap it, not how hard it is for you to spot.","Beats that happen entirely off Coppermine's network sit before delivery; the Run key is about surviving reboot, not about code first running. On the pyramid, strings an attacker edits in a config (filenames, user-agents) sit one band, habits of how they operate sit at the top.","Beat B is payload construction = weaponization; D is code executing = exploitation; E is persistence = installation. i1 is a hash (trivial), i3 a domain (simple), i5 a network artifact (annoying); the row they would have to retrain themselves to replace is the behavior row."],"recap":["The kill chain names what the attacker is doing at each beat: recon, weaponization, delivery, exploitation, installation, c2, actions.","The Pyramid of Pain ranks indicators by the attacker's cost to replace them: hash trivial, ip easy, domain simple, artifact annoying, tool challenging, ttp tough.","Tune upward: a behavior detection like Office spawning powershell -enc outlives every hash and domain block you will ever write."],"recall":null,"ungradable":false,"assertions":[{"fn":"exists","path":"answers.txt","hint":""},{"fn":"exists","path":"incident-brief.md","hint":""},{"fn":"exists","path":"indicators.csv","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q1=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q2=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q3=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q4=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q5=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q6=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q7=","hint":""},{"fn":"contains","path":".answers.norm","arg":"^q1=weaponization$","hint":""},{"fn":"contains","path":".answers.norm","arg":"^q2=exploitation$","hint":""},{"fn":"contains","path":".answers.norm","arg":"^q3=installation$","hint":""},{"fn":"contains","path":".answers.norm","arg":"^q4=trivial$","hint":""},{"fn":"contains","path":".answers.norm","arg":"^q5=simple$","hint":""},{"fn":"contains","path":".answers.norm","arg":"^q6=annoying$","hint":""},{"fn":"contains","path":".answers.norm","arg":"^q7=i6$","hint":""}],"norms":[{"source":"answers.txt","target":".answers.norm","comment":true,"nows":false,"trim":false,"variant":"standard"}],"graded_files":[{"name":"answers.txt","prefill":"# kill-chain stage vocab: recon|weaponization|delivery|exploitation|installation|c2|actions\n# q1: stage of beat B\nq1=\n\n# q2: stage of beat D\nq2=\n\n# q3: stage of beat E\nq3=\n\n# pyramid vocab: trivial|easy|simple|annoying|challenging|tough\n# q4: level of row i1\nq4=\n\n# q5: level of row i3\nq5=\n\n# q6: level of row i5\nq6=\n\n# q7: row id (i1..i6) that costs the attacker MOST to replace\nq7=\n","expected":"","template":"answers.template.txt","tool_output":false}],"files":[{"name":"incident-brief.md","size":1022,"kind":"text","text":"# Coppermine IR summary — WKS-ACCT-07, 2026-03-11\n\n[A] 2026-03-09T13:05:00Z — WHOIS lookup reveals domain copperm1ne-billing.example was newly registered.\n[B] 2026-03-10T18:40:00Z — VBA macro project built inside malicious document invoice_2026-03.docm on attacker infrastructure.\n[C] 2026-03-11T15:02:00Z — Spearphishing email from billing@copperm1ne-billing.example (sender IP 198.51.100.71) delivered to m.reyes containing invoice_2026-03.docm.\n[D] 2026-03-11T15:41:07Z — User opens attachment; macros execute and WINWORD.EXE spawns powershell.exe -nop -w hidden -enc to fetch stage-2 payload from https://cdn.stonewick.example/.\n[E] 2026-03-11T15:41:20Z — Persistence established by writing a registry run key value under HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run.\n[F] 2026-03-11T15:46:02Z — Encrypted C2 beaconing initiated to c2.stonewick.example (203.0.113.66:443) every 300 seconds.\n[G] 2026-03-11T16:32:00Z — Accounts Payable invoice data gathered and staged to SMB share \\\\FS01\\finance.\n"},{"name":"indicators.csv","size":437,"kind":"text","text":"id,indicator_type,value,first_seen_in_incident\ni1,sha256,e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855,2026-03-11T15:02:00Z\ni2,ip,203.0.113.66,2026-03-11T15:46:02Z\ni3,domain,c2.stonewick.example,2026-03-11T15:46:02Z\ni4,filename,invoice_2026-03.docm,2026-03-11T15:02:00Z\ni5,user-agent,Mozilla/5.0 (WindowsPowerShell/5.1),2026-03-11T15:41:05Z\ni6,behavior,Office parent spawning powershell with -enc,2026-03-11T15:41:07Z\n"}]},{"id":"L1.7","dir":"L1.7-disposition-taxonomy-tp-fp-btp","phase":"p1","order":[1,7],"meta":{"id":"L1.7","title":"The disposition taxonomy - true positive, false positive, benign true positive, with mini-cases","type":"TRIAGE","objective":"Assign tp/fp/btp verdicts to six alerts and cite the deciding event id for each","gate":false,"est_minutes":20},"lab_md":"## BRIEF\nTriage verdicts grade the rule's specific **threat claim**:\n- **True Positive (TP)**: The claimed malicious behavior actually occurred and was unauthorized. Action: Escalate to Tier 2 for containment/remediation.\n- **False Positive (FP)**: The claimed malicious behavior did NOT occur (logic flaw, misparsed string, or lookalike benign protocol). Action: File detection tuning ticket.\n- **Benign True Positive (BTP)**: The rule correctly detected the behavior, but the activity was legitimate and authorized (e.g. approved change ticket, authorized pentest). Action: Close alert and submit tuning feedback (e.g. allowlist window).\n\nIn this lab, you evaluate six alert cases under `cases/c1/` through `cases/c6/`. For each case, inspect `alert.json`, `events.jsonl`, and `context.txt`, assign a disposition (`tp`, `fp`, `btp`), and cite the deciding event ID.\n\n## GUIDED STEPS\n\n1. **Evaluate Case 1 (`cases/c1/`)**:\n   - `alert.json`: Password Spray alert (`CM-A-11`) from `203.0.113.66`.\n   - `events.jsonl`: 3 failed logons (`4625`), 1 successful domain logon (`4624` `CM-0311-0142`), and 1 OWA sign-in without MFA (`CM-0311-0143`).\n   - `context.txt`: `m.reyes` not traveling; no change tickets.\n   - Verdict: `tp` (confirmed credential compromise); Deciding event ID: `cm-0311-0142` (or `cm-0311-0143`).\n\n2. **Evaluate Case 2 (`cases/c2/`)**:\n   - `alert.json`: Mimikatz command line alert (`CM-A-12`).\n   - `events.jsonl`: `POWERPNT.EXE` command line opening `how-attackers-use-mimikatz.pptx` (`CM-0310-0071`).\n   - `context.txt`: Helpdesk security awareness deck downloaded from intranet.\n   - Verdict: `fp` (rule misfired on filename string in PowerPoint viewer); Deciding event ID: `cm-0310-0071`.\n\n3. **Evaluate Case 3 (`cases/c3/`)**:\n   - `alert.json`: PsExec service on domain controller (`CM-A-13`).\n   - `events.jsonl`: `PSEXESVC.exe` started by `t.aoki` on DC01 (`CM-0310-0019`).\n   - `context.txt`: `CHG-2143` approved `t.aoki` emergency DC01 patching 09:00Z-12:00Z.\n   - Verdict: `btp` (PsExec behavior occurred but was fully authorized); Deciding event ID: `cm-0310-0019`.\n\n4. **Evaluate Case 4 (`cases/c4/`)**:\n   - `alert.json`: Password Spray alert (`CM-A-14`) from `192.0.2.150`.\n   - `events.jsonl`: Failed logons (`4625` `CM-0310-0092`). No successful logons.\n   - `context.txt`: Bluewater Security authorized quarterly pentest from `192.0.2.150`.\n   - Verdict: `btp` (spray occurred but was authorized pentest activity); Deciding event ID: `cm-0310-0092`.\n\n5. **Evaluate Case 5 (`cases/c5/`)**:\n   - `alert.json`: Office spawning PowerShell (`CM-A-15`).\n   - `events.jsonl`: `WINWORD.EXE` spawned `powershell.exe -enc` (`CM-0311-0201`), outbound C2 connection, and Run key persistence.\n   - `context.txt`: User reported invoice attachment issue; no change tickets.\n   - Verdict: `tp` (active macro malware execution); Deciding event ID: `cm-0311-0201`.\n\n6. **Evaluate Case 6 (`cases/c6/`)**:\n   - `alert.json`: C2 beaconing alert (`CM-A-16`).\n   - `events.jsonl`: UDP port 123 traffic every 64s (`CM-0312-0203`).\n   - `context.txt`: Standard workstation NTP time sync configuration to `192.0.2.10:123`.\n   - Verdict: `fp` (rule misidentified benign NTP time sync as C2 beaconing); Deciding event ID: `cm-0312-0203`.\n\n7. **Record your answers**:\n   Copy `answers.template.txt` to `answers.txt`:\n   ```bash\n   cp answers.template.txt answers.txt\n   ```\n   Set `q1`..`q6` to `tp|fp|btp` and `q1e`..`q6e` to the lowercase event ID.\n\n8. **Check your work**:\n   ```bash\n   lab check soc L1.7\n   ```\n","quiz":[{"id":1,"type":"choice","prompt":"Case c4: The password spray from 192.0.2.150 actually occurred. Why is the verdict Benign True Positive (BTP) rather than False Positive (FP)?","options":{"a":"The rule mis-parsed the authentication logons","b":"The claimed behavior genuinely occurred but was authorized under the Bluewater engagement letter","c":"No user account was compromised, so it cannot be any kind of positive","d":"The originating source IP is an internal network address"},"answer_b64":"Yg=="},{"id":2,"type":"choice","prompt":"Case c6: 64-second periodic traffic to 192.0.2.10:123. Why is the verdict False Positive (FP) rather than Benign True Positive (BTP)?","options":{"a":"NTP traffic is authorized, and authorized activity is always FP","b":"The 64-second interval is too short to qualify as C2 beaconing","c":"BTP requires the rule's threat claim to accurately describe the behavior — here the traffic is NTP, so the C2 claim itself is wrong","d":"UDP traffic cannot function as C2"},"answer_b64":"Yw=="},{"id":3,"type":"choice","prompt":"What action should closing an alert as Benign True Positive (BTP) produce?","options":{"a":"An incident ticket escalated to Tier 2","b":"Nothing — close the alert silently","c":"Detection tuning feedback (e.g. allowlist the change window or authorized source IP) without an incident ticket","d":"An immediate password reset for the involved account"},"answer_b64":"Yw=="}],"hints":["Ask two questions per case, in order: (1) did the behavior the rule NAMES actually happen? (2) if yes, was it authorized? No->fp; yes+unauthorized->tp; yes+authorized->btp. Read context.txt last.","Two cases have paperwork that authorizes real behavior. Two cases matched something other than the named activity — check which executable actually ran (c2) and which well-known port the traffic uses (c6).","c2: 'mimikatz' appears only inside a .pptx filename in a POWERPNT.EXE command line. c6: UDP/123 is time sync. c3/c4: compare event timestamps and source against CHG-2143 and the engagement letter. For qNe pick the one event a skeptic couldn't argue with."],"recap":["The verdict grades the rule's threat claim: tp means the claimed malicious activity really happened and was not authorized.","fp means what actually happened is not the claimed activity — a logic, parsing, or lookalike match (a filename, a protocol the rule mistook for C2).","btp means the rule correctly caught the behavior but the behavior was authorized — close with tuning feedback, never with an incident ticket."],"recall":null,"ungradable":false,"assertions":[{"fn":"exists","path":"answers.txt","hint":""},{"fn": echnique ID (e.g., `t1110.003`).\n- `qNc`: Best evidence pull option (`a`, `b`, or `c`).\n\n## GUIDED STEPS\n\n1. **Inspect Alert 1 (`alerts/CM-A-51.json`)**:\n   - `evidence.query`: `index=entra_signin result:success mfa:absent` → `q1a=entra-signin`\n   - Threat tactic: `credential-access`, Rule: \"Successful sign-in without expected MFA claim\" → `q1b=t1110.003` (Password Spraying)\n   - `evidence-menu.md` selection → `q1c=b` (raw entra-signin records 14:05Z-14:25Z for IP 203.0.113.66 across all accounts)\n\n2. **Inspect Alert 2 (`alerts/CM-A-52.json`)**:\n   - `evidence.query`: `index=sysmon event.code:1` → `q2a=sysmon`\n   - Threat tactic: `execution`, Rule: \"Office application spawned encoded PowerShell\" → `q2b=t1059.001` (PowerShell)\n   - `evidence-menu.md` selection → `q2c=a` (Sysmon Event ID 1 on WKS-ACCT-07 with WINWORD parent and powershell -enc child)\n\n3. **Inspect Alert 3 (`alerts/CM-A-53.json`)**:\n   - `evidence.query`: `index=zeek_dns` → `q3a=zeek-dns`\n   - Threat tactic: `command-and-control`, Rule: \"High-entropy subdomain burst with NXDOMAIN ratio\" → `q3b=t1071.004` (DNS)\n   - `evidence-menu.md` selection → `q3c=c` (Zeek DNS log records for source 10.20.31.112 querying tun.stonewick.example)\n\n4. **Inspect Alert 4 (`alerts/CM-A-54.json`)**:\n   - `evidence.query`: `index=win_security event.code:(4720 OR 4732)` → `q4a=win-security`\n   - Threat tactic: `persistence`, Rule: \"Account created and added to Administrators within 60s\" on FS01 → `q4b=t1136.001` (Local Account)\n   - `evidence-menu.md` selection → `q4c=a` (Windows Security events 4720 and 4732 on FS01)\n\n5. **Inspect Alert 5 (`alerts/CM-A-55.json`)**:\n   - `evidence.query`: `index=linux_auth` → `q5a=linux-auth`\n   - Threat tactic: `persistence`, Rule: \"Cron entry installed during interactive root SSH session\" → `q5b=t1053.003` (Cron)\n   - `evidence-menu.md` selection → `q5c=b` (WEB01 auth.log entries for SSH auth, crontab REPLACE, and PAM session)\n\n6. **Record your answers**:\n   Copy `answers.template.txt` to `answers.txt`:\n   ```bash\n   cp answers.template.txt answers.txt\n   ```\n   Fill in each answer field `q1a` through `q5c` in lowercase.\n\n7. **Check your work**:\n   ```bash\n   lab check soc L1.8\n   ```\n","quiz":[{"id":1,"type":"choice","prompt":"Which sequence correctly orders the SOC telemetry pipeline?","options":{"a":"Adversary Action → Telemetry → Log → Normalized Event → Detection Rule → Alert","b":"Alert → Detection Rule → Log → Telemetry → Adversary Action","c":"Telemetry → Adversary Action → Alert → Normalized Event"},"answer_b64":"YQ=="},{"id":2,"type":"choice","prompt":"When an analyst picks up Alert CM-A-52 to perform triage, in which direction are they traversing the pipeline?","options":{"a":"Forwards: from adversary action toward the alert","b":"Backwards: from the alert toward the originating adversary action","c":"Neither: triage only evaluates the alert payload itself"},"answer_b64":"Yg=="},{"id":3,"type":"choice","prompt":"Rule CM-R-0181 fires on user t.aoki adding an account to Administrators under approved change ticket CHG-2143. The rule matched the exact behavior. What is the disposition?","options":{"a":"True Positive (TP)","b":"False Positive (FP)","c":"Benign True Positive (BTP)"},"answer_b64":"Yw=="}],"hints":["Each alert's evidence.query names an index, and sources-catalog.md maps planes to slugs — decide identity vs host vs network vs Linux syslog before touching the technique column.","For qNb, filter attack-excerpt.json by the alert's tactic, then match what the RULE's logic actually detects, not the wider story; for qNc the right pull is always raw events on the same host and plane the rule fired on.","A1 fired on a cloud sign-in policy, not a Windows 4624; A4's 4720/4732 are Windows Security codes from FS01; every wrong menu option is wrong-host, wrong-plane, or enrichment-not-evidence — eliminate those three and the letter is what's left."],"recap":["An alert is the end of a pipeline — 0201)\n- b) Zeek connection log egress records for WKS-ACCT-07\n- c) Windows Security Event ID 4624 for m.reyes on DC01\n\n## Alert CM-A-53 (Command and Control)\n- a) Entra sign-in log records for user d.okafor\n- b) Live `dig` query to tun.stonewick.example\n- c) Zeek DNS log records for source 10.20.31.112 querying tun.stonewick.example showing subdomain length and NXDOMAIN status (events CM-0312-0310..0312)\n\n## Alert CM-A-54 (Persistence)\n- a) Windows Security events 4720 (user creation) and 4732 (group membership change) on FS01 (events CM-0311-0244 and CM-0311-0245)\n- b) Entra ID directory audit logs for supportadmin\n- c) Sysmon process creation events from WKS-ACCT-07\n\n## Alert CM-A-55 (Persistence)\n- a) WHOIS report for domain cdn.stonewick.example\n- b) WEB01 auth.log entries for 20:15Z–20:21Z showing SSH authentication for root from 203.0.113.66, crontab REPLACE, and PAM session open (events CM-0312-0455..0460)\n- c) Zeek conn records for 300s beaconing from WKS-ACCT-07 to 203.0.113.66:443\n"},{"name":"sources-catalog.md","size":1015,"kind":"text","text":"# Telemetry Sources Catalog\n\n| Slug | Telemetry Plane | Description & Primary Index | Telltale Fields |\n|---|---|---|---|\n| `zeek-conn` | Network | Network connection state & transport metrics (`index=zeek_conn`) | `source.ip`, `destination.ip`, `destination.port`, `network.bytes` |\n| `zeek-dns` | Network | DNS queries & responses (`index=zeek_dns`) | `dns.question.name`, `dns.question.type`, `dns.response_code` |\n| `win-security` | Host | Windows Security Audit Event Log (`index=win_security`) | `event.code` (e.g. 4624, 4625, 4720, 4732), `winlog.logon.type`, `user.name` |\n| `sysmon` | Host | Microsoft Sysmon process & system telemetry (`index=sysmon`) | `event.code` (1=Process, 3=Net, 11=File, 13=Registry), `process.command_line` |\n| `linux-auth` | Host | Linux Authentication & PAM Syslog (`index=linux_auth`) | `sshd`, `sudo`, `pam_unix`, `crontab`, `systemd` |\n| `entra-signin` | Identity | Microsoft Entra ID Cloud Sign-in Logs (`index=entra_signin`) | `user`, `app`, `mfa`, `result`, `source.ip` |\n"}]},{"id":"L2.1","dir":"L2.1-conn-reading","phase":"p2","order":[2,1],"meta":{"id":"L2.1","title":"Ports, protocols, and conversations - reading a connection log like a sentence","type":"DECODE","objective":"Read a zeek conn.log row as a sentence - 5-tuple, service, duration, byte direction, and conn_state - and pick the odd conversation out.","gate":false,"est_minutes":15},"lab_md":"## BRIEF\nA zeek `conn.log` row is a sentence about one conversation: *who* talked to *whom*, on *what*\nport/service, for *how long*, *how many bytes* each way, and *how it ended*. In this lab you read\nnine `conn.log` rows from a Coppermine workstation's traffic and pick the odd conversation out.\n\n## GUIDED STEPS\n\n1. **Read the header, then line the rows up**:\n   ```bash\n   head -7 conn.log\n   column -t conn.log\n   ```\n   The `#fields` line names every column in order: `ts uid id.orig_h id.orig_p id.resp_h id.resp_p\n   proto service duration orig_bytes resp_bytes conn_state history event_id`. `id.orig_*` is always\n   the host that **opened** the connection; `orig_bytes`/`resp_bytes` count from that same point of\n   view. `conn-state-legend.md` decodes the `conn_state` column (`SF`, `S0`, `REJ`, `RSTO`, ...).\n\n2. **Find the rejected scanner connection**:\n   ```bash\n   awk -F'\\t' '$12==\"REJ\"{print}' conn.log\n   ```\n   ```\n   2026-03-11T15:10:00Z\tCRD00006\t192.0.2.199\t51000\t10.20.10.20\t22\ttcp\t-\t0.00\t0\t0\tREJ\tSr\tCM-0311-0514\n   ```\n   `192.0.2.199` (a research scanner) tried port 22 on WEB01 and got rejected outright — `0`\n   bytes either way, `conn_state REJ`. Its `uid` is `CRD00006`.\n\n3. **Count the `S0` (no-reply) rows**:\n   ```bash\n   awk -F'\\t' '$12==\"S0\"{c++} END{print c}' conn.log\n   ```\n   ```\n   2\n   ```\n   Two rows show a query sent with no reply ever seen — the NTP hit from WKS-HD-03 and a DNS query\n   from WKS-ENG-12. `S0` is not necessarily hostile; it just means nobody answered.\n\n4. **Spot the odd conversation out**:\n   Two rows go to `203.0.113.66:443` over `ssl` from the same workstation, five minutes apart: `0.31s`\n   / `517B<->1203B` and `0.29s` / `511B<->1198B`. Compare that to the *other* 443/tcp/ssl row — a `42.3s`\n   session moving `4201B<->8830B` to `192.0.2.60` (the saas webmail host). Short, tiny, and repeating on\n   an external IP that isn't webmail is the tell: this is automation, not a person browsing.\n\n5. **Record your answers**:\n   Copy `answers.template.txt` to `answers.txt`:\n   ```bash\n   cp answers.template.txt answers.txt\n   ```\n   Fill in each field in `answers.txt`:\n   - `q1`: uid of the rejected scanner row (`crd00006`)\n   - `q2`: conn_state of the 445/tcp svc_backup copy (`sf`)\n   - `q3`: service label of the short external 443 conversation (`ssl`)\n   - `q4`: resp_bytes of that beacon's first hit (`1203`)\n   - `q5`: the external dst IP a workstation opened 443 to, that isn't saas webmail — defanged\n     (`203.0.113[.]66`)\n   - `q6`: how many rows show `conn_state S0` (`2`)\n\n6. **Check your work**:\n   ```bash\n   lab check soc L2.1\n   ```\n","quiz":[{"id":1,"type":"choice","prompt":"`orig_bytes` and `resp_bytes` are counted from whose point of view?","options":{"a":"the responder","b":"the originator (the host that opened the connection)","c":"the sensor","d":"always the server"},"answer_b64":"Yg=="},{"id":2,"type":"choice","prompt":"A row shows `conn_state S0`. What happened?","options":{"a":"normal close","b":"the originator sent but no reply was ever seen","c":"the responder reset it","d":"a full file transfer"},"answer_b64":"Yg=="},{"id":3,"type":"choice","prompt":"Two 443/tcp `ssl` rows: one is 42s / 4KB<->8KB, the other 0.3s / 517B<->1.2KB and repeats 5 minutes later. Which smells like automation, not a human?","options":{"a":"the 42s session","b":"the short repeating one","c":"neither - both are TLS","d":"can't tell from conn.log"},"answer_b64":"Yg=="}],"hints":["Read the `#fields` header first; every answer is one column of one row. Line the file up with `column -t conn.log`.","`conn_state` is the last-but-two column; conn-state-legend.md decodes SF/S0/REJ/RSTO. `orig_bytes` is what the *opener* sent. For q5, a workstation opening 443 to an external IP that isn't 192.0.2.60 is the tell - and your answer must be defanged.","q1: the REJ row is the scanner->WEB01:22; copy its uid. q2: the 445 copy is SF. q3: row 5's service is ssl. q4: resp_bytes of row 5 is 1203. q5: 203.0.113[.]66. q6: count S0 rows - there are two."],"recap":["A conn.log row is a full sentence: who -> whom, port/service, duration, bytes each way, and how it ended.","conn_state is the verb - SF normal, S0 no reply, REJ rejected, RSTO/RSTR reset - and it often carries the verdict.","Short, tiny, repeating external TLS sessions read as automation; long human sessions move real bytes."],"recall":[{"id":"R1","prompt":"In L1.7's taxonomy, a rule that correctly fires on real activity that turns out to be authorized (like an approved PsExec change) is disposed as tp, fp, or ___?","accept_b64":["YnRw"],"source":"L1.7"},{"id":"R2","prompt":"Which top-level Sigma rule section combines the named selections into the actual firing logic?","accept_b64":["Y29uZGl0aW9u"],"source":"L1.4"},{"id":"R3","prompt":"ATT&CK technique id for a Word document (WINWORD.EXE) spawning a hidden, encoded powershell.exe?","accept_b64":["dDEwNTkuMDAx"],"source":"L1.5"},{"id":"R4","prompt":"Which alert JSON field lists the raw event ids you'd pull to verify the alert against evidence?","accept_b64":["ZXZpZGVuY2UuZXZlbnRfaWRz"],"source":"L1.3"},{"id":"R5","prompt":"A workstation holds a long encrypted TLS session - bytes and duration are visible, but never this:","accept_b64":["cGF5bG9hZA==","Y29udGVudA==","Ym9keQ=="],"source":"L1.1"}],"ungradable":false,"assertions":[{"fn":"exists","path":"conn.log","hint":""},{"fn":"exists","path":"conn-state-legend.md","hint":""},{"fn":"exists","path":"answers.txt","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q1=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q2=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q3=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q4=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q5=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q6=","hint":""},{"fn":"contains","path":".answers.norm","arg":"^q1=crd00006$","hint":""},{"fn":"contains","path":".answers.norm","arg":"^q2=sf$","hint":""},{"fn":"contains","path":".answers.norm","arg":"^q3=ssl$","hint":""},{"fn":"contains","path":".answers.norm","arg":"^q4=1203$","hint":""},{"fn":"contains_fixed","path":".answers.norm","arg":"q5=203.0.113[.]66","hint":""},{"fn":"contains","path":".answers.norm","arg":"^q6=2$","hint":""}],"norms":[{"source":"answers.txt","target":".answers.norm","comment":true,"nows":false,"trim":true,"variant":"standard"}],"graded_files":[{"name":"answers.txt","prefill":"# Read conn.log (with conn-state-legend.md as reference) and answer.\n\n# uid of the row where the scanner's connection was REJECTED\nq1=\n\n# conn_state of the svc_backup 445/tcp copy (one token, e.g. sf)\nq2=\n\n# service label of row 5 (the short external 443 conversation)\nq3=\n\n# resp bytes the beacon's first hit received\nq4=\n\n# the ONE external dst IP a workstation opened a 443 session to that is\n# NOT saas webmail - DEFANGED (e.g. 198.51.100[.]23)\nq5=\n\n# how many rows use conn_state S0 (no reply seen)\nq6=\n","expected":"","template":"answers.template.txt","tool_output":false}],"files":[{"name":"conn-state-legend.md","size":796,"kind":"text","text":"# Zeek `conn_state` legend\n\n| Code | Meaning |\n|---|---|\n| `SF` | Normal establishment and teardown — both sides opened and closed cleanly. |\n| `S0` | Connection attempt seen, no reply — the originator's SYN got no answer. |\n| `REJ` | Connection attempt rejected — a RST came back instead of a SYN-ACK. |\n| `RSTO` | Connection established, then reset by the **originator**. |\n| `RSTR` | Connection established, then reset by the **responder**. |\n| `OTH` | No SYN seen (mid-stream capture) — neither a clean open nor a clean close. |\n\nEvery row is a 5-tuple sentence: `id.orig_h:id.orig_p -> id.resp_h:id.resp_p`, over\n`proto`/`service`, lasting `duration` seconds. `orig_bytes` is what the **originator**\n(the host that opened the connection) sent; `resp_bytes` is what it received back.\n"},{"name":"conn.log","size":1259,"kind":"text","text":"#separator \\x09\n#set_separator\t,\n#empty_field\t(empty)\n#unset_field\t-\n#path\tconn\n#fields\tts\tuid\tid.orig_h\tid.orig_p\tid.resp_h\tid.resp_p\tproto\tservice\tduration\torig_bytes\tresp_bytes\tconn_state\thistory\tevent_id\n#types\ttime\tstring\taddr\tport\taddr\tport\tenum\tstring\tinterval\tcount\tcount\tstring\tstring\tstring\n2026-03-11T13:58:00Z\tCRD00001\t10.20.30.107\t49152\t192.0.2.60\t443\ttcp\tssl\t42.30\t4201\t8830\tSF\tShADadFf\tCM-0311-0510\n2026-03-11T13:58:05Z\tCRD00002\t10.20.30.107\t49153\t10.20.10.5\t53\tudp\tdns\t0.01\t76\t142\tSF\tDd\tCM-0311-0511\n2026-03-11T14:30:00Z\tCRD00003\t10.20.30.103\t49154\t192.0.2.10\t123\tudp\t-\t0.00\t76\t76\tS0\tD\tCM-0311-0512\n2026-03-11T14:45:00Z\tCRD00004\t10.20.31.112\t49155\t10.20.10.5\t53\tudp\tdns\t0.01\t88\t0\tS0\tD\tCM-0311-0513\n2026-03-11T15:46:02Z\tCRD00005\t10.20.30.107\t49156\t203.0.113.66\t443\ttcp\tssl\t0.31\t517\t1203\tSF\tShADadFf\tCM-0311-0501\n2026-03-11T15:10:00Z\tCRD00006\t192.0.2.199\t51000\t10.20.10.20\t22\ttcp\t-\t0.00\t0\t0\tREJ\tSr\tCM-0311-0514\n2026-03-11T15:10:05Z\tCRD00007\t192.0.2.199\t51001\t10.20.10.20\t80\ttcp\thttp\t0.05\t88\t240\tRSTO\tShADadR\tCM-0311-0515\n2026-03-11T02:00:14Z\tCRD00008\t10.20.10.9\t49157\t10.20.10.8\t445\ttcp\t-\t3.10\t1200000\t9000\tSF\tShADadFf\tCM-0311-0516\n2026-03-11T15:51:02Z\tCRD00009\t10.20.30.107\t49158\t203.0.113.66\t443\ttcp\tssl\t0.29\t511\t1198\tSF\tShADadFf\tCM-0311-0517\n"}]},{"id":"L2.2","dir":"L2.2-dns-hunt","phase":"p2","order":[2,2],"meta":{"id":"L2.2","title":"DNS, the analyst's favorite log - queries, NXDOMAIN storms, tunneling signs, DGA smell","type":"HUNT","objective":"Find a DNS tunnel in a query log by its shape - one host, one zone, long random labels, TXT + NXDOMAIN at high rate - and separate it from benign NXDOMAIN noise.","gate":false,"est_minutes":20},"lab_md":"## BRIEF\nDNS abuse has a *shape*: the tunnel is one host, one zone, long high-entropy labels, TXT-heavy,\nNXDOMAIN-heavy, at a rate no human ever generates. Benign NXDOMAIN noise (wpad lookups, a typo'd\nhostname) looks nothing like it once you count. In this lab you hunt `dns.log` for the tunnel and\nprove it's not just noise.\n\n## GUIDED STEPS\n\n1. **Count queries per source host** — one host should dwarf the rest:\n   ```bash\n   awk -F'\\t' '!/^#/{print $3}' dns.log | sort | uniq -c | sort -rn\n   ```\n   ```\n       42 10.20.31.112\n        6 10.20.30.107\n        5 10.20.30.103\n        1 10.20.10.9\n        1 10.20.10.20\n   ```\n   `10.20.31.112` sent more than four times everyone else combined. Start there.\n\n2. **Find the shared parent zone of that host's queries**:\n   ```bash\n   awk -F'\\t' '!/^#/ && $3==\"10.20.31.112\"{print $8}' dns.log \\\n     | awk -F'.' '{print $(NF-2)\".\"$(NF-1)\".\"$NF}' | sort | uniq -c\n   ```\n   ```\n        1 saas.mail.example\n       40 tun.stonewick.example\n        1 wpad.coppermine.example\n   ```\n   Forty of that host's queries share one zone: `tun.stonewick.example`. The other two are\n   ordinary background traffic (webmail poll, a wpad lookup) — the same host can do both.\n\n3. **Check the shape of the tunnel-zone traffic specifically**:\n   ```bash\n   awk -F'\\t' '!/^#/ && $3==\"10.20.31.112\" && $8 ~ /tun\\.stonewick\\.example$/ {print $9, $10}' \\\n     dns.log | sort | uniq -c\n   ```\n   ```\n        6 A NXDOMAIN\n        5 TXT NOERROR\n       29 TXT NXDOMAIN\n   ```\n   `TXT` + `NXDOMAIN` dominates (29 of 40). That's the tell: long random labels, mostly TXT, mostly\n   no answer — a covert channel, not a broken app. (Broken-app NXDOMAIN storms, like the `wpad`\n   noise above, come from *many* hosts with short, meaningful names — nothing like this.)\n\n4. **Get the exact count and one event id, scoped to the tunnel zone** (not the host's total\n   traffic — that host also made two ordinary queries):\n   ```bash\n   awk -F'\\t' '!/^#/ && $3==\"10.20.31.112\" && $8 ~ /tun\\.stonewick\\.example$/' dns.log | wc -l\n   awk -F'\\t' '!/^#/ && $3==\"10.20.31.112\" && $8 ~ /tun\\.stonewick\\.example$/ {print $NF; exit}' \\\n     dns.log\n   ```\n   ```\n   40\n   CM-0312-0310\n   ```\n\n5. **Record your answers**:\n   Copy `answers.template.txt` to `answers.txt`:\n   ```bash\n   cp answers.template.txt answers.txt\n   ```\n   Fill in each field in `answers.txt`:\n   - `q1`: the source IP doing the tunneling, defanged (`10.20.31[.]112`)\n   - `q2`: the tunnel zone, defanged (`tun.stonewick[.]example`)\n   - `q3`: dominant qtype of the tunnel traffic (`txt`)\n   - `q4`: dominant rcode of the tunnel traffic (`nxdomain`)\n   - `q5`: count of tunnel-zone queries from that host (`40`)\n   - `q6`: one event_id of a tunnel query (`cm-0312-0310`)\n\n6. **Check your work**:\n   ```bash\n   lab check soc L2.2\n   ```\n","quiz":[{"id":1,"type":"choice","prompt":"Dozens of NXDOMAIN for `wpad.coppermine.example` from many hosts is usually:","options":{"a":"a tunnel","b":"benign browser proxy-autoconfig lookups","c":"a DGA","d":"exfiltration"},"answer_b64":"Yg=="},{"id":2,"type":"choice","prompt":"What most distinguishes tunneling from a broken-app NXDOMAIN storm?","options":{"a":"tunneling uses long high-entropy labels under one zone from one host, carrying data","b":"tunneling always uses port 53","c":"storms only happen at night","d":"tunneling never returns NOERROR"},"answer_b64":"YQ=="},{"id":3,"type":"text","prompt":"A single host sends hundreds of TXT queries for random labels under one domain and mostly gets NXDOMAIN. One word for what that domain's authoritative server is being used as?","answer_b64":"dHVubmVs","accept_b64":["dHVubmVs"]}],"hints":["Count queries per source host (`awk -F'\\t' '!/^#/{print $3}' dns.log | sort | uniq -c`). One host dwarfs the rest - start there.","Strip each qname to its last three labels to find the shared parent zone; the tunnel's labels are long and random, its qtype and rcode both repeat. Your IOC answers must be defanged.","Host 10.20.31[.]112, zone tun.stonewick[.]example, qtype txt, rcode nxdomain; q5 is that host's tunnel-zone query count (40); any tunnel row's event_id works for q6 (cm-0312-0310, -0311, or -0312)."],"recap":["DNS abuse has a shape: one host, one zone, long high-entropy labels, TXT and NXDOMAIN at volume - that is a tunnel, a covert channel over port 53.","Benign NXDOMAIN storms (wpad, typos) come from many hosts with short, meaningful names - count per source before you conclude anything.","The authoritative server for the tunnel zone is the attacker's C2 endpoint; the zone itself is the durable indicator."],"recall":null,"ungradable":false,"assertions":[{"fn":"exists","path":"dns.log","hint":""},{"fn":"exists","path":"answers.txt","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q1=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q2=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q3=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q4=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q5=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q6=","hint":""},{"fn":"contains_fixed","path":".answers.norm","arg":"q1=10.20.31[.]112","hint":""},{"fn":"contains_fixed","path":".answers.norm","arg":"q2=tun.stonewick[.]example","hint":""},{"fn":"contains","path":".answers.norm","arg":"^q3=txt$","hint":""},{"fn":"contains","path":".answers.norm","arg":"^q4=nxdomain$","hint":""},{"fn":"contains","path":".answers.norm","arg":"^q5=40$","hint":""},{"fn":"contains","path":".answers.norm","arg":"^q6=(cm-0312-0310|cm-0312-0311|cm-0312-0312)$","hint":""}],"norms":[{"source":"answers.txt","target":".answers.norm","comment":true,"nows":false,"trim":true,"variant":"standard"}],"graded_files":[{"name":"answers.txt","prefill":"# Hunt dns.log with awk/sort/uniq -c/rg and answer.\n\n# source IP doing the tunneling - DEFANGED (e.g. 10.20.31[.]112)\nq1=\n\n# the tunnel zone (parent domain shared by the random labels) - DEFANGED\nq2=\n\n# dominant qtype of the tunnel traffic (one token)\nq3=\n\n# dominant rcode of the tunnel traffic (one token)\nq4=\n\n# count of tunnel-zone queries from that host\nq5=\n\n# one event_id of a tunnel query (cm-mmdd-nnnn)\nq6=\n","expected":"","template":"answers.template.txt","tool_output":false}],"files":[{"name":"dns.log","size":8000,"kind":"text","text":"#separator \\x09\n#set_separator\t,\n#empty_field\t(empty)\n#unset_field\t-\n#path\tdns\n#fields\tts\tuid\tid.orig_h\tid.orig_p\tid.resp_h\tid.resp_p\tproto\tquery\tqtype_name\trcode_name\tanswers\tevent_id\n#types\ttime\tstring\taddr\tport\taddr\tport\tenum\tstring\tstring\tstring\tstring\tstring\n2026-03-12T09:00:00Z\tCTUN00001\t10.20.31.112\t52000\t10.20.10.5\t53\tudp\t9d313c2f04e2f2699784f1c4.tun.stonewick.example\tTXT\tNXDOMAIN\t-\tCM-0312-0310\n2026-03-12T09:00:30Z\tCTUN00002\t10.20.31.112\t52001\t10.20.10.5\t53\tudp\tfd48d9ea7d7448d3dc809d880.tun.stonewick.example\tTXT\tNXDOMAIN\t-\tCM-0312-0311\n2026-03-12T09:00:30Z\tCBEN0001\t10.20.30.107\t52540\t10.20.10.5\t53\tudp\twpad.coppermine.example\tA\tNXDOMAIN\t-\tCM-0312-0570\n2026-03-12T09:00:45Z\tCBEN0014\t10.20.30.103\t52553\t10.20.10.5\t53\tudp\tfs01.coppermine.example\tA\tNOERROR\t10.20.10.8\tCM-0312-0583\n2026-03-12T09:01:00Z\tCTUN00003\t10.20.31.112\t52002\t10.20.10.5\t53\tudp\td8a57bf281abe60590ee606c1c.tun.stonewick.example\tTXT\tNXDOMAIN\t-\tCM-0312-0312\n2026-03-12T09:01:00Z\tCBEN0007\t10.20.30.107\t52546\t10.20.10.5\t53\tudp\tsaas.mail.example\tA\tNOERROR\t192.0.2.60\tCM-0312-0 t53\tudp\teb7c9bf31da8f75a317becc8dd7.tun.stonewick.example\tTXT\tNXDOMAIN\t-\tCM-0312-0557\n2026-03-12T09:15:30Z\tCTUN00032\t10.20.31.112\t52031\t10.20.10.5\t53\tudp\t598a5f9b28290dcc6ab8660590ed.tun.stonewick.example\tTXT\tNXDOMAIN\t-\tCM-0312-0558\n2026-03-12T09:16:00Z\tCTUN00033\t10.20.31.112\t52032\t10.20.10.5\t53\tudp\t1c5127396ac9cdae40c346532cdce.tun.stonewick.example\tTXT\tNXDOMAIN\t-\tCM-0312-0559\n2026-03-12T09:16:30Z\tCTUN00034\t10.20.31.112\t52033\t10.20.10.5\t53\tudp\t09d7294751941afe870d7676f5079b.tun.stonewick.example\tTXT\tNXDOMAIN\t-\tCM-0312-0560\n2026-03-12T09:17:00Z\tCTUN00035\t10.20.31.112\t52034\t10.20.10.5\t53\tudp\tc814e8b02bdf02ed07c70bd3aefcf3f.tun.stonewick.example\tTXT\tNXDOMAIN\t-\tCM-0312-0561\n2026-03-12T09:17:30Z\tCTUN00036\t10.20.31.112\t52035\t10.20.10.5\t53\tudp\t7f5468036413b5e242d5058631333ded.tun.stonewick.example\tA\tNXDOMAIN\t-\tCM-0312-0562\n2026-03-12T09:18:00Z\tCTUN00037\t10.20.31.112\t52036\t10.20.10.5\t53\tudp\t300938a5ebdfdfa4f4a228f6.tun.stonewick.example\tTXT\tNXDOMAIN\t-\tCM-0312-0563\n2026-03-12T09:18:30Z\tCTUN00038\t10.20.31.112\t52037\t10.20.10.5\t53\tudp\tcddd9f392a32805be1fff0b7d.tun.stonewick.example\tTXT\tNXDOMAIN\t-\tCM-0312-0564\n2026-03-12T09:19:00Z\tCTUN00039\t10.20.31.112\t52038\t10.20.10.5\t53\tudp\t7ffec40b0af376d17453eaf2f2.tun.stonewick.example\tTXT\tNXDOMAIN\t-\tCM-0312-0565\n2026-03-12T09:19:30Z\tCTUN00040\t10.20.31.112\t52039\t10.20.10.5\t53\tudp\t32329dc0a8bdaf33a2168b6cfdd.tun.stonewick.example\tTXT\tNOERROR\tddb462f05ba44367\tCM-0312-0566\n"}]},{"id":"L2.3","dir":"L2.3-http-tls","phase":"p2","order":[2,3],"meta":{"id":"L2.3","title":"HTTP and TLS in logs - methods, status codes, user-agents, SNI","type":"DECODE","objective":"Read HTTP request lines and TLS SNI from zeek http.log/ssl.log; know which fields encryption hides and which survive.","gate":false,"est_minutes":15},"lab_md":"## BRIEF\nHTTP exposes the request: method, host, uri, user-agent, status code — all in the clear. HTTPS\nhides the uri and body, but the SNI (`server_name` in zeek's `ssl.log`) is the destination hostname\nyou still get — until a resumed session drops it. In this lab you read both logs and learn which\nfields survive encryption and which don't.\n\n## GUIDED STEPS\n\n1. **Find the status code of the plaintext payload pull**:\n   ```bash\n   awk -F'\\t' '!/^#/ && $9==\"/u.sh\"{print $11}' http.log\n   ```\n   ```\n   200\n   ```\n   `/u.sh` is fetched over plaintext HTTP (port 80), so the full request line — method, host, uri,\n   user-agent — is readable in `http.log`.\n\n2. **Find the C2's SNI in the first TLS handshake**:\n   ```bash\n   awk -F'\\t' '!/^#/ && $5==\"203.0.113.66\" && $9!=\"-\"{print $9; exit}' ssl.log\n   ```\n   ```\n   c2.stonewick.example\n   ```\n   The C2 session is TLS-only — `http.log` has no row for it at all. `ssl.log`'s `server_name`\n   (the SNI from the ClientHello) is the only destination hostname you get.\n\n3. **Spot the user-agent that isn't a browser**:\n   ```bash\n   awk -F'\\t' '!/^#/{print $10}' http.log | grep -i windowspowershell\n   ```\n   ```\n   Mozilla/5.0 (WindowsPowerShell/5.1)\n   ```\n   Real browsers announce themselves with predictable UA strings. A UA naming a scripting engine on\n   an *outbound* request — `curl`, `WindowsPowerShell` — is a cheap, useful tell, independent of\n   whether the traffic is otherwise unremarkable (this one is a `200 OK`, no obvious red flag except\n   the UA itself).\n\n4. **Check what that same host sent** (method matters — POSTing data out is different from fetching\n   a page):\n   ```bash\n   awk -F'\\t' '!/^#/ && $9==\"/telemetry\"{print $7}' http.log\n   ```\n   ```\n   POST\n   ```\n\n5. **Compare the beacon's first TLS row to a later, resumed one**:\n   ```bash\n   awk -F'\\t' '!/^#/ && $10==\"T\"{print $9}' ssl.log\n   ```\n   ```\n   -\n   ```\n   Real TLS session resumption skips the full handshake, and `server_name` is only set during a full\n   ClientHello — a resumed row can show `-` even for the exact same destination. If you only look at\n   a resumed row, you lose the SNI; the first handshake is where it lives.\n\n6. **Record your answers**:\n   Copy `answers.template.txt` to `answers.txt`:\n   ```bash\n   cp answers.template.txt answers.txt\n   ```\n   Fill in each field in `answers.txt`:\n   - `q1`: status code of the `/u.sh` payload pull (`200`)\n   - `q2`: SNI of the beacon's first TLS handshake, defanged (`c2.stonewick[.]example`)\n   - `q3`: the scripting-engine user-agent, verbatim lowercased (`mozilla/5.0 (windowspowershell/5.1)`)\n   - `q4`: HTTP method that sent data to the server (`post`)\n   - `q5`: `server_name` of the resumed TLS row (`-`)\n   - `q6`: which log carries an HTTPS session's destination hostname (`ssl`)\n\n7. **Check your work**:\n   ```bash\n   lab check soc L2.3\n   ```\n","quiz":[{"id":1,"type":"choice","prompt":"A host makes an HTTPS connection to a C2. Which field still tells you the destination hostname?","options":{"a":"http.uri","b":"ssl server_name (SNI)","c":"the response body","d":"none - TLS hides everything"},"answer_b64":"Yg=="},{"id":2,"type":"choice","prompt":"A `404` in http.log means:","options":{"a":"the request was blocked","b":"the server had no such resource - common and usually benign","c":"malware","d":"a redirect"},"answer_b64":"Yg=="},{"id":3,"type":"choice","prompt":"`user_agent: Mozilla/5.0 (WindowsPowerShell/5.1)` on an outbound request is worth a look because:","options":{"a":"it's a browser","b":"it advertises a scripting engine making web requests - not a person browsing","c":"all Mozilla UAs are malicious","d":"it's a 404"},"answer_b64":"Yg=="}],"hints":["http.log shows method/host/uri/user_agent/status - read it like a request line. ssl.log shows server_name, the SNI.","The /u.sh pull is plaintext HTTP so you see the URI; the C2 session is TLS so you only get SNI. The odd user-agent names a scripting engine, not a browser.","q1 200; q2 c2.stonewick[.]example (defanged, first ssl row); q3 the WindowsPowerShell user-agent, lowercased; q4 post; q5 the resumed row's server_name is -; q6 ssl."],"recap":["HTTP is readable: method, host, uri, user-agent, and status code are all in the clear - status 3xx redirects and 4xx not-founds are routine, not verdicts.","HTTPS hides the uri and body; the SNI (server_name in ssl.log) is the destination hostname you still get - until a resumed session drops it.","User-agents lie easily, but one advertising a scripting engine (curl, WindowsPowerShell) on outbound traffic is a cheap, useful tell."],"recall":null,"ungradable":false,"assertions":[{"fn":"exists","path":"http.log","hint":""},{"fn":"exists","path":"ssl.log","hint":""},{"fn":"exists","path":"answers.txt","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q1=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q2=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q3=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q4=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q5=","hint":""},{"fn":"contains","path":"answers.txt","arg":"^q6=","hint":""},{"fn":"contains","path":".answers.norm","arg":"^q1=200$","hint":""},{"fn":"contains_fixed","path":".answers.norm","arg":"q2=c2.stonewick[.]example","hint":""},{"fn":"contains_fixed","path":".answers.norm","arg":"q3=mozilla/5.0 (windowspowershell/5.1)","hint":""},{"fn":"contains","path":".answers.norm","arg":"^q4=post$","hint":""},{"fn":"contains","path":".answers.norm","arg":"^q5=-$","hint":""},{"fn":"contains","path":".answers.norm","arg":"^q6=ssl$","hint":""}],"norms":[{"source":"answers.txt","target":".answers.norm","comment":true,"nows":false,"trim":true,"variant":"standard"}],"graded_files":[{"name":"answers.txt","prefill":"# Read http.log and ssl.log and answer.\n\n# status code of the /u.sh payload pull\nq1=\n\n# the SNI (server_name) of the beacon's first TLS handshake - DEFANGED\nq2=\n\n# the user-agent string that is a scripting engine, not a browser\n# (verbatim, lowercased)\nq3=\n\n# HTTP method used to send data TO the server in the suspicious row\nq4=\n\n# in the resumed TLS row, what is server_name? (one token)\nq5=\n\n# which log would you use to find the destination hostname of an\n# HTTPS session: http or ssl\nq6=\n","expected":"","template":"answers.template.txt","tool_output":false}],"files":[{"name":"http.log","size":1400,"kind":"text","text":"#separator \\x09\n#set_separator\t,\n#empty_field\t(empty)\n#unset_field\t-\n#path\thttp\n#fields\tts\tuid\tid.orig_h\tid.orig_p\tid.resp_h\tid.resp_p\tmethod\thost\turi\tuser_agent\tstatus_code\trequest_body_len\tresponse_body_len\tevent_id\n#types\ttime\tstring\taddr\tport\taddr\tport\tstring\tstring\tstring\tstring\tcount\tcount\tcount\tstring\n2026-03-11T09:10:00Z\tCHT00001\t10.20.30.103\t49300\t192.0.2.61\t80\tGET\tupdates.example\t/patch/index.html\tMozilla/5.0 (Windows NT 10.0; Win64; x64)\t200\t0\t4820\tCM-0312-0590\n2026-03-11T09:10:05Z\tCHT00002\t10.20.30.103\t49301\t192.0.2.61\t80\tGET\tupdates.example\t/download\tMozilla/5.0 (Windows NT 10.0; Win64; x64)\t301\t0\t178\tCM-0312-0591\n2026-03-11T09:10:10Z\tCHT00003\t10.20.30.103\t49302\t192.0.2.61\t80\tGET\tupdates.example\t/favicon.ico\tMozilla/5.0 (Windows NT 10.0; Win64; x64)\t404\t0\t0\tCM-0312-0592\n2026-03-12T20:16:00Z\tCXush1\t10.20.10.20\t44601\t198.51.100.23\t80\tGET\tcdn.stonewick.example\t/u.sh\tcurl/7.81.0\t200\t0\t92\tCM-0312-0520\n2026-03-11T15:46:05Z\tCHT00005\t10.20.30.107\t49157\t192.0.2.61\t80\tPOST\tupdates.example\t/telemetry\tMozilla/5.0 (WindowsPowerShell/5.1)\t200\t212\t45\tCM-0312-0593\n2026-03-11T09:12:00Z\tCHT00006\t10.20.30.103\t49303\t192.0.2.61\t80\tGET\tupdates.example\t/assets/app.js\tMozilla/5.0 (Windows NT 10.0; Win64; x64)\t200\t0\t15400\tCM-0312-0594\n2026-03-11T09:12:05Z\tCHT00007\t10.20.31.112\t49304\t192.0.2.61\t80\tGET\tupdates.example\t/assets/style.css\tMozilla/5.0 (X11; Linux x86_64)\t200\t0\t3200\tCM-0312-0595\n"},{"name":"ssl.log","size":780,"kind":"text","text":"#separator \\x09\n#set_separator\t,\n#empty_field\t(empty)\n#unset_field\t-\n#path\tssl\n#fields\tts\tuid\tid.orig_h\tid.orig_p\tid.resp_h\tid.resp_p\tversion\tcipher\tserver_name\tresumed\testablished\tevent_id\n#types\ttime\tstring\taddr\tport\taddr\tport\tstring\tstring\tstring\tbool\tbool\tstring\n2026-03-11T09:00:00Z\tCST00001\t10.20.30.107\t49150\t192.0.2.60\t443\tTLSv13\tTLS_AES_128_GCM_SHA256\tsaas.mail.example\tF\tT\tCM-0311-0590\n2026-03-11T15:46:02Z\tCXbeac1\t10.20.30.107\t49156\t203.0.113.66\t443\tTLSv12\tECDHE-RSA-AES128-GCM-SHA256\tc2.stonewick.example\tF\tT\tCM-0311-0502\n2026-03-11T15:51:02Z\tCXbeac2\t10.20.30.107\t49158\t203.0.113.66\t443\tTLSv12\tECDHE-RSA-AES128-GCM-SHA256\t-\tT\tT\tCM-0311-0591\n2026-03-11T09:15:00Z\tCST00004\t10.20.30.103\t49305\t192.0.2.61\t443\tTLSv13\tTLS_AES_128_GCM_SHA256\tupdates.example\tF\tT\tCM-0311-0592\n"}]},{"id":"L2.4","dir":"L2.4-tshark-pcap","phase":"p2","order":[2,4],"meta":{"id":"L2.4","title":"tshark first contact - carving answers out of a PCAP from the command line","type":"GUIDED","objective":"Carve DNS, HTTP request, user-agent, and status facts out of a pcap with tshark field extraction, and follow a TCP stream.","gate":false,"est_minutes":15},"lab_md":"## BRIEF\nA pcap is queryable from the shell: `tshark -r file -Y <display filter> -T fields -e <field>` pulls\nexactly the fact you need, and `-z follow,tcp,ascii,<n>` reassembles a whole conversation. This is a\nGUIDED lab — run every command for real; the files they produce are what gets graded.\n\n## GUIDED STEPS\n\n1. **Extract the DNS query and answer**:\n   ```bash\n   tshark -r capture.pcap -Y 'dns.flags.response==0' -T fields -e dns.qry.name | sort -u > dns_q.txt\n   tshark -r capture.pcap -Y 'dns.flags.response==1' -T fields -e dns.a | sort -u > dns_a.txt\n   cat dns_q.txt dns_a.txt\n   ```\n   ```\n   cdn.stonewick.example\n   198.51.100.23\n   ```\n\n2. **Extract the HTTP request line and user-agent**:\n   ```bash\n   tshark -r capture.pcap -Y http.request -T fields -e http.request.method -e http.host -e http.request.uri > http_req.txt\n   tshark -r capture.pcap -Y http.request -T fields -e http.user_agent > http_ua.txt\n   cat http_req.txt http_ua.txt\n   ```\n   ```\n   GET\tcdn.stonewick.example\t/u.sh\n   curl/7.81.0\n   ```\n\n3. **Extract the HTTP status code**:\n   ```bash\n   tshark -r capture.pcap -Y 'http.response' -T fields -e http.response.code > http_status.txt\n   cat http_status.txt\n   ```\n   ```\n   200\n   ```\n\n4. **Record your answers**:\n   Copy `answers.template.txt` to `answers.txt`:\n   ```bash\n   cp answers.template.txt answers.txt\n   ```\n   Fill in each field from what you just carved:\n   - `q1`: qname the client resolved — defanged\n   - `q2`: IP it resolved to — defanged\n   - `q3`: HTTP method + URI, space-joined, lowercased\n   - `q4`: user-agent of the request, lowercased\n   - `q5`: HTTP status code returned\n\n   (`dns_q.txt`/`dns_a.txt`/`http_req.txt`/`http_status.txt` are tool output, not learner prose — leave\n   them exactly as tshark produced them, fanged. Only your `answers.txt` IOCs get defanged.)\n\n5. **OPTIONAL, UNGRADED — follow the whole TCP stream as text**:\n   ```bash\n   tshark -r capture.pcap -z follow,tcp,ascii,0 -q\n   ```\n   ```\n   ===================================================================\n   Follow: tcp,ascii\n   Filter: tcp.stream eq 0\n   Node 0: 10.20.10.20:44601\n   Node 1: 198.51.100.23:80\n   89\n   GET /u.sh HTTP/1.1\n   Host: cdn.stonewick.example\n   User-Agent: curl/7.81.0\n   Accept: */*\n\n\n   \t157\n   HTTP/1.1 200 OK\n   Content-Type: text/plain\n   Content-Length: 92\n\n   #!/bin/sh\n   # inert simulacrum - a comment, not a working payload; nothing here runs anything\n\n   ===================================================================\n   ```\n   `-z follow,tcp` reassembles scattered packets back into the full request and response — the same\n   conversation you carved field-by-field above, now readable as one exchange.\n\n6. **Check your work**:\n   ```bash\n   lab check soc L2.4\n   ```\n\n## SECURITY ONION (OPTIONAL)\nThe same pcap can be uploaded to `cardinal-so` and pivoted in the PCAP/Zeek view of the Hunt UI; the\ntshark path above is the graded one — the VM is optional and nothing here checks for it.\n","quiz":[{"id":1,"type":"choice","prompt":"`tshark -r f.pcap -T fields -e http.host` does what?","options":{"a":"captures live traffic","b":"reads a saved pcap and prints the http.host field of matching packets","c":"needs root","d":"decrypts TLS"},"answer_b64":"Yg=="},{"id":2,"type":"choice","prompt":"Why can tshark show you `GET /u.sh` here but not the URI of the C2 session in L2.3?","options":{"a":"tshark can't read GET","b":"the /u.sh fetch is plaintext HTTP; the C2 session is TLS-encrypted","c":"the pcap is corrupt","d":"URIs are always hidden"},"answer_b64":"Yg=="},{"id":3,"type":"text","prompt":"Which tshark option reassembles and prints a full TCP conversation as text? (the `-z follow,tcp,ascii,<n>` form - answer just the flag, e.g. -z)","answer_b64":"LXo=","accept_b64":["LXo=","eg=="]}],"hints":["Every answer is one `tshark -r capture.pcap -T fields -e <field>` away; add `-Y <filter>` to pick the right packets (e.g. `-Y http.request`).","DNS: `dns.qry.name` for the question, `dns.a` for the answer. HTTP: `http.request.method`, `http.host`, `http.request.uri`, `http.user_agent`, `http.response.code`. Your answers.txt IOCs must be defanged even though the tool output isn't.","q1 cdn.stonewick[.]example; q2 198.51.100[.]23; q3 get /u.sh; q4 curl/7.81.0; q5 200."],"recap":["A pcap is queryable from the shell: `tshark -r file -Y <filter> -T fields -e <field>` pulls exactly one fact per column.","Plaintext HTTP exposes method, host, uri, and user-agent; TLS would leave you only the SNI - the same lesson as the logs.","`-z follow,tcp` reassembles a whole conversation, turning scattered packets back into the request and response you can read."],"recall":null,"ungradable":false,"asser
